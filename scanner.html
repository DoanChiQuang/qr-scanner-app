<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
</head>
<body>
  <h1>QR Scanner</h1>
  <input type="file" id="fileInput" accept="image/*">
  <div id="result"></div>

  <script type="module">
    import { readBarcodes, prepareZXingModule, ZXING_WASM_VERSION } from 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.1/+esm';

    await prepareZXingModule({
      overrides: {
        locateFile: (path, prefix) => {
          if (path.endsWith('.wasm')) {
            return `https://cdn.jsdelivr.net/npm/zxing-wasm@${ZXING_WASM_VERSION}/dist/reader/${path}`;
          }
          return prefix + path;
        }
      }
    });

    const fileInput = document.getElementById('fileInput');
    const result = document.getElementById('result');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      result.textContent = 'Đang xử lý...';

      try {
        const buf = await file.arrayBuffer();
        const results = await readBarcodes(new Uint8Array(buf), {
          formats: ['QRCode']
        });

        if (results.length > 0) {
          result.textContent = 'Kết quả: ' + results[0].text;
        } else {
          result.textContent = 'Không tìm thấy mã QR';
        }
      } catch (err) {
        result.textContent = 'Lỗi: ' + err.message;
      }
    });
  </script>
</body>
</html>
