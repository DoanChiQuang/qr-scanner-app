<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Runner Checkin/Checkout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.1/dist/iife/full/index.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-center mb-4">Runner Checkin / Checkout</h1>

    <div id="loginView" class="space-y-3">
      <input id="username" class="w-full p-3 border rounded" placeholder="Tên đăng nhập" />
      <input id="password" type="password" class="w-full p-3 border rounded" placeholder="Mật khẩu" />
      <button id="btnLogin" class="w-full py-3 bg-blue-600 text-white rounded">Đăng nhập</button>
      <div id="loginMsg" class="text-sm text-red-600 mt-2"></div>
    </div>

    <div id="dashboardView" class="hidden space-y-3">
      <div class="flex gap-2">
        <button id="modeCheckin" class="flex-1 py-2 bg-green-500 text-white rounded">Checkin</button>
        <button id="modeCheckout" class="flex-1 py-2 bg-yellow-500 text-white rounded">Checkout</button>
      </div>

      <div class="mt-2">
        <video id="video" class="w-full rounded bg-black" playsinline></video>
        <div class="flex gap-2 mt-2">
          <button id="btnStart" class="flex-1 py-2 bg-indigo-600 text-white rounded">Bấm Quét QR</button>
          <button id="btnStop" class="flex-1 py-2 bg-gray-300 text-black rounded">Dừng</button>
        </div>
      </div>

      <div class="mt-4">
        <h2 class="font-semibold">Kết quả</h2>
        <ul id="resultList" class="mt-2 space-y-2 max-h-64 overflow-auto"></ul>
      </div>

      <div class="mt-4 text-sm text-gray-600">Đăng nhập dưới cookie session từ server; client dùng fetch với credentials include.</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
