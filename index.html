<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="styles.css">
    <style>
        #qr-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 16px;
        }
    </style>
    <script src="https://unpkg.com/@zxing/library@0.21.0"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <div class="wrapper">
        <div class="header">
        </div>
        <div class="scanner-frame" id="scanner-frame-container">
        </div>
        <div class="instruction-text">
        </div>
        <div class="info-section">
        </div>
        <a href="#" title="" class="btn start">Press to Scan</a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const codeReader = new ZXing.BrowserQRCodeReader();
            CheckinModule.init(codeReader);
        });

        const CheckinModule = {
            config: {
                baseUrl: 'https://api.esportsfan.net/',
                videoId: 'qr-video',
                apis: {
                    getTicketDetail: 'ticket/detail',
                    checkin: '',
                },
                selectors: {
                    qrScannerContainer: '#scanner-frame-container',
                    qrScannerHeader: '.header',
                    qrScannerInstruction: '.instruction-text',
                    qrScannerInfoSection: '.info-section',
                    qrScannerBtnStartScan: '.btn.start',
                },
                statusCode: {
                    SCAN_QRCODE_RESET: 0,
                    SCAN_QRCODE_ERROR: 1,
                    USER_CHECKEDIN: 2,
                    USER_CONFIRMATION: 3,
                    USER_CONFIRMATION_SUCCESS: 4,
                    USER_CONFIRMATION_ERROR: 5,
                }
            },

            state: {
                stream: null,
                isGrantedCameraPermission: false,
                codeReader: null,
                isInitialized: false,
                isScanning: false,
                ticketDetail: null,
                error: null
            },

            refs: {
                video: null
            },

            init(codeReader = null) {
                let _self = this;
                let {
                    state
                } = _self;
                if (state.isInitialized) {
                    this.setError('Checkin Module Already Initialized');
                    return;
                };
                state.isInitialized = true;

                if (state.codeReader) {
                    this.setError('ZXing Library Already Initialized');
                    return;
                }
                state.codeReader = codeReader;

                _self.setupDOM();
                _self.bindEvents();

                console.log('--- Checkin Module Initialized ---');
            },

            setupDOM() {
                let _self = this;
                let {
                    selectors,
                    videoId
                } = _self.config;

                $(selectors.qrScannerHeader).html('');
                $(selectors.qrScannerContainer).html(`
                    <div class="scanner-line"></div>
                    <video id="qr-video" width="100%" height="100%"></video>
                `);
                $(selectors.qrScannerInstruction).html('Đặt mã QR vào khung để quét').removeClass('error');
                $(selectors.qrScannerInfoSection).html('');

                _self.refs.video = document.getElementById(videoId);
            },

            updateDOM(code) {
                let _self = this;
                let {
                    selectors,
                    statusCode
                } = _self.config;

                $(selectors.qrScannerHeader).html('');
                $(selectors.qrScannerInstruction).html('').removeClass('error');
                $(selectors.qrScannerInfoSection).html('');

                switch (code) {
                    case statusCode.SCAN_QRCODE_ERROR:
                        $(selectors.qrScannerContainer).html('<img src="images/qrcode.png" alt="">');
                        $(selectors.qrScannerHeader).html('<h1 class="title">Thông báo</h1><p class="error">Mã checkin không hợp lệ</p>');
                        $(selectors.qrScannerInstruction).html('Vui lòng kiểm tra lại thông tin').addClass('error');
                        break;
                    case statusCode.USER_CHECKEDIN:
                        $(selectors.qrScannerContainer).html('<img src="images/qrcode.png" alt="">');
                        $(selectors.qrScannerHeader).html('<h1 class="title">Thông báo</h1><p class="checked">Đã checkin</p>');
                        $(selectors.qrScannerInfoSection).html(this.generateInfoRows('', 'Đã checkin'));
                        break;
                    case statusCode.USER_CONFIRMATION:
                        $(selectors.qrScannerContainer).html('<img src="images/qrcode.png" alt="">');
                        $(selectors.qrScannerHeader).html('<h1 class="title">Thông báo</h1><p class="">Xác nhận checkin</p>');
                        $(selectors.qrScannerInfoSection).html(this.generateInfoRows('error', 'Chưa checkin'));
                        break;
                    case statusCode.USER_CONFIRMATION_SUCCESS:
                        $(selectors.qrScannerContainer).html('<img src="images/qrcode.png" alt="">');
                        $(selectors.qrScannerHeader).html('<h1 class="title">Thông báo</h1><p class="confirmed">Xác nhận checkin</p>');
                        $(selectors.qrScannerInfoSection).html(this.generateInfoRows('confirmed', 'Đã checkin'));
                        break;
                    case statusCode.USER_CONFIRMATION_ERROR:
                        $(selectors.qrScannerContainer).html('<img src="images/qrcode.png" alt="">');
                        $(selectors.qrScannerHeader).html('<h1 class="title">Thông báo</h1><p class="error">Xác nhận không thành công vui lòng thử lại</p>');
                        $(selectors.qrScannerInfoSection).html(this.generateInfoRows('error', 'Chưa checkin'));
                        break;
                    default:
                        _self.setError('Status Code Not Found');
                        break;
                }
            },

            generateInfoRows(statusClass = '', statusText = '') {
                let _self = this;
                let {
                    ticketDetail
                } = _self.state;

                if (!ticketDetail) return '';
                return `
                    <div class="info-row"><span>Trạng thái:</span><span class="${statusClass}">${statusText}</span></div>
                    <div class="info-row"><span>Họ tên:</span><span>${ticketDetail.fullName}</span></div>
                    <div class="info-row"><span>Số điện thoại:</span><span>${ticketDetail.phone}</span></div>
                    <div class="info-row"><span>Hạng vé:</span><span>${ticketDetail.ticketClass}</span></div>
                    <div class="info-row"><span>Loại vé:</span><span>${ticketDetail.ticketType}</span></div>
                    <div class="info-row"><span>Ngày diễn ra:</span><span>${ticketDetail.eventDate}</span></div>
                `;
            },

            setError(error) {
                let _self = this;
                _self.state.error = error;
                alert(error);
                console.error(error);
            },

            destroy() {
                let _self = this;
                let {
                    state
                } = _self;
                _self.stopScanner();
                state.isInitialized = false;
                console.log('--- Checkin Module Destroyed ---');
            },

            bindEvents() {
                let _self = this;
                let {
                    state,
                    config: {
                        selectors
                    }
                } = _self;

                $(selectors.qrScannerBtnStartScan).click(async function () {
                    _self.toggleScanner();
                });
            },

            async grantCameraPermissions() {
                let _self = this;
                let {
                    state,
                    refs
                } = _self;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment'
                        }
                    });
                    state.stream = stream;
                    state.isGrantedCameraPermission = true;
                    return true;
                } catch (error) {
                    state.isGrantedCameraPermission = false;
                    _self.setError('Camera Access Denied: ' + error.message);
                    return false;
                }
            },

            toggleScanner() {
                let _self = this;;
                _self.state.isScanning ? _self.stopScanner() : _self.startScanner();
            },

            async startScanner() {
                let _self = this;
                let {
                    state,
                    config: {
                        videoId,
                        selectors
                    }
                } = _self;
                try {
                    if (state.isScanning) {
                        throw new Error('Scanner Already Running');
                    }

                    if (!state.isGrantedCameraPermission) {
                        const granted = await this.grantCameraPermissions();
                        if (!granted) return;
                    }

                    state.isScanning = true;
                    $(selectors.qrScannerBtnStartScan).prop('disabled', true);

                    state.codeReader.decodeOnceFromVideoDevice(undefined, videoId).then((result) => {
                        if (result) {
                            _self.handleScanResult(result.text);
                        }
                        _self.stopScanner();
                    }).catch((error) => {
                        if (state.isScanning) {
                            _self.setError('Scanning Error:', error);
                            _self.stopScanner();
                        }
                    });
                } catch (error) {
                    _self.setError(error.message);
                    _self.stopScanner();
                }
            },

            async stopScanner() {
                let _self = this;
                let {
                    state,
                    config: {
                        selectors
                    }
                } = _self;
                try {
                    if (!state.isScanning) return;

                    state.isScanning = false;
                    await state.codeReader.reset();
                    $(selectors.qrScannerBtnStartScan).prop('disabled', false);
                    $(selectors.qrScannerInstruction).html('Đặt mã QR vào khung để quét');

                    if (state.stream) {
                        state.stream.getTracks().forEach(track => track.stop());
                        state.stream = null;
                    }
                } catch (error) {
                    this.setError(error.message);
                }
            },

            async handleScanResult(data) {
                let _self = this;
                let {
                    state,
                    config: {
                        statusCode
                    }
                } = _self;
                try {
                    const content = _self.deobfuscateData(data);
                    const result = _self.parseScannedData(content);
                    if (result.version != 1 || result.fields.length == 0) {
                        // Alert
                        return;
                    }
                    state.ticketDetail = _self.getTicketDetail(content);
                    alert('Ticket Detail: ' + JSON.stringify(state.ticketDetail));
                    if (state.ticketDetail.is_checkin) {
                        _self.updateDOM(statusCode.USER_CHECKEDIN);
                        return;
                    } else {
                        _self.updateDOM(statusCode.USER_CONFIRMATION);
                        return;
                    }
                } catch (error) {
                    _self.setError(error.message);
                }
            },

            deobfuscateData(encoded, secret = 'sEcReT123') {
                const b64 = encoded.split('').reverse().join('');
                const base64 = b64.replace(/-/g, '+').replace(/_/g, '/');
                let raw = '';
                try { raw = atob(base64); } catch (e) { raw = ''; }
                return raw.replaceAll(secret, '');
            },

            parseScannedData(data) {
                if (!data || typeof data !== 'string') return { version: '', fields: [] };
                const parts = data.split('|');
                return {
                    version: parts[0] || '',
                    fields: parts.slice(1)
                };
            },

            getTicketDetail(content) {
                let _self = this;
                let {
                    config: {
                        apis
                    }
                } = _self;

                let data = null;
                if (!content) return data;

                $.ajax({
                    url: apis.getTicketDetail,
                    method: 'POST',
                    data: {
                        content
                    },
                    success: (response) => {
                        if (response && response.code == 200 && response.data) {
                            data = response.data;
                        }
                    },
                    error: (xhr, status, error) => {
                        // Alert
                    }
                });

                return data;
            }
        };
    </script>
</body>

</html>
