<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        #qr-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 16px;
        }

        .btn-group {
            width: 100%;
            max-width: 295px;
            display: flex;
            justify-content: center;
            gap: 8px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
    <script src="https://unpkg.com/@zxing/library@0.21.0"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>

<body>
    <div class="wrapper">
        <div class="scanner-frame" id="scanner-frame-container">
        </div>
        <div class="instruction-text">
        </div>
        <div class="info-section">
        </div>
        <div class="btn-group">
            <a href="#" title="Reset" class="btn grey" id="btn-reset-scan">Reset</a>
            <a href="#" title="Scan QR" class="btn" id="btn-start-scan">Scan QR</a>
            <a href="#" title="Confirm" class="btn" id="btn-confirm">Confirm</a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const codeReader = new ZXing.BrowserQRCodeReader();
            CheckinModule.init(codeReader);
        });

        const CheckinModule = {
            config: {
                baseUrl: 'https://api.esportsfan.net/',
                videoId: 'qr-video',
                apis: {
                    getTicketDetail: 'ticket/detail',
                    confirmCheckin: 'ticket/confirm-checkin',
                },
                selectors: {
                    qrScannerContainer: '#scanner-frame-container',
                    qrScannerInstruction: '.instruction-text',
                    qrScannerInfoSection: '.info-section',
                    qrScannerBtnResetScan: '#btn-reset-scan',
                    qrScannerBtnStartScan: '#btn-start-scan',
                    qrScannerBtnConfirm: '#btn-confirm',
                },
                statusCode: {
                    USER_CHECKEDIN: 1,
                    USER_CONFIRMATION: 2,
                    USER_CONFIRMATION_SUCCESS: 3,
                },
                timeoutDuration: 5000
            },

            state: {
                loading: false,
                timeoutId: null,
                stream: null,
                isGrantedCameraPermission: false,
                codeReader: null,
                isInitialized: false,
                isScanning: false,
                ticketDetail: null,
                error: null
            },

            refs: {
                video: null
            },

            init(codeReader = null) {
                let _self = this;
                let {
                    state,
                    config
                } = _self;

                if (state.isInitialized) {
                    this.setError('Checkin Module Already Initialized');
                    return;
                };
                state.isInitialized = true;

                if (state.codeReader) {
                    this.setError('ZXing Library Already Initialized');
                    return;
                }
                state.codeReader = codeReader;

                _self.setupDOM();
                _self.bindEvents();

                console.log('--- Checkin Module Initialized ---');
            },

            setupDOM() {
                let _self = this;
                let {
                    state,
                    config: {
                        selectors,
                        videoId
                    }
                } = _self;

                state.ticketDetail = null;
                state.error = null;

                $(selectors.qrScannerContainer).html(`
                    <div class="scanner-line"></div>
                    <video id="qr-video" width="100%" height="100%"></video>
                `);
                $(selectors.qrScannerInstruction).html('Đặt mã QR vào khung để quét').removeClass('error');
                $(selectors.qrScannerInfoSection).html('');

                $(selectors.qrScannerBtnConfirm).hide();
                $(selectors.qrScannerBtnStartScan).show();

                _self.refs.video = document.getElementById(videoId);
            },

            updateDOM(code) {
                let _self = this;
                let {
                    selectors,
                    statusCode
                } = _self.config;

                $(selectors.qrScannerHeader).html('');
                $(selectors.qrScannerInstruction).html('').removeClass('error');
                $(selectors.qrScannerInstruction).html('').removeClass('checked');
                $(selectors.qrScannerInstruction).html('').removeClass('confirmed');
                $(selectors.qrScannerInfoSection).html('');

                switch (code) {
                    case statusCode.USER_CHECKEDIN:
                        $(selectors.qrScannerContainer).html('<img src="remove.png" alt="">');
                        $(selectors.qrScannerInstruction).html('Thông báo: Vé đã được sử dụng').addClass('error');
                        $(selectors.qrScannerInfoSection).html(this.generateInfoRows('', 'Đã checkin'));
                        break;
                    case statusCode.USER_CONFIRMATION:
                        $(selectors.qrScannerContainer).html('<img src="clock.png" alt="">');
                        $(selectors.qrScannerInstruction).html('Thông báo: Vé đang đợi xác nhận').addClass('checked');
                        $(selectors.qrScannerInfoSection).html(this.generateInfoRows('error', 'Chưa checkin'));
                        $(selectors.qrScannerBtnConfirm).show();
                        break;
                    case statusCode.USER_CONFIRMATION_SUCCESS:
                        $(selectors.qrScannerContainer).html('<img src="check.png" alt="">');
                        $(selectors.qrScannerInstruction).html('Thông báo: Xác nhận thành công').addClass('confirmed');
                        $(selectors.qrScannerInfoSection).html(this.generateInfoRows('confirmed', 'Đã checkin'));
                        $(selectors.qrScannerBtnConfirm).hide();
                        break;
                }
            },

            generateInfoRows(statusClass = '', statusText = '') {
                let _self = this;
                let {
                    ticketDetail
                } = _self.state;

                if (!ticketDetail) return '';
                return `
                    <div class="info-row"><span>Trạng thái: </span><span class="${statusClass}">${statusText}</span></div>
                    <div class="info-row"><span>Họ tên: </span><span>${ticketDetail.contact_name}</span></div>
                    <div class="info-row"><span>Số điện thoại: </span><span>${ticketDetail.contact_phone}</span></div>
                    <div class="info-row"><span>Email: </span><span>${ticketDetail.contact_email}</span></div>
                    <div class="info-row"><span>Hạng vé: </span><span>${ticketDetail.ticket_class_name}</span></div>
                    <div class="info-row"><span>Ngày diễn ra: </span><span>${ticketDetail.event_time ? moment.unix(ticketDetail.event_time).format('HH:mm DD-MM-YYYY') : ''}</span></div>
                    ${ticketDetail?.gifts
                        ? `
                            <div class="info-row"><span>Quà: </span><span>${ticketDetail.gifts?.name} (${ticketDetail.gifts.status == 1 ? 'Chưa nhận' : 'Đã nhận'})</span></div>
                            <div class="info-row"><span>- Kích thước: </span><span>${ticketDetail.gifts?.option}</span></div>
                            <div class="info-row"><span>- Số lượng: </span><span>${ticketDetail.gifts?.quantity}</span></div>
                        `
                        : ''
                    }
                `;
            },

            setError(error) {
                let _self = this;
                _self.state.error = error;
                _self.showToast(error, 'error', 5000);
                console.error(error);
            },

            destroy() {
                let _self = this;
                let {
                    state
                } = _self;
                _self.stopScanner();
                state.isInitialized = false;
                console.log('--- Checkin Module Destroyed ---');
            },

            bindEvents() {
                let _self = this;
                let {
                    state,
                    config: {
                        selectors
                    }
                } = _self;

                $(selectors.qrScannerBtnStartScan).click(function () {
                    _self.startScanner();
                });

                $(selectors.qrScannerBtnResetScan).click(function () {
                    _self.resetScanner();
                });

                $(selectors.qrScannerBtnConfirm).click(function () {
                    _self.handleConfirmCheckin();
                });
            },

            async grantCameraPermissions() {
                let _self = this;
                let {
                    state,
                    refs
                } = _self;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment'
                        }
                    });
                    state.stream = stream;
                    state.isGrantedCameraPermission = true;
                    return true;
                } catch (error) {
                    state.isGrantedCameraPermission = false;
                    _self.setError('Camera Access Denied: ' + error.message);
                    return false;
                }
            },

            resetScanner() {
                let _self = this;
                _self.stopScanner();
                _self.setupDOM();
            },

            async startScanner() {
                let _self = this;
                let {
                    state,
                    config: {
                        videoId,
                        selectors,
                        timeoutDuration
                    }
                } = _self;
                try {
                    if (state.isScanning) {
                        _self.setError('Scanner Already Running');
                    }

                    if (!state.isGrantedCameraPermission) {
                        const granted = await _self.grantCameraPermissions();
                        if (!granted) return;
                    }

                    state.isScanning = true;
                    $(selectors.qrScannerBtnStartScan).hide();

                    state.timeoutId = setTimeout(() => {
                        _self.resetScanner();
                        _self.setError('Scan Timeout. Please try again.');
                    }, timeoutDuration);

                    state.codeReader.decodeOnceFromVideoDevice(undefined, videoId).then((result) => {
                        if (result) {
                            _self.handleScanResult(result.text);
                        }
                    }).catch((error) => {
                        if (state.isScanning) {
                            _self.setError('Scanning Error: ', error);
                        }
                    }).finally(() => {
                        if (state.timeoutId) {
                            clearTimeout(state.timeoutId);
                            state.timeoutId = null;
                        }
                        _self.stopScanner();
                    });
                } catch (error) {
                    _self.setError('Scanning Error' + error.message);
                    _self.stopScanner();
                }
            },

            async stopScanner() {
                let _self = this;
                let {
                    state,
                    config: {
                        selectors
                    }
                } = _self;
                try {
                    if (!state.isScanning) return;

                    state.isScanning = false;
                    await state.codeReader.reset();

                    if (state.stream) {
                        state.stream.getTracks().forEach(track => track.stop());
                        state.stream = null;
                    }
                } catch (error) {
                    this.setError(error.message);
                }
            },

            async handleScanResult(data) {
                let _self = this;
                let {
                    state,
                    config: {
                        statusCode,
                    }
                } = _self;

                try {
                    const content = _self.deobfuscateData(data);
                    const result = _self.parseScannedData(content);
                    if (result.version != 1 || result.fields.length == 0) {
                        _self.setError('Invalid QR Code Data');
                        return;
                    }
                    state.ticketDetail = await _self.getTicketDetail(content);
                    if (!state.ticketDetail) {
                        _self.setError('Ticket Not Found or Invalid');
                        return;
                    }
                    if (state.ticketDetail.is_checkin) {
                        _self.updateDOM(statusCode.USER_CHECKEDIN);
                        return;
                    } else {
                        _self.updateDOM(statusCode.USER_CONFIRMATION);
                        return;
                    }
                } catch (error) {
                    _self.setError(error.message);
                }
            },

            async handleConfirmCheckin() {
                let _self = this;
                let {
                    state,
                    config: {
                        statusCode
                    }
                } = _self;
                try {
                    if (!state.ticketDetail || !state.ticketDetail.ticket_code) {
                        _self.setError('No Ticket to Confirm');
                        return;
                    }
                    const isConfirm = await _self.confirmCheckin(state.ticketDetail.ticket_code);
                    if (isConfirm) {
                        _self.updateDOM(statusCode.USER_CONFIRMATION_SUCCESS);
                        _self.showToast('Check-in Successful', 'success', 5000);
                    } else {
                        _self.setError('Check-in Failed');
                    }
                } catch (error) {
                    _self.setError(error.message);
                }
            },

            deobfuscateData(encoded, secret = 'sEcReT123') {
                const b64 = encoded.split('').reverse().join('');
                const base64 = b64.replace(/-/g, '+').replace(/_/g, '/');
                let raw = '';
                try { raw = atob(base64); } catch (e) { raw = ''; }
                return raw.replaceAll(secret, '');
            },

            parseScannedData(data) {
                if (!data || typeof data !== 'string') return { version: '', fields: [] };
                const parts = data.split('|');
                return {
                    version: parts[0] || '',
                    fields: parts.slice(1)
                };
            },

            async getTicketDetail(content) {
                let _self = this;

                _self.state.loading = true;
                let data = null;

                if (!content) {
                    return data;
                }
                try {
                    const response = await fetch(_self.getApiUrl('getTicketDetail'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: content })
                    });
                    const result = await response.json();
                    if (result && result.code == 200 && result.data) {
                        data = result.data;
                    }
                } catch (error) {
                    _self.setError('Api Error: ' + error.message);
                } finally {
                    _self.state.loading = false;
                }

                return data;
            },

            async confirmCheckin(code) {
                let _self = this;

                if (!code) {
                    return false;
                }
                try {
                    const response = await fetch(_self.getApiUrl('confirmCheckin'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ticket_code: code })
                    });
                    const result = await response.json();
                    if (result && result.code == 200) {
                        return true;
                    }
                    return false;
                } catch (error) {
                    _self.setError('Api Error: ' + error.message);
                    return false;
                }
            },

            getApiUrl(endpoint) {
                let _self = this;
                let {
                    config: {
                        baseUrl,
                        apis
                    }
                } = _self;
                return baseUrl + (apis[endpoint] || '');
            },

            showToast(message, type = 'info', duration = 3000) {
                let bgColor = 'linear-gradient(to right, #00b09b, #96c93d)';
                if (type === 'error') {
                    bgColor = 'linear-gradient(to right, #ff5f6d, #ffc371)';
                } else if (type === 'success') {
                    bgColor = 'linear-gradient(to right, #56ab2f, #a8e063)';
                }
                Toastify({
                    text: message,
                    duration: duration,
                    close: true,
                    gravity: "top",
                    position: "right",
                    style: {
                        background: bgColor,
                    }
                }).showToast();
            }
        };
    </script>
</body>

</html>
