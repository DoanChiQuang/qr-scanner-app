    <script>
        class Config {
            static API_BASE_URL = 'https://api.esportsfan.net/';
            static TURNSTILE_SITE_KEY = '0x4AAAAAAAOOjy5Nup_zy_9p';
            static TIMEOUT_DURATION = 10000;
            static STATUS_CODES = {
                USER_CHECKEDIN: 1,
                USER_CONFIRMATION: 2,
                USER_CONFIRMATION_SUCCESS: 3
            };
            static ICONS = {
                CHECK: 'icon-check.png',
                CLOCK: 'icon-clock.png',
                REMOVE: 'icon-remove.png',
            };
        }

        class Logger {
            static log(module, type, message, data = null) {
                const logMessage = `[${module}] [${type}] ${message}`;
                type === 'error' ? console.error(logMessage) : console.log(logMessage);
                if (data) console.log(data);
            }
        }

        class ToastService {
            static show(message, type = 'info', duration = 3000) {
                const backgrounds = {
                    info: 'linear-gradient(to right, #00b09b, #96c93d)',
                    error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                    success: 'linear-gradient(to right, #56ab2f, #a8e063)'
                };

                Toastify({
                    text: message,
                    duration,
                    close: true,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: backgrounds[type] || backgrounds.info
                    }
                }).showToast();
            }
        }

        class ApiService {
            static async fetch(endpoint, options = {}) {
                try {
                    const response = await fetch(`${Config.API_BASE_URL}${endpoint}`, {
                        ...options,
                        credentials: 'include',
                    });
                    const result = await response.json();
                    Logger.log('ApiService', 'info', `[API][${endpoint}] Response:`, result);
                    if (result.code != 200) throw new Error(result.message || 'API request failed');
                    return result.data ? result.data : true;
                } catch (error) {
                    Logger.log('ApiService', 'error', `[API][${endpoint}]: ${error.message}`);
                    throw error;
                }
            }
        }

        class AuthModule {
            selectors = {
                main: '#main',
                form: '#form',
                btnLogin: '#btn-login'
            };

            state = {
                accountInfo: null
            };

            async init() {
                let _self = this;
                await _self.getAccountInfo().then(info => {
                    _self.state.accountInfo = info;
                }).catch(() => {
                    ToastService.show('Session expired. Please log in again.', 'error', 5000);
                });
                Logger.log('AuthModule', 'info', 'Initialized');
                return _self;
            }

            render() {
                let _self = this;
                $(_self.selectors.main).html(`
                    <div class="header">
                        <h1 class="title">Login</h1>
                    </div>
                    <form id="form" method="POST">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required><br><br>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required><br><br>
                        <button type="submit" class="btn" id="btn-login">Submit</button>
                    </form>
                `);
                _self.bindEvents();
            }

            isLoggedIn() {
                let _self = this;
                return !!_self.state.accountInfo;
            }

            bindEvents() {
                let _self = this;
                let {
                    selectors
                } = _self;
                $(document).on('submit', selectors.form, async (e) => {
                    e.preventDefault();
                    $(selectors.btnLogin).prop('disabled', true).text('Logging in...').addClass('grey');
                    try {
                        const token = await new Promise((resolve) => _self.renderTurnstile(resolve));
                        await _self.handleLogin(token);
                    } catch (error) {
                        ToastService.show(error.message, 'error', 5000);
                        Logger.log('AuthModule', 'error', error.message);
                    } finally {
                        $(selectors.btnLogin).prop('disabled', false).text('Submit').removeClass('grey');
                    }
                });
            }

            async handleLogin(token = null) {
                let _self = this;
                const email = $('#email').val();
                const password = $('#password').val();
                if (!email || !password) throw new Error('Please enter email and password');

                const result = await ApiService.fetch('account/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email,
                        password,
                        _token: token
                    })
                });

                if (result?.session_id && result?.account) {
                    _self.state.accountInfo = result.account;
                    window.location.reload();
                } else {
                    throw new Error('Login failed. Please check your credentials');
                }
            }

            async getAccountInfo() {
                return await ApiService.fetch('account/info', {
                    method: 'GET'
                });
            }

            renderTurnstile(callback) {
                if (window.turnstile) {
                    turnstile.render('#turnstile-container', {
                        sitekey: Config.TURNSTILE_SITE_KEY,
                        callback,
                        'error-callback': () => ToastService.show('Captcha verification failed. Please try again', 'error', 5000)
                    });
                }
            }
        }

        class CheckoutModule {
            selectors = {
                main: '#main',
                container: '#scanner-frame-container',
                instruction: '.instruction-text',
                info: '.info-section',
                btnGroup: '.btn-group',
                btnReset: '#btn-reset-scan',
                btnStart: '#btn-start-scan',
                btnCapture: '#btn-capture',
                btnConfirm: '#btn-confirm',
                btnNext: '#btn-next-scan',
                modal: '#modal'
            };

            state = {
                isInitialized: false,
                isScanning: false,
                hasResult: false,
                ticketDetail: null,
                codeReader: null,
                timeoutId: null,
                isCameraGranted: false
            };

            constructor() {
                let _self = this;
                _self.videoId = 'qr-video';
            }

            async init(codeReader) {
                let _self = this;
                if (_self.state.isInitialized) {
                    ToastService.show('Checkout Module Already Initialized', 'error', 5000);
                    return _self;
                }

                _self.state.isInitialized = true;
                _self.state.codeReader = codeReader;
                _self.render();
                Logger.log('CheckoutModule', 'info', 'Initialized');
                return _self;
            }

            render() {
                let _self = this;
                $(_self.selectors.main).html(`
                    <div class="wrapper">
                        <div class="scanner-frame" id="scanner-frame-container"></div>
                        <div class="instruction-text"></div>
                        <div class="info-section"></div>
                        <div class="btn-group"></div>
                    </div>
                `);
                _self.setupDOM();
                _self.bindEvents();
            }

            setupDOM() {
                let _self = this;
                _self.state.ticketDetail = null;
                $(_self.selectors.container).html(`
                    <div class="scanner-line"></div>
                    <video id="${_self.videoId}" width="100%" height="100%"></video>
                `);
                $(_self.selectors.instruction).html('Đặt mã QR vào khung để quét').removeClass('error');
                $(_self.selectors.info).html('');
                $(_self.selectors.btnGroup).html(`
                    <a href="#" title="Reset" class="btn grey" id="btn-reset-scan">Reset</a>
                    <a href="#" title="Scan QR" class="btn" id="btn-start-scan">Scan QR</a>
                    <a href="#" title="Capture" class="btn" id="btn-capture">Capture Picture</a>
                    <a href="#" title="Confirm" class="btn" id="btn-confirm">Confirm</a>
                    <a href="#" title="Next Scan" class="btn" id="btn-next-scan">Next Scan</a>
                `);
                $(_self.selectors.btnReset).hide();
                $(_self.selectors.btnConfirm).hide();
                $(_self.selectors.btnNext).hide();
                $(_self.selectors.btnCapture).hide();
                $(_self.selectors.btnStart).show();
            }

            updateDOM(statusCode) {
                let _self = this;
                const {
                    USER_CHECKEDIN,
                    USER_CONFIRMATION,
                    USER_CONFIRMATION_SUCCESS
                } = Config.STATUS_CODES;
                $(_self.selectors.instruction).html('');
                $(_self.selectors.info).html('');
                $(_self.selectors.btnReset).hide();
                $(_self.selectors.btnStart).hide();
                $(_self.selectors.btnNext).hide();
                $(_self.selectors.btnConfirm).hide();

                switch (statusCode) {
                    case USER_CHECKEDIN:
                        $(_self.selectors.container).html(`<img src="${Config.ICONS.REMOVE}" alt="">`);
                        $(_self.selectors.info).html(_self.generateInfoRows('error', 'Đã Check-in'));
                        $(_self.selectors.btnNext).show();
                        break;
                    case USER_CONFIRMATION:
                        $(_self.selectors.container).html(`<img src="${Config.ICONS.CLOCK}" alt="">`);
                        $(_self.selectors.info).html(_self.generateInfoRows('checked', 'Chưa Check-in'));
                        $(_self.selectors.btnReset).show();
                        $(_self.selectors.btnConfirm).show();
                        break;
                    case USER_CONFIRMATION_SUCCESS:
                        $(_self.selectors.container).html(`<img src="${Config.ICONS.CHECK}" alt="">`);
                        $(_self.selectors.info).html(_self.generateInfoRows('confirmed', 'Đã Check-in'));
                        $(_self.selectors.btnNext).show();
                        break;
                }
            }

            generateInfoRows(statusClass, statusText) {
                let _self = this;
                const {
                    ticketDetail
                } = _self.state;
                if (!ticketDetail) return 'Ticket Not Found or Invalid';
                try {
                    return `
                        <div class="info-row"><span>Hạng vé: </span><span>${ticketDetail.ticket_class_name}</span></div>
                        <div class="info-row"><span>Ngày diễn ra: </span><span>${ticketDetail.event_time ? moment.unix(ticketDetail.event_time).format('DD-MM-YYYY') : ''}</span></div>
                        <div class="info-row"><span>Trạng thái: </span><span class="${statusClass}">${statusText} ${ticketDetail.used_time ? `<small>(${moment.unix(ticketDetail.used_time).format('HH:mm DD-MM-YYYY')})</small>` : ''}</span></div>
                        ${ticketDetail?.gifts ? `
                            <div class="info-row"><span>Quà: </span>${ticketDetail.gifts?.name}</div>
                            <div class="info-row"><span>- Kích thước: </span><span>${ticketDetail.gifts?.option}</span></div>
                            <div class="info-row"><span>- Trạng thái: </span><span>${ticketDetail.gifts.is_delivered == 1 ? 'Đã nhận' : 'Chưa nhận'}</span></div>
                        ` : ''}
                        <hr>
                        ${Object.values(ticketDetail?.history || {}).map(item => `
                            <div class="info-row">
                                <span>Lịch sử ngày: </span>
                                <span class="${item.is_checkin ? 'confirmed' : 'error'}">${item.event_time ? moment.unix(item.event_time).format('DD-MM-YYYY') : ''} <small>(${item.is_checkin ? 'Đã Check-in' : 'Chưa Check-in'})</small></span>
                            </div>
                        `).join('')}
                        <div class="info-row"><span>Họ tên: </span>${ticketDetail.contact_name}</div>
                        <div class="info-row"><span>Số điện thoại: </span>${ticketDetail.contact_phone}</div>
                        <div class="info-row"><span>Email: </span>${ticketDetail.contact_email}</div>
                    `;
                } catch (error) {
                    Logger.log('CheckoutModule', 'error', error.message);
                    return 'Ticket Not Found or Invalid';
                }
            }

            bindEvents() {
                let _self = this;
                $(document).on('click', _self.selectors.btnStart, () => _self.startScanner());
                $(document).on('click', _self.selectors.btnReset, () => _self.resetScanner());
                $(document).on('click', _self.selectors.btnNext, () => _self.nextScanner());
                $(document).on('click', _self.selectors.btnConfirm, () => _self.handleConfirmCheckout());
                $(document).on('click', _self.selectors.btnCapture, () => _self.capturePicture());
            }

            async grantCameraPermissions() {
                let _self = this;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 3840, min: 1920 },
                            height: { ideal: 2160, min: 1080 },
                            aspectRatio: { ideal: 16 / 9 }
                        }
                    });
                    stream.getTracks().forEach(track => track.stop());
                    _self.state.isCameraGranted = true;
                    return true;
                } catch {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: {
                                facingMode: 'environment',
                                width: { ideal: 1920, min: 1280 },
                                height: { ideal: 1080, min: 720 }
                            }
                        });
                        stream.getTracks().forEach(track => track.stop());
                        _self.state.isCameraGranted = true;
                        return true;
                    } catch {
                        _self.state.isCameraGranted = false;
                        return false;
                    }
                }
            }

            async compressImageToSize(canvas, maxSizeKB = 300) {
                const maxWidth = 3840;
                const maxHeight = 2160;
                let width = canvas.width;
                let height = canvas.height;

                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.floor(width * ratio);
                    height = Math.floor(height * ratio);
                }

                let scale = 1;
                if (width !== canvas.width || height !== canvas.height) {
                    scale = width / canvas.width;
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = width;
                    tempCanvas.height = height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.imageSmoothingEnabled = true;
                    tempCtx.imageSmoothingQuality = 'high';
                    tempCtx.drawImage(canvas, 0, 0, width, height);
                    canvas = tempCanvas;
                }

                let quality = 1.0;
                let blob = await new Promise((resolve) => {
                    canvas.toBlob(resolve, 'image/jpeg', quality);
                });

                while (blob.size > maxSizeKB * 1024 && quality > 0.5) {
                    quality -= 0.05;
                    blob = await new Promise((resolve) => {
                        canvas.toBlob(resolve, 'image/jpeg', quality);
                    });
                }

                if (blob.size > maxSizeKB * 1024) {
                    const targetScale = Math.sqrt((maxSizeKB * 1024) / blob.size) * 0.95;
                    width = Math.floor(width * targetScale);
                    height = Math.floor(height * targetScale);

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = width;
                    tempCanvas.height = height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.imageSmoothingEnabled = true;
                    tempCtx.imageSmoothingQuality = 'high';
                    tempCtx.drawImage(canvas, 0, 0, width, height);

                    quality = 0.95;
                    blob = await new Promise((resolve) => {
                        tempCanvas.toBlob(resolve, 'image/jpeg', quality);
                    });

                    while (blob.size > maxSizeKB * 1024 && quality > 0.3) {
                        quality -= 0.1;
                        blob = await new Promise((resolve) => {
                            tempCanvas.toBlob(resolve, 'image/jpeg', quality);
                        });
                    }
                }

                return { blob, quality };
            }

            async resetScanner() {
                let _self = this;
                const {
                    codeReader
                } = _self.state;
                if (!_self.state.hasResult && !codeReader?.videoElement?.srcObject) {
                    ToastService.show('Preparing Scanner. Please wait...', 'error', 5000);
                    return;
                }
                _self.state.hasResult = false;

                await _self.stopScanner();

                _self.setupDOM();
            }

            nextScanner() {
                let _self = this;
                _self.setupDOM();
                _self.startScanner();
            }

            async stopScanner() {
                let _self = this;
                const {
                    codeReader
                } = _self.state;
                if (codeReader?.videoElement?.srcObject) {
                    codeReader.videoElement.srcObject.getTracks().forEach(track => track.stop());
                    codeReader.videoElement.srcObject = null;
                    codeReader.stream?.getTracks().forEach(track => track.stop());
                    codeReader.stream = null;
                    await codeReader.reset();
                }

                _self.state.isScanning = false;
                if (_self.state.timeoutId) {
                    clearTimeout(_self.state.timeoutId);
                    _self.state.timeoutId = null;
                }
            }

            async startScanner() {
                let _self = this;

                Logger.log('CheckoutModule', 'info', 'Step 1: Starting Scanner...');
                if (_self.state.isScanning) {
                    ToastService.show('Scanner Already Running', 'error', 5000);
                    return;
                }
                _self.state.isScanning = true;
                $(_self.selectors.btnStart).hide();
                // $(_self.selectors.btnReset).show();
                $(_self.selectors.btnCapture).show();

                Logger.log('CheckoutModule', 'info', 'Step 2: Requesting Camera Permissions...');
                if (!_self.state.isCameraGranted && !await _self.grantCameraPermissions()) {
                    _self.state.hasResult = true;
                    ToastService.show('Camera Access Denied', 'error', 5000);
                    _self.resetScanner();
                    return;
                }

                _self.state.timeoutId = setTimeout(() => {
                    _self.state.hasResult = true;
                    _self.resetScanner();
                    ToastService.show('Scan Timeout. Please try again', 'error', 5000);
                }, Config.TIMEOUT_DURATION);

                Logger.log('CheckoutModule', 'info', 'Step 3: Starting QR Code Decoding...');
                try {
                    const result = await _self.state.codeReader.decodeOnceFromVideoDevice(undefined, _self.videoId);
                    if (result) {
                        await _self.handleScanResult(result.text);
                    }
                } catch (error) {
                    if (_self.state.isScanning) {
                        ToastService.show(`Scanning Error: ${error.message}`, 'error', 5000);
                    }
                } finally {
                    _self.state.hasResult = true;
                    await _self.stopScanner();
                }
            }

            async capturePicture() {
                let _self = this;
                const video = document.getElementById(_self.videoId);

                if (!video || !video.srcObject) {
                    ToastService.show('Camera not active', 'error', 3000);
                    return;
                }

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const ctx = canvas.getContext('2d', {
                    alpha: false,
                    willReadFrequently: false
                });
                if (!ctx) {
                    ToastService.show('Cannot capture image', 'error', 3000);
                    return;
                }

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const now = moment().format('YYYYMMDD_HHmmss');
                const filename = `VM_${now}.jpg`;

                let blob = null;
                let qualityUsed = 1.0;
                try {
                    const compressed = await _self.compressImageToSize(canvas, 300);
                    blob = compressed.blob;
                    qualityUsed = compressed.quality;
                    Logger.log('CheckoutModule', 'info', `Image compressed: ${(blob.size / 1024).toFixed(2)}KB, quality: ${qualityUsed.toFixed(2)}`);
                } catch (e) {
                    Logger.log('CheckoutModule', 'error', 'Compression failed, using fallback', e);
                    blob = await new Promise((resolve, reject) => {
                        canvas.toBlob((b) => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.8);
                    });
                }

                // Store for later use (optional)
                _self.state.capturedBlob = blob;

                const objectUrl = URL.createObjectURL(blob);

                // Preview (similar to old flow: append to info)
                $(_self.selectors.info).append(`
                    <div class="captured-image">
                        <img src="${objectUrl}" style="max-width:100%; margin-top:10px; border:2px solid #56ab2f;">
                    </div>
                `);

                // Try download; iOS Safari may ignore a.download => fallback open new tab
                try {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = objectUrl;
                    link.rel = 'noopener';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    ToastService.show(`Picture saved: ${filename} (${(blob.size / 1024).toFixed(2)}KB)`, 'success', 2000);

                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                    if (isIOS) {
                        // Fallback so user can long-press / Save Image if download is blocked
                        setTimeout(() => {
                            try { window.open(objectUrl, '_blank', 'noopener'); } catch (e) { }
                        }, 300);
                    }
                } catch (e) {
                    ToastService.show('Cannot auto-save image', 'error', 2000);
                    try { window.open(objectUrl, '_blank', 'noopener'); } catch (err) { }
                }

                // NOTE: Do not revoke immediately because preview/download still needs it.
                // You can revoke on reset/next scan, or after some time:
                // setTimeout(() => URL.revokeObjectURL(objectUrl), 60_000);
            }

            async handleScanResult(data) {
                let _self = this;
                Logger.log('CheckoutModule', 'info', 'Step 4: Handling Scan Result', data);
                try {
                    const content = _self.deobfuscateData(data);
                    const parsed = _self.parseScannedData(content);

                    Logger.log('CheckoutModule', 'info', 'Step 4.1: Deobfuscated Content:', content);
                    Logger.log('CheckoutModule', 'info', 'Step 4.2: Parsed Result:', parsed);

                    if (parsed.version != 1 || parsed.fields.length == 0) {
                        throw new Error('Invalid QR Code Data');
                    }

                    _self.state.ticketDetail = await _self.getTicketDetail(content);
                    if (!_self.state.ticketDetail) {
                        throw new Error('Ticket Not Found or Invalid');
                    }

                    _self.updateDOM(_self.state.ticketDetail.is_checkin ?
                        Config.STATUS_CODES.USER_CHECKEDIN :
                        Config.STATUS_CODES.USER_CONFIRMATION);
                } catch (error) {
                    ToastService.show(error.message, 'error', 5000);
                }
            }

            async handleConfirmCheckout() {
                let _self = this;
                Logger.log('CheckoutModule', 'info', 'Step 5: Confirming Check-in', _self.state.ticketDetail);
                try {
                    const {
                        ticketDetail
                    } = _self.state;
                    if (!ticketDetail?.ticket_code) {
                        throw new Error('No Ticket to Confirm');
                    }

                    const params = {
                        ticket_code: ticketDetail.ticket_code,
                        order_gift_id: ticketDetail.gifts?.order_gift_id || null
                    };

                    const isConfirmed = await _self.confirmCheckout(params);
                    if (isConfirmed) {
                        _self.updateDOM(Config.STATUS_CODES.USER_CONFIRMATION_SUCCESS);
                        ToastService.show('Check-in Successful', 'success', 5000);
                    } else {
                        throw new Error('Check-in Failed');
                    }
                } catch (error) {
                    ToastService.show(error.message, 'error', 5000);
                }
            }

            deobfuscateData(encoded, secret = 'sEcReT123') {
                try {
                    const b64 = encoded.split('').reverse().join('')
                        .replace(/-/g, '+')
                        .replace(/_/g, '/');
                    return atob(b64).replaceAll(secret, '');
                } catch {
                    return '';
                }
            }

            parseScannedData(data) {
                if (!data || typeof data !== 'string') {
                    return {
                        version: '',
                        fields: []
                    };
                }
                const parts = data.split('|');
                return {
                    version: parts[0] || '',
                    fields: parts.slice(1)
                };
            }

            async getTicketDetail(content) {
                let _self = this;
                $(_self.selectors.modal).addClass('active');
                try {
                    return await ApiService.fetch('ticket/detail', {
                        method: 'POST',
                        body: JSON.stringify({
                            content
                        })
                    });
                } finally {
                    $(_self.selectors.modal).removeClass('active');
                }
            }

            async confirmCheckout(params) {
                let _self = this;
                $(_self.selectors.modal).addClass('active');
                try {
                    return await ApiService.fetch('ticket/confirm-checkin', {
                        method: 'POST',
                        body: JSON.stringify(params)
                    });
                } finally {
                    $(_self.selectors.modal).removeClass('active');
                }
            }
        }

        class App {
            static async start() {
                // const auth = await new AuthModule().init();
                // if (!auth.isLoggedIn()) {
                //     auth.render();
                //     return;
                // }
                const codeReader = new ZXing.BrowserQRCodeReader();
                const checkinModule = await new CheckoutModule().init(codeReader);

                // Expose to window for debugging
                window.debug = {
                    checkinModule
                };
            }
        }

        $(document).ready(() => App.start());
    </script>
</body>
