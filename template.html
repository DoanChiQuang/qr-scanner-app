<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>QR Code Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>video, canvas { max-width: 100%; }</style>
</head>
<body>
  <h2>QR Code Scanner</h2>

  <button id="btnCamera">Mở Camera</button>
  <button id="btnCapture" style="display:none;">Chụp & Detect</button>
  <button id="btnStop" style="display:none;">Dừng Camera</button>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <pre id="result"></pre>

  <script>
    let video = document.getElementById('video');
    let stream = null;
    let rafId = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        document.getElementById('btnCapture').style.display = 'inline';
        document.getElementById('btnStop').style.display = 'inline';
        document.getElementById('btnCamera').style.display = 'none';
      } catch(e) { alert('Không mở được camera'); }
    }

    function stopCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (rafId) cancelAnimationFrame(rafId);
      video.srcObject = null;
      document.getElementById('btnCapture').style.display = 'none';
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('btnCamera').style.display = 'inline';
    }

    function captureAndDetect() {
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      document.getElementById('result').textContent = code ? 'QR: ' + code.data : 'Không tìm thấy QR';
    }

    // Real-time detect (optional)
    function scanLoop() {
      if (!video.videoWidth) { rafId = requestAnimationFrame(scanLoop); return; }
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) {
        document.getElementById('result').textContent = 'QR: ' + code.data;
        stopCamera();
      }
      rafId = requestAnimationFrame(scanLoop);
    }

    document.getElementById('btnCamera').onclick = startCamera;
    document.getElementById('btnCapture').onclick = captureAndDetect;
    document.getElementById('btnStop').onclick = stopCamera;

    // Bắt đầu real-time scan khi camera mở
    video.onloadedmetadata = () => { rafId = requestAnimationFrame(scanLoop); };
  </script>
</body>
</html>
