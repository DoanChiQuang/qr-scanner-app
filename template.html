<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=100" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FPT Online" />

    <!-- ZXing Library -->
    <script src="https://unpkg.com/@zxing/library@0.21.0"></script>

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="moment.min.js"></script>

    <!-- Captcha -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        /* optional small styles for the hidden iOS capture input */
        #ios-file-capture {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>

<body>
    <div id="main"></div>
    <div id="turnstile-container"></div>
    <div class="modal" id="modal">
        <div class="spinner"></div>
    </div>

    <!-- iOS “real camera” capture (high quality). Triggered programmatically -->
    <input id="ios-file-capture" type="file" accept="image/*" capture="environment" />

    <script>
        class Config {
            static API_BASE_URL = 'https://api.esportsfan.net/';
            static TURNSTILE_SITE_KEY = '0x4AAAAAAAOOjy5Nup_zy_9p';
            static TIMEOUT_DURATION = 10000;
            static STATUS_CODES = {
                USER_CHECKEDIN: 1,
                USER_CONFIRMATION: 2,
                USER_CONFIRMATION_SUCCESS: 3
            };
            static ICONS = {
                CHECK: 'icon-check.png',
                CLOCK: 'icon-clock.png',
                REMOVE: 'icon-remove.png',
            };
        }

        class Logger {
            static log(module, type, message, data = null) {
                const logMessage = `[${module}] [${type}] ${message}`;
                type === 'error' ? console.error(logMessage) : console.log(logMessage);
                if (data) console.log(data);
            }
        }

        class ToastService {
            static show(message, type = 'info', duration = 3000) {
                const backgrounds = {
                    info: 'linear-gradient(to right, #00b09b, #96c93d)',
                    error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                    success: 'linear-gradient(to right, #56ab2f, #a8e063)'
                };

                Toastify({
                    text: message,
                    duration,
                    close: true,
                    gravity: "top",
                    position: "center",
                    style: { background: backgrounds[type] || backgrounds.info }
                }).showToast();
            }
        }

        class ApiService {
            static async fetch(endpoint, options = {}) {
                try {
                    const response = await fetch(`${Config.API_BASE_URL}${endpoint}`, {
                        ...options,
                        credentials: 'include',
                    });
                    const result = await response.json();
                    Logger.log('ApiService', 'info', `[API][${endpoint}] Response:`, result);
                    if (result.code != 200) throw new Error(result.message || 'API request failed');
                    return result.data ? result.data : true;
                } catch (error) {
                    Logger.log('ApiService', 'error', `[API][${endpoint}]: ${error.message}`);
                    throw error;
                }
            }
        }

        class CheckoutModule {
            selectors = {
                main: '#main',
                container: '#scanner-frame-container',
                instruction: '.instruction-text',
                info: '.info-section',
                btnGroup: '.btn-group',
                btnReset: '#btn-reset-scan',
                btnStart: '#btn-start-scan',
                btnCapture: '#btn-capture',
                btnConfirm: '#btn-confirm',
                btnNext: '#btn-next-scan',
                modal: '#modal'
            };

            state = {
                isInitialized: false,
                isScanning: false,
                hasResult: false,
                ticketDetail: null,
                codeReader: null,
                timeoutId: null,
                isCameraGranted: false,

                // capture state
                capturedBlob: null,
                capturedObjectUrl: null,
            };

            constructor() {
                this.videoId = 'qr-video';
                this.iosInputId = 'ios-file-capture';
            }

            async init(codeReader) {
                if (this.state.isInitialized) {
                    ToastService.show('Checkout Module Already Initialized', 'error', 5000);
                    return this;
                }
                this.state.isInitialized = true;
                this.state.codeReader = codeReader;
                this.render();
                this.bindIOSFileCapture();
                Logger.log('CheckoutModule', 'info', 'Initialized');
                return this;
            }

            render() {
                $(this.selectors.main).html(`
                    <div class="wrapper">
                        <div class="scanner-frame" id="scanner-frame-container"></div>
                        <div class="instruction-text"></div>
                        <div class="info-section"></div>
                        <div class="btn-group"></div>
                    </div>
                `);
                this.setupDOM();
                this.bindEvents();
            }

            setupDOM() {
                this.state.ticketDetail = null;

                $(this.selectors.container).html(`
                    <div class="scanner-line"></div>
                    <video id="${this.videoId}" width="100%" height="100%" autoplay playsinline></video>
                `);

                $(this.selectors.instruction).html('Đặt mã QR vào khung để quét').removeClass('error');
                $(this.selectors.info).html('');
                $(this.selectors.btnGroup).html(`
                    <a href="#" title="Reset" class="btn grey" id="btn-reset-scan">Reset</a>
                    <a href="#" title="Scan QR" class="btn" id="btn-start-scan">Scan QR</a>
                    <a href="#" title="Capture" class="btn" id="btn-capture">Capture Picture</a>
                    <a href="#" title="Confirm" class="btn" id="btn-confirm">Confirm</a>
                    <a href="#" title="Next Scan" class="btn" id="btn-next-scan">Next Scan</a>
                `);

                $(this.selectors.btnReset).hide();
                $(this.selectors.btnConfirm).hide();
                $(this.selectors.btnNext).hide();
                $(this.selectors.btnCapture).hide();
                $(this.selectors.btnStart).show();
            }

            bindEvents() {
                $(document).on('click', this.selectors.btnStart, () => this.startScanner());
                $(document).on('click', this.selectors.btnReset, () => this.resetScanner());
                $(document).on('click', this.selectors.btnNext, () => this.nextScanner());
                $(document).on('click', this.selectors.btnConfirm, () => this.handleConfirmCheckout());
                $(document).on('click', this.selectors.btnCapture, () => this.capturePictureHQ());
            }

            // -------- Platform helpers --------
            isIOS() {
                return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            }

            supportsImageCaptureTakePhoto() {
                // Even if ImageCapture exists, takePhoto may not be usable everywhere.
                return typeof window.ImageCapture !== 'undefined';
            }

            revokeCapturedUrl() {
                if (this.state.capturedObjectUrl) {
                    try { URL.revokeObjectURL(this.state.capturedObjectUrl); } catch (e) { }
                    this.state.capturedObjectUrl = null;
                }
            }

            showCapturedPreview(blob, viaLabel) {
                this.revokeCapturedUrl();
                this.state.capturedBlob = blob;
                this.state.capturedObjectUrl = URL.createObjectURL(blob);

                $(this.selectors.info).append(`
                    <div class="captured-image" style="margin-top:10px;">
                        <div style="font-size:12px;color:#444;margin-bottom:6px;">
                        Captured (${viaLabel}): ${(blob.size / 1024 / 1024).toFixed(2)}MB - ${blob.type}
                        </div>
                        <img src="${this.state.capturedObjectUrl}" style="max-width:100%; border:2px solid #56ab2f; border-radius:8px;">
                    </div>
                `);
            }

            downloadBlob(blob) {
                const now = moment().format('YYYYMMDD_HHmmss');
                const ext = (blob.type === 'image/png') ? 'png' : 'jpg';
                const filename = `VM_${now}.${ext}`;

                const objectUrl = this.state.capturedObjectUrl || URL.createObjectURL(blob);

                try {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = objectUrl;
                    link.rel = 'noopener';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    ToastService.show(`Saved: ${filename}`, 'success', 2000);
                } catch (e) {
                    ToastService.show('Cannot auto-save image', 'error', 2000);
                    try { window.open(objectUrl, '_blank', 'noopener'); } catch (err) { }
                }

                // iOS Safari often ignores a.download; open tab fallback
                if (this.isIOS()) {
                    setTimeout(() => {
                        try { window.open(objectUrl, '_blank', 'noopener'); } catch (e) { }
                    }, 250);
                }
            }

            // -------- iOS file capture (highest quality path on iOS Safari) --------
            bindIOSFileCapture() {
                const input = document.getElementById(this.iosInputId);
                if (!input) return;

                input.addEventListener('change', async () => {
                    try {
                        const file = input.files && input.files[0];
                        if (!file) return;

                        // Reset input so selecting the same photo again still triggers change
                        input.value = '';

                        // file is usually already a high-quality image from Camera UI
                        this.showCapturedPreview(file, 'iOS camera input');
                        this.downloadBlob(file);
                    } catch (e) {
                        Logger.log('CheckoutModule', 'error', 'iOS file capture error', e);
                        ToastService.show('Capture failed', 'error', 2500);
                    }
                });
            }

            openIOSCameraUI() {
                const input = document.getElementById(this.iosInputId);
                if (!input) {
                    ToastService.show('iOS capture input missing', 'error', 2500);
                    return;
                }
                input.click();
            }

            // -------- Camera permission + scanning --------
            async grantCameraPermissions() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 3840 },
                            height: { ideal: 2160 },
                            aspectRatio: { ideal: 16 / 9 }
                        }
                    });
                    stream.getTracks().forEach(track => track.stop());
                    this.state.isCameraGranted = true;
                    return true;
                } catch {
                    this.state.isCameraGranted = false;
                    return false;
                }
            }

            async resetScanner() {
                const { codeReader } = this.state;

                if (!this.state.hasResult && !codeReader?.videoElement?.srcObject) {
                    ToastService.show('Preparing Scanner. Please wait...', 'error', 5000);
                    return;
                }
                this.state.hasResult = false;

                await this.stopScanner();

                // cleanup captured preview/url
                this.revokeCapturedUrl();
                this.state.capturedBlob = null;

                this.setupDOM();
            }

            nextScanner() {
                this.revokeCapturedUrl();
                this.state.capturedBlob = null;

                this.setupDOM();
                this.startScanner();
            }

            async stopScanner() {
                const { codeReader } = this.state;
                if (codeReader?.videoElement?.srcObject) {
                    codeReader.videoElement.srcObject.getTracks().forEach(track => track.stop());
                    codeReader.videoElement.srcObject = null;
                    codeReader.stream?.getTracks().forEach(track => track.stop());
                    codeReader.stream = null;
                    await codeReader.reset();
                }

                this.state.isScanning = false;
                if (this.state.timeoutId) {
                    clearTimeout(this.state.timeoutId);
                    this.state.timeoutId = null;
                }
            }

            async startScanner() {
                Logger.log('CheckoutModule', 'info', 'Step 1: Starting Scanner...');
                if (this.state.isScanning) {
                    ToastService.show('Scanner Already Running', 'error', 5000);
                    return;
                }

                this.state.isScanning = true;
                $(this.selectors.btnStart).hide();
                $(this.selectors.btnCapture).show();

                Logger.log('CheckoutModule', 'info', 'Step 2: Requesting Camera Permissions...');
                if (!this.state.isCameraGranted && !await this.grantCameraPermissions()) {
                    this.state.hasResult = true;
                    ToastService.show('Camera Access Denied', 'error', 5000);
                    this.resetScanner();
                    return;
                }

                this.state.timeoutId = setTimeout(() => {
                    this.state.hasResult = true;
                    this.resetScanner();
                    ToastService.show('Scan Timeout. Please try again', 'error', 5000);
                }, Config.TIMEOUT_DURATION);

                Logger.log('CheckoutModule', 'info', 'Step 3: Starting QR Code Decoding...');
                try {
                    const result = await this.state.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result) {
                        await this.handleScanResult(result.text);
                    }
                } catch (error) {
                    if (this.state.isScanning) {
                        ToastService.show(`Scanning Error: ${error.message}`, 'error', 5000);
                    }
                } finally {
                    this.state.hasResult = true;
                    await this.stopScanner();
                }
            }

            // -------- High-quality capture for BOTH (iOS + others) --------
            async capturePictureHQ() {
                // iOS Safari: best path is file input camera UI (still photo)
                if (this.isIOS()) {
                    this.openIOSCameraUI();
                    return;
                }

                // Non-iOS: try ImageCapture.takePhoto() first, fallback to canvas from video
                const video = document.getElementById(this.videoId);
                if (!video || !video.srcObject) {
                    ToastService.show('Camera not active', 'error', 3000);
                    return;
                }

                this.revokeCapturedUrl();

                const stream = video.srcObject;
                const track = stream.getVideoTracks?.()[0];
                if (!track) {
                    ToastService.show('Cannot access camera track', 'error', 3000);
                    return;
                }

                let blob = null;

                // 1) ImageCapture (best when available)
                if (this.supportsImageCaptureTakePhoto()) {
                    try {
                        const cap = new ImageCapture(track);
                        blob = await cap.takePhoto();
                        Logger.log('CheckoutModule', 'info', `ImageCapture.takePhoto: ${(blob.size / 1024 / 1024).toFixed(2)}MB`);
                        this.showCapturedPreview(blob, 'ImageCapture.takePhoto');
                        this.downloadBlob(blob);
                        return;
                    } catch (e) {
                        Logger.log('CheckoutModule', 'error', 'ImageCapture.takePhoto failed, fallback to canvas', e);
                        blob = null;
                    }
                }

                // 2) Canvas fallback (still high quality: native video resolution + JPEG quality 0.95)
                const w = video.videoWidth;
                const h = video.videoHeight;
                if (!w || !h) {
                    ToastService.show('Video not ready yet', 'error', 2000);
                    return;
                }

                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;

                const ctx = canvas.getContext('2d', { alpha: false });
                if (!ctx) {
                    ToastService.show('Cannot capture image', 'error', 3000);
                    return;
                }

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(video, 0, 0, w, h);

                blob = await new Promise((resolve, reject) => {
                    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/jpeg', 0.95);
                });

                Logger.log('CheckoutModule', 'info', `Canvas capture: ${(blob.size / 1024 / 1024).toFixed(2)}MB (${w}x${h})`);

                this.showCapturedPreview(blob, 'canvas fallback');
                this.downloadBlob(blob);
            }

            // -------- Existing business logic (kept) --------
            async handleScanResult(data) {
                Logger.log('CheckoutModule', 'info', 'Step 4: Handling Scan Result', data);
                try {
                    const content = this.deobfuscateData(data);
                    const parsed = this.parseScannedData(content);

                    Logger.log('CheckoutModule', 'info', 'Step 4.1: Deobfuscated Content:', content);
                    Logger.log('CheckoutModule', 'info', 'Step 4.2: Parsed Result:', parsed);

                    if (parsed.version != 1 || parsed.fields.length == 0) {
                        throw new Error('Invalid QR Code Data');
                    }

                    this.state.ticketDetail = await this.getTicketDetail(content);
                    if (!this.state.ticketDetail) {
                        throw new Error('Ticket Not Found or Invalid');
                    }

                    this.updateDOM(this.state.ticketDetail.is_checkin ?
                        Config.STATUS_CODES.USER_CHECKEDIN :
                        Config.STATUS_CODES.USER_CONFIRMATION);
                } catch (error) {
                    ToastService.show(error.message, 'error', 5000);
                }
            }

            updateDOM(statusCode) {
                const { USER_CHECKEDIN, USER_CONFIRMATION, USER_CONFIRMATION_SUCCESS } = Config.STATUS_CODES;
                $(this.selectors.instruction).html('');
                $(this.selectors.info).html('');
                $(this.selectors.btnReset).hide();
                $(this.selectors.btnStart).hide();
                $(this.selectors.btnNext).hide();
                $(this.selectors.btnConfirm).hide();

                switch (statusCode) {
                    case USER_CHECKEDIN:
                        $(this.selectors.container).html(`<img src="${Config.ICONS.REMOVE}" alt="">`);
                        $(this.selectors.info).html(this.generateInfoRows('error', 'Đã Check-in'));
                        $(this.selectors.btnNext).show();
                        break;
                    case USER_CONFIRMATION:
                        $(this.selectors.container).html(`<img src="${Config.ICONS.CLOCK}" alt="">`);
                        $(this.selectors.info).html(this.generateInfoRows('checked', 'Chưa Check-in'));
                        $(this.selectors.btnReset).show();
                        $(this.selectors.btnConfirm).show();
                        break;
                    case USER_CONFIRMATION_SUCCESS:
                        $(this.selectors.container).html(`<img src="${Config.ICONS.CHECK}" alt="">`);
                        $(this.selectors.info).html(this.generateInfoRows('confirmed', 'Đã Check-in'));
                        $(this.selectors.btnNext).show();
                        break;
                }
            }

            generateInfoRows(statusClass, statusText) {
                const { ticketDetail } = this.state;
                if (!ticketDetail) return 'Ticket Not Found or Invalid';
                try {
                    return `
            <div class="info-row"><span>Hạng vé: </span><span>${ticketDetail.ticket_class_name}</span></div>
            <div class="info-row"><span>Ngày diễn ra: </span><span>${ticketDetail.event_time ? moment.unix(ticketDetail.event_time).format('DD-MM-YYYY') : ''}</span></div>
            <div class="info-row"><span>Trạng thái: </span><span class="${statusClass}">${statusText} ${ticketDetail.used_time ? `<small>(${moment.unix(ticketDetail.used_time).format('HH:mm DD-MM-YYYY')})</small>` : ''}</span></div>
            ${ticketDetail?.gifts ? `
              <div class="info-row"><span>Quà: </span>${ticketDetail.gifts?.name}</div>
              <div class="info-row"><span>- Kích thước: </span><span>${ticketDetail.gifts?.option}</span></div>
              <div class="info-row"><span>- Trạng thái: </span><span>${ticketDetail.gifts.is_delivered == 1 ? 'Đã nhận' : 'Chưa nhận'}</span></div>
            ` : ''}
            <hr>
            ${Object.values(ticketDetail?.history || {}).map(item => `
              <div class="info-row">
                <span>Lịch sử ngày: </span>
                <span class="${item.is_checkin ? 'confirmed' : 'error'}">${item.event_time ? moment.unix(item.event_time).format('DD-MM-YYYY') : ''} <small>(${item.is_checkin ? 'Đã Check-in' : 'Chưa Check-in'})</small></span>
              </div>
            `).join('')}
            <div class="info-row"><span>Họ tên: </span>${ticketDetail.contact_name}</div>
            <div class="info-row"><span>Số điện thoại: </span>${ticketDetail.contact_phone}</div>
            <div class="info-row"><span>Email: </span>${ticketDetail.contact_email}</div>
          `;
                } catch (error) {
                    Logger.log('CheckoutModule', 'error', error.message);
                    return 'Ticket Not Found or Invalid';
                }
            }

            async handleConfirmCheckout() {
                Logger.log('CheckoutModule', 'info', 'Step 5: Confirming Check-in', this.state.ticketDetail);
                try {
                    const { ticketDetail } = this.state;
                    if (!ticketDetail?.ticket_code) throw new Error('No Ticket to Confirm');

                    const params = {
                        ticket_code: ticketDetail.ticket_code,
                        order_gift_id: ticketDetail.gifts?.order_gift_id || null
                    };

                    const isConfirmed = await this.confirmCheckout(params);
                    if (isConfirmed) {
                        this.updateDOM(Config.STATUS_CODES.USER_CONFIRMATION_SUCCESS);
                        ToastService.show('Check-in Successful', 'success', 5000);
                    } else {
                        throw new Error('Check-in Failed');
                    }
                } catch (error) {
                    ToastService.show(error.message, 'error', 5000);
                }
            }

            deobfuscateData(encoded, secret = 'sEcReT123') {
                try {
                    const b64 = encoded.split('').reverse().join('')
                        .replace(/-/g, '+')
                        .replace(/_/g, '/');
                    return atob(b64).replaceAll(secret, '');
                } catch {
                    return '';
                }
            }

            parseScannedData(data) {
                if (!data || typeof data !== 'string') return { version: '', fields: [] };
                const parts = data.split('|');
                return { version: parts[0] || '', fields: parts.slice(1) };
            }

            async getTicketDetail(content) {
                $(this.selectors.modal).addClass('active');
                try {
                    return await ApiService.fetch('ticket/detail', {
                        method: 'POST',
                        body: JSON.stringify({ content })
                    });
                } finally {
                    $(this.selectors.modal).removeClass('active');
                }
            }

            async confirmCheckout(params) {
                $(this.selectors.modal).addClass('active');
                try {
                    return await ApiService.fetch('ticket/confirm-checkin', {
                        method: 'POST',
                        body: JSON.stringify(params)
                    });
                } finally {
                    $(this.selectors.modal).removeClass('active');
                }
            }
        }

        class App {
            static async start() {
                const codeReader = new ZXing.BrowserQRCodeReader();
                const checkinModule = await new CheckoutModule().init(codeReader);

                window.debug = { checkinModule };
            }
        }

        $(document).ready(() => App.start());
    </script>
</body>

</html>
