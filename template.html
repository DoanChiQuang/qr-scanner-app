<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<title>QR Code Scanner</title>
	<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
	<style>
		video,
		canvas {
			max-width: 100%;
		}
	</style>
</head>

<body>
	<h2>QR Code Scanner</h2>

	<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
	<button id="btnOpenCamera">Mở Camera & Chụp</button>

	<video id="video" autoplay playsinline style="display:none;"></video>
	<canvas id="canvas" style="display:none;"></canvas>

	<pre id="result"></pre>

	<script>
		const cameraInput = document.getElementById('cameraInput');
		const btnOpen = document.getElementById('btnOpenCamera');

		btnOpen.onclick = () => cameraInput.click();

		cameraInput.addEventListener('change', function (e) {
			const file = e.target.files[0];
			if (!file) return;

			const img = new Image();
			img.onload = function () {
				const canvas = document.getElementById('canvas');
				canvas.width = img.width;
				canvas.height = img.height;
				console.log('Canvas size set to:', canvas.width, canvas.height);
				canvas.style.display = 'block';

				const ctx = canvas.getContext('2d');
				ctx.drawImage(img, 0, 0);

				const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
				const code = jsQR(imageData.data, imageData.width, imageData.height);

				document.getElementById('result').textContent = code ? 'QR: ' + code.data : 'Không tìm thấy QR code';
			};
			img.src = URL.createObjectURL(file);
		});
	</script>
</body>

</html>
