<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>QR Scanner</title>
	<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: system-ui, sans-serif;
			background: #000;
			color: #fff;
			text-align: center;
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		h2 {
			margin: 10px 0;
			font-size: 1.2rem;
		}

		button {
			background: #007aff;
			color: white;
			border: none;
			padding: 16px 24px;
			margin: 10px;
			font-size: 1.1rem;
			border-radius: 12px;
			width: 90%;
			max-width: 320px;
		}

	#reader {
			width: 100%;
			max-width: 500px;
			margin: 10px auto;
		}

		#result {
			margin: 10px;
			padding: 12px;
			background: #1c1c1e;
			border-radius: 8px;
			min-height: 1.5em;
			word-break: break-all;
		}

		input[type="file"] {
			display: none;
		}
	</style>
</head>

<body>
	<h2>QR Code Scanner</h2>
	<div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
	<button id="btnStart">Bắt đầu Camera</button>
	<button id="btnStop" style="display:none;">Dừng Camera</button>
	<pre id="result"></pre>

	<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
	<script>
		let html5QrCode = null;
		const btnStart = document.getElementById('btnStart');
		const btnStop = document.getElementById('btnStop');

		btnStart.onclick = () => {
			btnStart.style.display = 'none';
			btnStop.style.display = 'inline-block';
			startScanner();
		};

		btnStop.onclick = () => {
			stopScanner();
			btnStart.style.display = 'inline-block';
			btnStop.style.display = 'none';
		};

		function startScanner() {
			html5QrCode = new Html5Qrcode("reader");
			html5QrCode.start(
				{ facingMode: "environment" },
				{
					fps: 10,
					qrbox: { width: 250, height: 250 },
					aspectRatio: 1.0
				},
				(decodedText) => {
					document.getElementById('result').textContent = 'QR: ' + decodedText;
					stopScanner();
					btnStart.style.display = 'inline-block';
					btnStop.style.display = 'none';
				},
				(errorMessage) => {}
			).catch(err => {
				document.getElementById('result').textContent = 'Lỗi: ' + err;
				btnStart.style.display = 'inline-block';
				btnStop.style.display = 'none';
			});
		}

		function stopScanner() {
			if (html5QrCode) {
				html5QrCode.stop().then(() => {
					html5QrCode.clear();
				}).catch(() => {});
			}
		}
	</script>
</body>

</html>
