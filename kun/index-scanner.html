<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout Scanner (Checkout-only)</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:20px;background:#f5f7fa;color:#1f2937}
        .wrap{max-width:900px;margin:0 auto}
        h1{font-size:20px;margin:0 0 12px}
        #controls{margin-bottom:12px}
        button{padding:10px 14px;margin-right:8px;font-size:14px}
        video{width:100%;height:auto;background:#000;border-radius:8px}
        #result{margin-top:12px;padding:10px;background:#fff;border-radius:6px;border:1px solid #e5e7eb}
        #status{margin-top:8px;color:#6b7280}
    </style>
    <!-- ZXing WASM (used for barcode detection) -->
    <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.1/dist/iife/full/index.js"></script>
</head>
<body>
    <div class="wrap">
        <h1>Checkout Scanner — chỉ tính năng checkout (offline)</h1>
        <div id="controls">
            <button id="btn-scan">Scan</button>
            <button id="btn-stop" disabled>Stop</button>
        </div>

        <video id="scanner-video" playsinline autoplay muted></video>
        <canvas id="capture-canvas" style="display:none"></canvas>

        <div id="result">Kết quả: <strong id="result-text">—</strong></div>
        <div id="status">Trạng thái: <span id="status-text">Chưa bắt đầu</span></div>
    </div>

    <script>
        (function () {
            const btnScan = document.getElementById('btn-scan');
            const btnStop = document.getElementById('btn-stop');
            const video = document.getElementById('scanner-video');
            const canvas = document.getElementById('capture-canvas');
            const resultText = document.getElementById('result-text');
            const statusText = document.getElementById('status-text');

            let stream = null;
            let loopId = null;
            let running = false;

            function logStatus(txt) {
                statusText.textContent = txt;
            }

            async function startCamera() {
                if (running) return;
                resultText.textContent = '—';
                logStatus('Yêu cầu quyền camera...');
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: false
                    });

                    video.srcObject = stream;
                    await video.play();
                    logStatus('Camera đang chạy');
                    btnScan.disabled = true;
                    btnStop.disabled = false;
                    running = true;
                    startDetectionLoop();
                } catch (err) {
                    console.error('Camera error', err);
                    logStatus('Lỗi camera: ' + (err && err.message ? err.message : err));
                }
            }

            function stopCamera() {
                if (!running) return;
                running = false;
                btnScan.disabled = false;
                btnStop.disabled = true;
                logStatus('Đã dừng');
                if (loopId) {
                    clearInterval(loopId);
                    loopId = null;
                }
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                try { video.srcObject = null; } catch (e) { }
            }

            function startDetectionLoop() {
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                // throttle to ~5 FPS (200ms)
                loopId = setInterval(async () => {
                    try {
                        if (!running || video.readyState < 2) return;
                        const w = video.videoWidth || 640;
                        const h = video.videoHeight || 480;
                        if (w === 0 || h === 0) return;
                        canvas.width = w;
                        canvas.height = h;
                        ctx.drawImage(video, 0, 0, w, h);
                        const imgData = ctx.getImageData(0, 0, w, h);

                        // ZXingWASM readBarcodes
                        const { readBarcodes } = ZXingWASM;
                        const configs = [
                            { tryHarder: true, tryDenoise: true, tryDownscale: true, tryInvert: true, tryRotate: true, formats: ["QRCode"], maxNumberOfSymbols: 1 },
                            { tryHarder: true, tryInvert: true, tryRotate: true, formats: ["QRCode"], maxNumberOfSymbols: 1 }
                        ];

                        for (const cfg of configs) {
                            let barcodes = [];
                            try {
                                barcodes = await readBarcodes(imgData, cfg);
                            } catch (e) {
                                // readBarcodes may throw on some frames; ignore and continue
                                // console.debug('readBarcodes error', e);
                                barcodes = [];
                            }
                            const text = barcodes?.[0]?.text || barcodes?.[0]?.rawValue || '';
                            if (text) {
                                resultText.textContent = text;
                                logStatus('Đã phát hiện QR');
                                stopCamera();
                                return;
                            }
                        }

                        // no barcode found this frame
                        logStatus('Đang quét...');
                    } catch (err) {
                        console.error('Detection loop error', err);
                        logStatus('Lỗi xử lý khung hình');
                    }
                }, 200);
            }

            btnScan.addEventListener('click', startCamera);
            btnStop.addEventListener('click', stopCamera);
            window.addEventListener('beforeunload', stopCamera);
        })();
    </script>
</body>
</html>
