<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Checkout Live Detect (getUserMedia + zxing-wasm)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
            margin: 14px;
        }

        .btn {
            padding: 12px 14px;
            font-size: 16px;
        }

        .row {
            margin: 12px 0;
        }

        #status {
            white-space: pre-wrap;
        }

        .ok {
            color: #0a7a2f;
        }

        .fail {
            color: #b00020;
        }

        .muted {
            color: #666;
            font-size: 13px;
        }

        .cameraWrap {
            position: relative;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Overlay ROI */
        .roi {
            position: absolute;
            left: 15%;
            top: 20%;
            width: 70%;
            height: 60%;
            border: 2px solid rgba(0, 255, 140, 0.95);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            pointer-events: none;
        }

        .roiLabel {
            position: absolute;
            left: 15%;
            top: calc(20% - 28px);
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
        }

        #downloadLink {
            display: none;
        }
    </style>
</head>

<body>
    <h2>Checkout (Live Detect QR) — không cần Confirm</h2>

    <div class="row">
        <button id="btnStart" class="btn">Mở camera & Quét</button>
        <button id="btnStop" class="btn" disabled>Dừng</button>
    </div>

    <div class="row muted">
        Tip: đưa bib/QR vào khung xanh, đủ sáng, giữ máy ổn định 0.5–1s.
    </div>

    <div class="cameraWrap" id="cameraWrap" style="display:none;">
        <video id="video" autoplay playsinline muted></video>
        <div class="roiLabel">Vùng quét (ROI)</div>
        <div class="roi"></div>
    </div>

    <div class="row">
        <div id="status" class="muted">Sẵn sàng.</div>
    </div>

    <div class="row">
        <a id="downloadLink">Download ảnh (300–500KB)</a>
    </div>

    <!-- ZXing-WASM IIFE -->
    <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.1/dist/iife/full/index.js"></script>

    <script>
        const ZXing = ZXingWASM;
        const { readBarcodes } = ZXing;

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const wrap = document.getElementById('cameraWrap');
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const downloadLink = document.getElementById('downloadLink');

        // ====== CONFIG (bạn có thể tune) ======
        const CONFIG = {
            // decode mỗi N ms (5–10 fps là đủ)
            scanIntervalMs: 140,

            // ROI theo overlay CSS: left 15%, top 20%, width 70%, height 60%
            roi: { x: 0.15, y: 0.20, w: 0.70, h: 0.60 },

            // Resize ROI trước khi decode (tăng lên nếu QR nhỏ/mờ; giảm nếu muốn nhanh hơn)
            roiDecodeWidth: 1100,

            // Nếu ROI fail, thỉnh thoảng thử full (cứu case lệch khung)
            fullFallbackEveryN: 8,
            fullDecodeWidth: 1600,

            // Khi đã đọc được QR: dừng quét và chốt
            stopOnSuccess: true,

            // Target ảnh download
            downloadMinKB: 300,
            downloadMaxKB: 500,

            // Debug log
            debug: false,
        };

        // State
        let stream = null;
        let timer = null;
        let isBusy = false;
        let tickCount = 0;
        let lastText = '';

        // Canvas làm việc (không gắn DOM)
        const workCanvas = document.createElement('canvas');
        const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });

        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);

        async function startCamera() {
            downloadLink.style.display = 'none';
            lastText = '';
            setStatus('Đang xin quyền camera...', 'muted');

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        // ideal resolution giúp QR rõ hơn; browser sẽ tự điều chỉnh theo thiết bị
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                wrap.style.display = 'block';
                btnStart.disabled = true;
                btnStop.disabled = false;

                setStatus('Camera đã mở. Đang quét QR...', 'muted');
                startLoop();

            } catch (e) {
                console.error(e);
                setStatus('Không mở được camera. Kiểm tra quyền truy cập camera (browser settings).', 'fail');
            }
        }

        function stopCamera() {
            stopLoop();

            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;

            wrap.style.display = 'none';
            btnStart.disabled = false;
            btnStop.disabled = true;

            setStatus('Đã dừng camera.', 'muted');
        }

        function startLoop() {
            stopLoop();
            tickCount = 0;
            timer = setInterval(scanTick, CONFIG.scanIntervalMs);
        }

        function stopLoop() {
            if (timer) clearInterval(timer);
            timer = null;
            isBusy = false;
        }

        function setStatus(text, cls) {
            statusEl.className = cls || '';
            statusEl.textContent = text;
        }

        async function scanTick() {
            if (!stream) return;
            if (isBusy) return; // tránh chồng tick
            if (video.readyState < 2) return; // chưa có frame

            isBusy = true;
            tickCount++;

            try {
                // 1) Vẽ frame video vào workCanvas ở kích thước "thật" của video
                const vw = video.videoWidth;
                const vh = video.videoHeight;

                if (!vw || !vh) return;

                workCanvas.width = vw;
                workCanvas.height = vh;
                workCtx.drawImage(video, 0, 0, vw, vh);

                // 2) Crop ROI
                const roiRect = {
                    x: Math.round(vw * CONFIG.roi.x),
                    y: Math.round(vh * CONFIG.roi.y),
                    w: Math.round(vw * CONFIG.roi.w),
                    h: Math.round(vh * CONFIG.roi.h),
                };

                // ROI canvas
                const roiCanvas = cropRect(workCanvas, roiRect);
                const roiScaled = resizeToWidth(roiCanvas, CONFIG.roiDecodeWidth);

                // 3) Decode ROI (chính)
                let barcodes = await decodeCanvas(roiScaled);

                // 4) Fallback thỉnh thoảng thử full frame (cứu case bib lệch ROI)
                if (!barcodes.length && (tickCount % CONFIG.fullFallbackEveryN === 0)) {
                    const fullScaled = resizeToWidth(workCanvas, CONFIG.fullDecodeWidth);
                    barcodes = await decodeCanvas(fullScaled);
                    if (CONFIG.debug) console.log('[scan] fallback full', barcodes);
                }

                const text = pickBarcodeText(barcodes);

                if (text && text !== lastText) {
                    lastText = text;

                    // phản hồi UX
                    beep();
                    setStatus(`OK ✅\nQR: ${text}`, 'ok');

                    // 5) Chốt ảnh download 300–500KB (lấy frame full để lưu)
                    const { blob, sizeKB } = await compressCanvasToTargetKB(workCanvas, CONFIG.downloadMinKB, CONFIG.downloadMaxKB);
                    const url = URL.createObjectURL(blob);

                    downloadLink.href = url;
                    downloadLink.download = buildCheckoutFilename(text);
                    downloadLink.textContent = `Download ảnh (${Math.round(sizeKB)}KB)`;
                    downloadLink.style.display = 'inline-block';

                    // 6) Dừng nếu cấu hình
                    if (CONFIG.stopOnSuccess) {
                        stopCamera();
                    }
                } else if (!lastText) {
                    // chỉ update trạng thái khi chưa thành công
                    setStatus('Đang quét QR... (giữ bib trong khung xanh)', 'muted');
                }

            } catch (e) {
                if (CONFIG.debug) console.error(e);
                // không spam UI lỗi; live scan cứ tiếp tục
            } finally {
                isBusy = false;
            }
        }

        async function decodeCanvas(canvas) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const res = await readBarcodes(imgData);
            return Array.isArray(res) ? res : [];
        }

        function pickBarcodeText(barcodes) {
            if (!barcodes || !barcodes.length) return '';
            return barcodes[0].text || barcodes[0].rawValue || '';
        }

        function cropRect(sourceCanvas, r) {
            const c = document.createElement('canvas');
            c.width = Math.max(1, r.w);
            c.height = Math.max(1, r.h);
            const ctx = c.getContext('2d');
            ctx.drawImage(sourceCanvas, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
            return c;
        }

        function resizeToWidth(sourceCanvas, targetW) {
            if (sourceCanvas.width <= targetW) return sourceCanvas;
            const scale = targetW / sourceCanvas.width;
            const tw = targetW;
            const th = Math.max(1, Math.round(sourceCanvas.height * scale));

            const c = document.createElement('canvas');
            c.width = tw;
            c.height = th;
            const ctx = c.getContext('2d');
            ctx.drawImage(sourceCanvas, 0, 0, tw, th);
            return c;
        }

        async function compressCanvasToTargetKB(canvas, minKB, maxKB) {
            // Lưu ý: canvas ở đây là frame video (thường 1280x720), khá phù hợp để nén 300–500KB
            let low = 0.55, high = 0.92;
            let best = null;

            for (let i = 0; i < 9; i++) {
                const q = (low + high) / 2;
                const blob = await canvasToJpegBlob(canvas, q);
                const sizeKB = blob.size / 1024;
                best = { blob, sizeKB, q };

                if (sizeKB > maxKB) high = q;
                else if (sizeKB < minKB) low = q;
                else break;
            }

            // Nếu vẫn quá to, giảm kích thước 1 lần
            if (best && best.sizeKB > maxKB) {
                const smaller = resizeToWidth(canvas, Math.round(canvas.width * 0.85));
                const blob = await canvasToJpegBlob(smaller, 0.78);
                return { blob, sizeKB: blob.size / 1024 };
            }

            return { blob: best.blob, sizeKB: best.sizeKB };
        }

        function canvasToJpegBlob(canvas, quality) {
            return new Promise((resolve) => {
                canvas.toBlob((b) => resolve(b), 'image/jpeg', quality);
            });
        }

        function buildCheckoutFilename(qrText) {
            const safe = (qrText || 'unknown')
                .toString()
                .slice(0, 48)
                .replace(/[^\w\-]+/g, '_');

            const ts = new Date().toISOString().replace(/[:.]/g, '-');
            return `checkout_${safe}_${ts}.jpg`;
        }

        function beep() {
            // iOS có thể chặn audio nếu chưa có user gesture,
            // nhưng startCamera là user click => thường OK.
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'sine';
                o.frequency.value = 880;
                g.gain.value = 0.05;
                o.connect(g);
                g.connect(ctx.destination);
                o.start();
                setTimeout(() => { o.stop(); ctx.close(); }, 120);
            } catch (_) { }
        }

        // Tự dọn camera nếu user rời trang
        window.addEventListener('pagehide', stopCamera);
    </script>
</body>

</html>
