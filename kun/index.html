        class Logger {
            static log(module, type, message, data = null) {
                const logMessage = `[${module}] [${type}] ${message}`;
                type === 'error' ? console.error(logMessage) : console.log(logMessage);
                if (data) console.log(data);
            }
        }

        class ToastService {
            static show(message, type = 'info', duration = 3000) {
                const backgrounds = {
                    info: 'linear-gradient(to right, #00b09b, #96c93d)',
                    error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                    success: 'linear-gradient(to right, #56ab2f, #a8e063)'
                };

                Toastify({
                    text: message,
                    duration,
                    close: true,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: backgrounds[type] || backgrounds.info
                    }
                }).showToast();
            }
        }

        class ApiService {
            static async fetch(endpoint, options = {}) {
                try {
                    const response = await fetch(`${Config.API_BASE_URL}${endpoint}`, {
                        ...options,
                        credentials: 'include',
                    });
                    const result = await response.json();
                    Logger.log('ApiService', 'info', `[API][${endpoint}] Response:`, result);
                    if (result.code != 200) throw new Error(result.message || 'API request failed');
                    return result.data ? result.data : true;
                } catch (error) {
                    Logger.log('ApiService', 'error', `[API][${endpoint}]: ${error.message}`);
                    throw error;
                }
            }
        }

        class AuthModule {
            selectors = {
                main: '#main',
                form: '#form',

            };

            async init() {
                let _self = this;
                await _self.getAccountInfo().then(info => {
                    _self.state.accountInfo = info;
                }).catch(() => {
                    ToastService.show('Session expired. Please log in again.', 'error', 5000);
                });
                Logger.log('AuthModule', 'info', 'Initialized');
                return _self;
            }

            render() {
                let _self = this;
                $(_self.selectors.main).html(`
                    <div class="header">
                        <h1 class="title">Login</h1>
                    </div>
                    <form id="form" method="POST">
                        <label for="email">Email</label>

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required><br><br>
                        <button type="submit" class="btn" id="btn-login">Submit</button>
                    </form>
                `);
                _self.bindEvents();
            }

            isLoggedIn() {
                let _self = this;
                return !!_self.state.accountInfo;
            }

            bindEvents() {
                let _self = this;
                let {
                    selectors
                } = _self;
                $(document).on('submit', selectors.form, async (e) => {
                    e.preventDefault();
                    $(selectors.btnLogin).prop('disabled', true).text('Logging in...').addClass('grey');
                    try {
                        const token = await new Promise((resolve) => _self.renderTurnstile(resolve));
                        await _self.handleLogin(token);
                    } catch (error) {
                        ToastService.show(error.message, 'error', 5000);
                        Logger.log('AuthModule', 'error', error.message);
                    } finally {
                        $(selectors.btnLogin).prop('disabled', false).text('Submit').removeClass('grey');
                    }
                });
            }

            async handleLogin(token = null) {
                let _self = this;
                const email = $('#email').val();
                const password = $('#password').val();
                if (!email || !password) throw new Error('Please enter email and password');

                const result = await ApiService.fetch('account/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email,
                        password,
                        _token: token
                    })
                });

                if (result?.session_id && result?.account) {
                    _self.state.accountInfo = result.account;
                    window.location.reload();
                } else {
                    throw new Error('Login failed. Please check your credentials');
                }
            }

            async getAccountInfo() {
                return await ApiService.fetch('account/info', {
                    method: 'GET'
                });
            }

            renderTurnstile(callback) {
                if (window.turnstile) {
                    turnstile.render('#turnstile-container', {
                        sitekey: Config.TURNSTILE_SITE_KEY,
                        callback,
                        'error-callback': () => ToastService.show('Captcha verification failed. Please try again', 'error', 5000)
                    });
                }
            }
        }

        class QRScannerLibrary {
            constructor(codeReader, videoId) {
                this.videoId = videoId;
                this.codeReader = codeReader;
                this.stream = null;
                this.state = {
                    isScanning: false,
                    isCameraGranted: false,
                    timeoutId: null
                };
            }

            async grantCameraPermissions() {
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    });

                    const videoElement = document.getElementById(this.videoId);
                    videoElement.srcObject = this.stream;
                    videoElement.setAttribute('playsinline', '');
                    videoElement.muted = true;
                    await videoElement.play();

                    this.state.isCameraGranted = true;
                    return true;
                } catch {
                    this.state.isCameraGranted = false;
                    return false;
                }
            }

            async startScan({ onSuccess, onError, onTimeout, timeout = Config.TIMEOUT_DURATION }) {
                Logger.log('QRScannerLibrary', 'info', 'Step 1: Starting Scanner...');

                if (this.state.isScanning) {
                    ToastService.show('Scanner Already Running', 'error', 5000);
                    return false;
                }

                this.state.isScanning = true;

                Logger.log('QRScannerLibrary', 'info', 'Step 2: Requesting Camera Permissions...');
                if (!this.state.isCameraGranted && !await this.grantCameraPermissions()) {
                    ToastService.show('Camera Access Denied', 'error', 5000);
                    this.state.isScanning = false;
                    if (onError) onError(new Error('Camera Access Denied'));
                    return false;
                }

                Logger.log('QRScannerLibrary', 'info', 'Step 3: Camera Permissions Granted, Starting Scan...');
                this.state.timeoutId = setTimeout(() => {
                    this.stopScan();
                    ToastService.show('Scan Timeout. Please try again', 'error', 5000);
                    if (onTimeout) onTimeout();
                }, timeout);

                Logger.log('QRScannerLibrary', 'info', 'Step 4: Scanning for QR Code...');
                try {
                    const result = await this.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result && result.text) {
                        this.clearTimeout();
                        if (onSuccess) await onSuccess(result.text);
                    }
                    return true;
                } catch (error) {
                    if (this.state.isScanning) {
                        ToastService.show(`Scanning Error: ${error.message}`, 'error', 5000);
                        if (onError) onError(error);
                    }
                    return false;
                }
            }

            async stopScan() {
                Logger.log('QRScannerLibrary', 'info', 'Stopping Scanner...');

                const videoElement = document.getElementById(this.videoId);
                if (videoElement) {
                    if (videoElement.srcObject) {
                        videoElement.srcObject.getTracks().forEach(track => track.stop());
                        videoElement.srcObject = null;
                    }
                    videoElement.pause();
                    videoElement.src = '';
                    videoElement.style.display = 'none';
                }

                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }

                if (this.codeReader?.videoElement?.srcObject) {
                    this.codeReader.videoElement.srcObject.getTracks().forEach(track => track.stop());
                    this.codeReader.videoElement.srcObject = null;
                    this.codeReader.stream?.getTracks().forEach(track => track.stop());
                    this.codeReader.stream = null;
                    await this.codeReader.reset();
                }

                this.state.isScanning = false;
                this.state.isCameraGranted = false;
                this.clearTimeout();
            }

            clearTimeout() {
                if (this.state.timeoutId) {
                    clearTimeout(this.state.timeoutId);
                    this.state.timeoutId = null;
                }
            }

            isScanning() {
                return this.state.isScanning;
            }
        }

                                    </svg>
                                    Reset
                                </button>
                            </div>
                        </div>
                    </div>
                `);
                _self.bindEvents();
            }

            updateDOM(result, isSuccess = false) {
                let _self = this;
                const instruction = $('#instruction');
                const resultContainer = $('#result-container');
                const resultValue = $('#result-value');
                const btnStart = $('#btn-start-scan');
                const btnReset = $('#btn-reset-scan');

                if (isSuccess) {
                    instruction.removeClass('scanner-screen__instruction--error').addClass('scanner-screen__instruction--success').text('Quét thành công!');
                    resultContainer.addClass('show');
                    resultValue.text(result);
                    btnStart.hide();
                    btnReset.show();
                    
                    $('#btn-group').html(`
                        <button class="scanner-screen__btn scanner-screen__btn--secondary" id="btn-next-scan">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                            Quét tiếp
                        </button>
                        <button class="scanner-screen__btn scanner-screen__btn--primary" id="btn-back-result">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 12H5M12 19l-7-7 7-7"/>
                            </svg>
                            Về trang chủ
                        </button>
                    `);
                    _self.bindResultEvents();
                } else {
                    instruction.addClass('scanner-screen__instruction--error').text('Không hợp lệ. Thử lại.');
                    btnStart.show();
                    btnReset.hide();
                }
            }

            bindEvents() {
                let _self = this;
                $(document).on('click', '#btn-back', () => _self.goBack());
                $(document).on('click', '#btn-start-scan', () => _self.startScanner());
                $(document).on('click', '#btn-reset-scan', () => _self.resetScanner());
            }

            bindResultEvents() {
                let _self = this;
                $(document).on('click', '#btn-next-scan', () => _self.nextScanner());
                $(document).on('click', '#btn-back-result', () => _self.goBack());
            }

            async resetScanner() {
                let _self = this;
                if (!_self.state.hasResult && !_self.state.qrScanner?.isScanning()) {
                    ToastService.show('Preparing Scanner. Please wait...', 'error', 5000);
                    return;
                }
                _self.state.hasResult = false;

                await _self.state.qrScanner?.stopScan();

                _self.render();
            }

            nextScanner() {
                let _self = this;
                _self.state.hasResult = false;
                _self.render();
                setTimeout(() => _self.startScanner(), 300);
            }

            async startScanner() {
                let _self = this;

                $('#btn-start-scan').hide();
                $('#btn-reset-scan').show();
                $('#instruction').text('Đang quét...').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');

                await _self.state.qrScanner.startScan({
                    onSuccess: async (qrData) => {
                        _self.state.hasResult = true;
                        await _self.state.qrScanner?.stopScan();
                        _self.updateDOM(qrData, true);
                    },
                    onError: async (error) => {
                        _self.state.hasResult = true;
                        await _self.state.qrScanner?.stopScan();
                        _self.updateDOM(null, false);
                        Logger.log('CheckinModule', 'error', error.message);
                    },
                    onTimeout: async () => {
                        _self.state.hasResult = true;
                        await _self.state.qrScanner?.stopScan();
                        _self.updateDOM(null, false);
                    }
                });
            }
        }

                        </svg>
                        Về trang chủ
                    </button>
                `);
                _self.bindResultEvents();
            }

            bindEvents() {
                let _self = this;
                $(document).on('click', '#btn-back', () => _self.goBack());
                $(document).on('click', '#btn-start-scan', () => _self.startCapture());
                $(document).on('click', '#btn-reset-scan', () => _self.reset());
            }

            bindResultEvents() {
                let _self = this;
                $(document).on('click', '#btn-reset-scan', () => _self.reset());
                $(document).on('click', '#btn-back-result', () => _self.goBack());
            }

            reset() {
                let _self = this;
                _self.render();
            }

            async startCapture() {
                const ZXing = ZXingWASM;
                let _self = this;

                $('#btn-start-scan').hide();
                $('#instruction').text('Chọn ảnh từ thư viện...');

                $('#file').click();

                $('#file').off('change').on('change', async (event) => {
                    const file = event.target.files[0];
                    if (!file) {
                        _self.render();
                        return;
                    }

                    try {
                        const { readBarcodes } = ZXing;
                        console.log('Selected file:', file.name, file.size, file.type);

                        $('#instruction').text('Đang xử lý ảnh...');

                        const result = await _self.processCheckoutImage({
                            file,
                            readBarcodes,
                            debug: true
                        });

                        if (result.ok) {
                            console.log('Decoded QR Code:', result.text);
                            const imageUrl = URL.createObjectURL(file);
                            _self.showResult(result.text, imageUrl);
                        } else {
                            ToastService.show('Không detect được QR. Gợi ý: chụp lại, đưa bib vào giữa khung và tăng ánh sáng.', 'error', 5000);
                            _self.render();
                        }
                    } catch (error) {
                        ToastService.show(`Lỗi xử lý ảnh: ${error.message}`, 'error', 5000);
                        console.error(error);
                        _self.render();
                    } finally {
                        event.target.value = '';
                    }
                });
            }

            async processCheckoutImage({ file, readBarcodes, debug }) {
                const logger = (msg, data) => {
                    if (debug) console.log(`[checkout] ${msg}`, data || '');
                };

                logger('processCheckoutImage', { name: file.name, type: file.type, sizeKB: Math.round(file.size / 1024) });

                const bitmap = await createImageBitmap(file);
                logger('bitmap.size', { width: bitmap.width, height: bitmap.height });

                const masterMaxLongEdge = 2200;
                const fitted = this.fitContain(bitmap.width, bitmap.height, masterMaxLongEdge);

                const master = document.createElement('canvas');
                const mctx = master.getContext('2d', { willReadFrequently: true });
                master.width = fitted.w;
                master.height = fitted.h;
                mctx.drawImage(bitmap, 0, 0, fitted.w, fitted.h);
                logger('master.size', { width: master.width, height: master.height });

                const decodeFromCanvas = async (canvas, tag) => {
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const t = performance.now();
                    const res = await readBarcodes(imgData);
                    logger(`decode ${tag} took ${(performance.now() - t).toFixed(1)}ms`);
                    return Array.isArray(res) ? res : [];
                };

                let barcodes = [];

                logger('decode ROI...');
                const roiCanvas = this.cropCenterROI(master, 0.70, 0.85);
                const roiSmall = this.resizeToWidth(roiCanvas, 1200);
                barcodes = await decodeFromCanvas(roiSmall, 'ROI-1200');

                if (!barcodes.length) {
                    logger('decode FULL 1600...');
                    const fullSmall = this.resizeToWidth(master, 1600);
                    barcodes = await decodeFromCanvas(fullSmall, 'FULL-1600');
                }

                if (!barcodes.length) {
                    logger('decode FULL 2400...');
                    const fullBigger = this.resizeToWidth(master, 2400);
                    barcodes = await decodeFromCanvas(fullBigger, 'FULL-2400');
                }

                logger('barcodes', barcodes);
                const text = barcodes[0]?.text || barcodes[0]?.rawValue || '';
                const ok = Boolean(text);
                logger('result', { ok, text });

                return { ok, text, barcodes };
            }

            fitContain(w, h, maxLongEdge) {
                const longEdge = Math.max(w, h);
                if (longEdge <= maxLongEdge) return { w, h };
                const scale = maxLongEdge / longEdge;
                return { w: Math.round(w * scale), h: Math.round(h * scale) };
            }

            cropCenterROI(sourceCanvas, roiWPercent, roiHPercent) {
                const sw = sourceCanvas.width, sh = sourceCanvas.height;
                const rw = Math.max(1, Math.round(sw * roiWPercent));
                const rh = Math.max(1, Math.round(sh * roiHPercent));
                const rx = Math.round((sw - rw) / 2);
                const ry = Math.round((sh - rh) / 2);

                const c = document.createElement('canvas');
                c.width = rw; c.height = rh;
                const ctx = c.getContext('2d');
                ctx.drawImage(sourceCanvas, rx, ry, rw, rh, 0, 0, rw, rh);
                return c;
            }

            resizeToWidth(sourceCanvas, targetW) {
                if (sourceCanvas.width <= targetW) return sourceCanvas;

                const scale = targetW / sourceCanvas.width;
                const tw = targetW;
                const th = Math.max(1, Math.round(sourceCanvas.height * scale));

                const c = document.createElement('canvas');
                c.width = tw; c.height = th;
                const ctx = c.getContext('2d');
                ctx.drawImage(sourceCanvas, 0, 0, tw, th);
                return c;
            }
        }

        class App {
            static async start() {
                // const auth = await new AuthModule().init();
                // if (!auth.isLoggedIn()) {
                //     auth.render();
                //     return;
                // }

                new ScreenManager().render();
            }
        }

        $(document).ready(() => App.start());
    </script>
</body>
