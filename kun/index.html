        class Logger {
            static log(module, type, message, data = null) {
                const logMessage = `[${module}] [${type}] ${message}`;
                type === 'error' ? console.error(logMessage) : console.log(logMessage);
                if (data) console.log(data);
            }
        }

        class ToastService {
            static show(message, type = 'info', duration = 3000) {
                const backgrounds = {
                    info: 'linear-gradient(to right, #00b09b, #96c93d)',
                    error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                    success: 'linear-gradient(to right, #56ab2f, #a8e063)'
                };

                Toastify({
                    text: message,
                    duration,
                    close: true,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: backgrounds[type] || backgrounds.info
                    }
                }).showToast();
            }
        }

        class ApiService {
            static async fetch(endpoint, options = {}) {
                try {
                    const response = await fetch(`${Config.API_BASE_URL}${endpoint}`, {
                        ...options,
                        credentials: 'include',
                    });
                    const result = await response.json();
                    Logger.log('ApiService', 'info', `[API][${endpoint}] Response:`, result);
                    if (result.code != 200) throw new Error(result.message || 'API request failed');
                    return result.data ? result.data : true;
                } catch (error) {
                    Logger.log('ApiService', 'error', `[API][${endpoint}]: ${error.message}`);
                    throw error;
                }
            }
        }

        class QRScannerLibrary {
            constructor(codeReader, videoId) {
                this.videoId = videoId;
                this.codeReader = codeReader;
                this.state = {
                    isScanning: false,
                    timeoutId: null
                };
            }

            async startScan({ onSuccess, onError, onTimeout, timeout = Config.TIMEOUT_DURATION }) {
                if (this.state.isScanning) {
                    ToastService.show('Scanner Already Running', 'error', 5000);
                    return false;
                }

                this.state.isScanning = true;

                const videoElement = document.getElementById(this.videoId);
                if (videoElement) {
                    videoElement.setAttribute('playsinline', '');
                    videoElement.muted = true;
                }

                this.state.timeoutId = setTimeout(() => {
                    this.stopScan();
                    ToastService.show('Scan Timeout. Please try again', 'error', 5000);
                    if (onTimeout) onTimeout();
                }, timeout);

                try {
                    const result = await this.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result?.text) {
                        this.clearTimeout();
                        if (onSuccess) await onSuccess(result.text);
                    }
                    return true;
                } catch (error) {
                    if (this.state.isScanning) {
                        ToastService.show(`Scanning Error: ${error.message}`, 'error', 5000);
                        if (onError) onError(error);
                    }
                    return false;
                }
            }

            stopScan() {
                this.state.isScanning = false;
                this.clearTimeout();
                this.codeReader.reset();
            }

            clearTimeout() {
                if (this.state.timeoutId) {
                    clearTimeout(this.state.timeoutId);
                    this.state.timeoutId = null;
                }
            }

            isScanning() {
                return this.state.isScanning;
            }
        }

            updateDOM(result, isSuccess = false) {
                const instruction = $('#instruction');
                const btnStart = $('#btn-start-scan');
                const btnReset = $('#btn-reset-scan');

                if (isSuccess) {
                    instruction.removeClass('scanner-screen__instruction--error').addClass('scanner-screen__instruction--success').text('Quét thành công!');

                    // Show info card with result data
                    const data = typeof result === 'object' ? result : { bib: result };
                    $('#info-bib').text(data.bib || '—');
                    $('#info-name').text(data.name || '—');
                    $('#info-phone').text(data.phone || '—');

                    const statusText = data.status || '—';
                    const statusClass = data.statusType === 'error' ? 'scanner-screen__info-status--error'
                        : data.statusType === 'pending' ? 'scanner-screen__info-status--pending'
                        : 'scanner-screen__info-status--success';
                    $('#info-status').html(`<span class="scanner-screen__info-status ${statusClass}">${statusText}</span>`);
                    $('#info-card').show();

                    // Hide frame when result shown
                    $('#scanner-frame-container').hide();

                    btnStart.hide();
                    btnReset.hide();

                    $('#btn-group').html(`
                        <button class="scanner-screen__btn scanner-screen__btn--secondary" id="btn-next-scan">Quét tiếp</button>                        
                    `);
                } else {
                    instruction.addClass('scanner-screen__instruction--error').text('Không hợp lệ. Thử lại.');
                    btnStart.show();
                    btnReset.hide();
                }
            }

            bindEvents() {
                const $box = $(this.selectors.box);                
                $box.on('click', '#btn-start-scan', () => this.startScanner());
                $box.on('click', '#btn-reset-scan', () => this.resetScanner());
                $box.on('click', '#btn-next-scan', () => this.nextScanner());
            }

            resetScanner() {
                if (!this.state.hasResult && !this.state.qrScanner?.isScanning()) {
                    ToastService.show('Preparing Scanner. Please wait...', 'error', 5000);
                    return;
                }
                this.state.hasResult = false;
                this.state.qrScanner?.stopScan();
                this.render();
            }

            nextScanner() {
                this.state.hasResult = false;
                this.render();
                setTimeout(() => this.startScanner(), 300);
            }

            async startScanner() {
                $('#btn-start-scan').hide();
                $('#btn-reset-scan').show();
                $('#scanner-frame-container').addClass('scanner-screen__frame--active');
                $('#instruction').text('Đang quét...').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');

                const handleResult = (result, isSuccess) => {
                    this.state.hasResult = true;
                    this.state.qrScanner?.stopScan();
                    this.updateDOM(result, isSuccess);
                };

                await this.state.qrScanner.startScan({
                    onSuccess: (qrData) => handleResult(qrData, true),
                    onError: (error) => {
                        Logger.log('CheckinModule', 'error', error.message);
                        return handleResult(null, false);
                    },
                    onTimeout: () => handleResult(null, false)
                });
            }
        }

        class ImageUtils {
            static fitContain(w, h, maxLongEdge) {
                const longEdge = Math.max(w, h);
                if (longEdge <= maxLongEdge) return { w, h };
                const scale = maxLongEdge / longEdge;
                return { w: Math.round(w * scale), h: Math.round(h * scale) };
            }

            static cropCenterROI(sourceCanvas, roiWPercent, roiHPercent) {
                const sw = sourceCanvas.width, sh = sourceCanvas.height;
                const rw = Math.max(1, Math.round(sw * roiWPercent));
                const rh = Math.max(1, Math.round(sh * roiHPercent));
                const rx = Math.round((sw - rw) / 2);
                const ry = Math.round((sh - rh) / 2);

                const c = document.createElement('canvas');
                c.width = rw; c.height = rh;
                c.getContext('2d').drawImage(sourceCanvas, rx, ry, rw, rh, 0, 0, rw, rh);
                return c;
            }

            static resizeToWidth(sourceCanvas, targetW) {
                if (sourceCanvas.width <= targetW) return sourceCanvas;
                const scale = targetW / sourceCanvas.width;
                const th = Math.max(1, Math.round(sourceCanvas.height * scale));

                const c = document.createElement('canvas');
                c.width = targetW; c.height = th;
                c.getContext('2d').drawImage(sourceCanvas, 0, 0, targetW, th);
                return c;
            }
        }

                $('#info-name').text(data.name || '—');
                $('#info-phone').text(data.phone || '—');

                const statusText = data.status || '—';
                const statusClass = data.statusType === 'error' ? 'scanner-screen__info-status--error'
                    : data.statusType === 'pending' ? 'scanner-screen__info-status--pending'
                    : 'scanner-screen__info-status--success';
                $('#info-status').html(`<span class="scanner-screen__info-status ${statusClass}">${statusText}</span>`);
                $('#info-card').show();

                $('#btn-group').html(`
                    <button class="scanner-screen__btn scanner-screen__btn--secondary" id="btn-reset-scan">Chụp lại</button>                    
                `);
            }

            bindEvents() {
                const $box = $(this.selectors.box);                
                $box.on('click', '#btn-start-scan', () => this.startCapture());
                $box.on('click', '#btn-reset-scan', () => this.reset());
            }

            reset() {
                this.render();
            }

            async startCapture() {
                $('#btn-start-scan').hide();
                $('#instruction').text('Chọn ảnh từ thư viện...');

                $('#file').click();

                $('#file').off('change').on('change', async (event) => {
                    const file = event.target.files[0];
                    if (!file) {
                        this.render();
                        return;
                    }

                    try {
                        const { readBarcodes } = ZXingWASM;
                        Logger.log('CheckoutModule', 'info', `Selected file: ${file.name} (${Math.round(file.size / 1024)}KB)`);

                        $('#instruction').text('Đang xử lý ảnh...');

                        const result = await this.processCheckoutImage({ file, readBarcodes });

                        if (result.ok) {
                            const imageUrl = URL.createObjectURL(file);
                            this.showResult(result.text, imageUrl);
                        } else {
                            ToastService.show('Không detect được QR. Gợi ý: chụp lại, đưa bib vào giữa khung và tăng ánh sáng.', 'error', 5000);
                            this.render();
                        }
                    } catch (error) {
                        ToastService.show(`Lỗi xử lý ảnh: ${error.message}`, 'error', 5000);
                        Logger.log('CheckoutModule', 'error', error.message);
                        this.render();
                    } finally {
                        event.target.value = '';
                    }
                });
            }

            async processCheckoutImage({ file, readBarcodes }) {
                const bitmap = await createImageBitmap(file);
                const fitted = ImageUtils.fitContain(bitmap.width, bitmap.height, 2200);

                const master = document.createElement('canvas');
                master.width = fitted.w;
                master.height = fitted.h;
                master.getContext('2d', { willReadFrequently: true }).drawImage(bitmap, 0, 0, fitted.w, fitted.h);

                const decodeFromCanvas = async (canvas) => {
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const res = await readBarcodes(imgData);
                    return Array.isArray(res) ? res : [];
                };

                const strategies = [
                    () => decodeFromCanvas(ImageUtils.resizeToWidth(ImageUtils.cropCenterROI(master, 0.70, 0.85), 1200)),
                    () => decodeFromCanvas(ImageUtils.resizeToWidth(master, 1600)),
                    () => decodeFromCanvas(ImageUtils.resizeToWidth(master, 2400)),
                ];

                for (const strategy of strategies) {
                    const barcodes = await strategy();
                    if (barcodes.length) {
                        const text = barcodes[0]?.text || barcodes[0]?.rawValue || '';
                        if (text) return { ok: true, text, barcodes };
                    }
                }

                return { ok: false, text: '', barcodes: [] };
            }
        }

        class App {
            static async start() {
                // const auth = await new AuthModule().init();
                // if (!auth.isLoggedIn()) {
                //     auth.render();
                //     return;
                // }

                screenManager = new ScreenManager();
                screenManager.render();
            }
        }

        $(document).ready(() => App.start());
    </script>
</body>
