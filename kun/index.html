        // ========================================

        function showToast(message, type = 'info', duration = 3000) {
            const styles = {
                info: 'linear-gradient(to right, #00b09b, #96c93d)',
                error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                success: 'linear-gradient(to right, #56ab2f, #a8e063)'
            };

            Toastify({
                text: message,
                duration,
                close: true,
                gravity: 'top',
                position: 'center',
                style: { background: styles[type] || styles.info }
            }).showToast();
        }

        function formatImageSize(width, height, maxEdge) {
            const longEdge = Math.max(width, height);
            if (longEdge <= maxEdge) return { width, height };
            const scale = maxEdge / longEdge;
            return {
                width: Math.round(width * scale),
                height: Math.round(height * scale)
            };
        }

        function cropCenterImage(sourceCanvas, widthPercent, heightPercent) {
            const sw = sourceCanvas.width, sh = sourceCanvas.height;
            const rw = Math.max(1, Math.round(sw * widthPercent));
            const rh = Math.max(1, Math.round(sh * heightPercent));
            const rx = Math.round((sw - rw) / 2);
            const ry = Math.round((sh - rh) / 2);

            const canvas = document.createElement('canvas');
            canvas.width = rw; canvas.height = rh;
            canvas.getContext('2d').drawImage(sourceCanvas, rx, ry, rw, rh, 0, 0, rw, rh);
            return canvas;
        }

        function resizeToWidth(sourceCanvas, targetWidth) {
            if (sourceCanvas.width <= targetWidth) return sourceCanvas;
            const scale = targetWidth / sourceCanvas.width;
            const th = Math.max(1, Math.round(sourceCanvas.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = targetWidth; canvas.height = th;
            canvas.getContext('2d').drawImage(sourceCanvas, 0, 0, targetWidth, th);
            return canvas;
        }

        async function downloadBlob(blob, filename) {
            const isIOS =
                /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

            const url = URL.createObjectURL(blob);

            try {
                if (isIOS) {
                    console.log('iOS detected, opening image in new tab');
                    // const shareFile = new File([blob], filename, { type: blob.type || "application/octet-stream" });

                    // if (navigator.canShare?.({ files: [shareFile] }) && navigator.share) {
                    //     await navigator.share({
                    //         files: [shareFile],
                    //         title: filename,
                    //     });
                    //     return;
                    // }

                    const w = window.open(url, "_blank", "noopener,noreferrer");
                    if (!w) {
                        window.location.href = url;
                    }
                    return;
                }

                const a = document.createElement("a");
                a.href = url;
                a.download = filename;
                a.rel = "noopener";
                document.body.appendChild(a);
                a.click();
                a.remove();
            } finally {
                setTimeout(() => URL.revokeObjectURL(url), 60_000);
            }
        }

        async function compressImage(file, minSizeKB = 300, maxSizeKB = 500) {
            if (!file.type.startsWith('image/')) {
                return Promise.reject(new Error('File is not an image'));
            }

            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const { width, height } = formatImageSize(img.width, img.height, CONFIG.IMAGE_MAX_SIZE);
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(blob => {
                        const sizeKB = blob.size / 1024;
                        if (sizeKB <= minSizeKB || sizeKB <= maxSizeKB) {
                            resolve(blob);
                        } else {
                            reject(new Error('Compressed image exceeds maximum size'));
                        }
                    }, 'image/jpeg', CONFIG.IMAGE_COMPRESS_QUALITY);
                };
                img.onerror = () => reject(new Error('Failed to load image'));
                img.src = URL.createObjectURL(file);
            });
        }

        async function apiRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, {
                    ...options,
                });
                const result = await response.json();

                if (result.code != 200) {
                    throw new Error(result.message || 'API request failed');
                }
                return result.data || false;
            } catch (error) {
                console.log('[API] Error:', error.message);
                return false;
            }
        }

        // ========================================
        // QR SCANNER
        // ========================================

        class QRScanner {
            constructor(codeReader, videoId) {
                this.codeReader = codeReader;
                this.videoId = videoId;
                this.isScanning = false;
                this.timeoutId = null;
            }

            async start(options = {}) {
                const { onSuccess, onError, onTimeout, timeout = CONFIG.TIMEOUT_DURATION } = options;

                if (this.isScanning) {
                    showToast('Scanner Already Running', 'error', 5000);
                    return false;
                }

                this.isScanning = true;
                this._setupVideo();

                this.timeoutId = setTimeout(() => {
                    this.stop();
                    showToast('Scan Timeout. Please try again', 'error', 5000);
                    if (onTimeout) onTimeout();
                }, timeout);

                try {
                    const result = await this.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result?.text) {
                        this.clearTimeout();
                        if (onSuccess) await onSuccess(result.text);
                    }
                    return true;
                } catch (error) {
                    if (this.isScanning) {
                        showToast(`Scanning Error: ${error.message}`, 'error', 5000);
                        if (onError) onError(error);
                    }
                    return false;
                }
            }

            stop() {
                this.isScanning = false;
                this.clearTimeout();
                this.codeReader.reset();
            }

            clearTimeout() {
                if (this.timeoutId) {
                    clearTimeout(this.timeoutId);
                    this.timeoutId = null;
                }
            }

            _setupVideo() {
                const video = document.getElementById(this.videoId);
                if (video) {
                    video.setAttribute('playsinline', '');
                    video.muted = true;
                }
            }
        }

        // ========================================
        // QR CODE PROCESSOR (For Image Processing)
        // ========================================

        async function processQRFromImage(file) {
            const { readBarcodes } = ZXingWASM;
            const bitmap = await createImageBitmap(file);
            const fitted = formatImageSize(bitmap.width, bitmap.height, 2200);

            const master = document.createElement('canvas');
            master.width = fitted.width;
            master.height = fitted.height;
            master.getContext('2d').drawImage(bitmap, 0, 0, fitted.width, fitted.height);

            async function decodeFrom(canvas) {
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const res = await readBarcodes(imgData);
                return Array.isArray(res) ? res : [];
            }

            const strategies = [
                () => decodeFrom(resizeToWidth(cropCenterImage(master, 0.70, 0.85), 1200)),
                () => decodeFrom(resizeToWidth(master, 1600)),
                () => decodeFrom(resizeToWidth(master, 2400))
            ];

            for (const strategy of strategies) {
                const barcodes = await strategy();
                if (barcodes.length) {
                    const text = barcodes[0]?.text || barcodes[0]?.rawValue || '';
                    if (text) return { ok: true, text, barcodes };
                }
            }

            return { ok: false, text: '', barcodes: [] };
        }

            }

            }

            render() {
                $('#checkin-screen-wrapper').html(`
                    <div class="scanner-screen">
                        <div class="scanner-screen__header">

                        </div>

                        <div class="scanner-screen__frame" id="checkin-scanner-frame">${this.getVideoFrameMarkup()}</div>

                        <div class="scanner-screen__content">
                            <p class="scanner-screen__instruction" id="checkin-instruction">${this.defaultInstruction}</p>

                            <div class="scanner-screen__info" id="checkin-info-card" style="display:none">
                                <div class="scanner-screen__info-body">
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Mã BIB</span><span class="scanner-screen__info-value" id="checkin-info-bib">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Họ tên</span><span class="scanner-screen__info-value" id="checkin-info-name">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">SĐT</span><span class="scanner-screen__info-value" id="checkin-info-phone">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Trạng thái</span><span class="scanner-screen__info-value" id="checkin-info-status">—</span></div>
                                </div>
                            </div>

                            <div class="scanner-screen__actions" id="checkin-actions-group">
                                <input class="scanner-screen__bib-input" id="checkin-manual-bib-input" type="number" inputmode="numeric" placeholder="Nhập số BIB" style="display:none" />

                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkin-btn-open-camera">Không có QR ? (Mở Camera)</button>
                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkin-btn-reset-scan" style="display:none">Reset</button>

                `).show();

                this.scanner = new QRScanner(new ZXing.BrowserQRCodeReader(), this.videoId);
                this.handleEvents();
            }

            handleEvents() {
                $('#checkin-btn-start-scan').on('click', () => this.startScan());
                $('#checkin-btn-open-camera').on('click', () => this.openCamera());
                $('#checkin-btn-confirm').on('click', () => this.confirmCheckin());
                $('#checkin-btn-back').on('click', () => this.goBack());
                $('#checkin-btn-reset-scan').on('click', () => this.reset());
            }

            startScan() {
                $('#checkin-btn-start-scan, #checkin-btn-open-camera').hide();
                $('#checkin-btn-reset-scan').show();
                // $('#checkin-scanner-frame').remove('scanner-screen__frame--active');
                $('#checkin-instruction').text('Đang quét...').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $('#checkin-info-card').hide();

                const handleResult = async (result, isSuccess) => {
                    this.scanner.stop();
                    let data = null;
                    if (result) {
                        data = await apiRequest('add3f330-5159-466c-a8a5-d9967322d651', { method: 'POST' });
                    }

                    if (isSuccess && data) {
                        $('#checkin-instruction').text('Thành công').addClass('scanner-screen__instruction--success').removeClass('scanner-screen__instruction--error');
                        this.renderCheckinInfo(data);
                    } else {
                        $('#checkin-instruction').text('Quét thất bại. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                    }

                    $('#checkin-btn-start-scan').text('Tiếp tục quét').show();
                };

                this.scanner.start({
                    onSuccess: (result) => handleResult(result, true),
                    onError: () => handleResult(null, false),
                    onTimeout: () => handleResult(null, false)
                });
            }

            openCamera() {
                $('#checkin-scanner-frame').removeClass('scanner-screen__frame--has-image');
                this.renderVideoFrame();
                $('#checkin-btn-start-scan, #checkin-btn-open-camera').hide();
                $('#checkin-btn-reset-scan').show();
                $('#checkin-instruction').text('Chụp ảnh BIB, sau đó nhập số BIB để Xác nhận').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $('#checkin-info-card').hide();

                const handleResult = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    const url = URL.createObjectURL(file);
                    $('#checkin-scanner-frame')
                        .addClass('scanner-screen__frame--has-image')
                        .html(`<img src="${url}" alt="Captured" width="100%" height="100%" style="object-fit: contain;" />`);

                    $('#checkin-instruction')
                        .text('Nhập số BIB, sau đó nhấn Xác nhận')
                        .addClass('scanner-screen__instruction--success')
                        .removeClass('scanner-screen__instruction--error');

                    $('#checkin-manual-bib-input').show().trigger('focus');
                    $('#checkin-btn-confirm').show();
                };

                $('#checkin-file-input').off('change').on('change', handleResult).trigger('click');
            }

            async confirmCheckin() {
                const bib = ($('#checkin-manual-bib-input').val() || '').trim();
                if (!bib) {
                    showToast('Vui lòng nhập số BIB', 'error', 5000);
                    return;
                }

                try {
                    $('#modal').addClass('is-open');
                    const fileInput = $('#checkin-file-input')[0];
                    const file = fileInput?.files?.[0] || null;

                    const fileCompressed = null;
                    if (file) {
                        try {
                            fileCompressed = await compressImage(file, 300, 500);
                            downloadBlob(fileCompressed, `VM_CHECKIN_${bib}_${Date.now()}.jpg`);
                        } catch (e) {
                            console.log('Compress failed, using original');
                        }
                    }

                    const form = new FormData();
                    form.append('bib', bib);
                    if (fileCompressed) form.append('file', fileCompressed);

                    const data = await apiRequest('add3f330-5159-466c-a8a5-d9967322d651', {
                        method: 'POST',
                        // body: form
                    });

                    if (data) {
                        $('#checkin-instruction').text('Thành công').addClass('scanner-screen__instruction--success').removeClass('scanner-screen__instruction--error');
                        this.renderCheckinInfo(data);
                    } else {
                        $('#checkin-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                    }

                    $('#checkin-manual-bib-input, #checkin-btn-confirm').hide();
                    $('#checkin-btn-open-camera').removeClass('scanner-screen__btn--secondary').addClass('scanner-screen__btn--primary').text('Mở Camera').show();
                    $('#checkin-manual-bib-input, #checkin-file-input').val('');
                } finally {
                    $('#modal').removeClass('is-open');
                }
            }

            reset() {
                this.scanner.stop();
                $('#checkin-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--active');
                this.renderVideoFrame();
                $('#checkin-instruction').text(this.defaultInstruction).removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $('#checkin-info-card').hide();
                $('#checkin-btn-start-scan').text('Quét QR').show();
                $('#checkin-btn-open-camera').removeClass('scanner-screen__btn--primary').addClass('scanner-screen__btn--secondary').text('Không có QR ? (Mở Camera)').show();
                $('#checkin-btn-reset-scan').hide();
                $('#checkin-manual-bib-input, #checkin-file-input, #checkin-btn-confirm').hide();
            }

            goBack() {
                this.reset();
                $('#checkin-screen-wrapper').hide();
                $('#screen-manager').show();
            }
        }

                            <div class="scanner-screen__actions" id="checkout-actions-group">
                                <input class="scanner-screen__bib-input" id="checkout-manual-bib-input" type="number" inputmode="numeric" placeholder="Nhập số BIB" style="display:none" />
                                <button class="scanner-screen__btn scanner-screen__btn--primary" id="checkout-btn-confirm" style="display:none">Xác nhận</button>
                                <button class="scanner-screen__btn scanner-screen__btn--primary" id="checkout-btn-open-camera">Mở camera</button>
                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkout-btn-reset" style="display:none">Reset</button>
                            </div>
                        </div>

                        <input type="file" id="checkout-file-input" accept="image/*" capture="environment" style="display:none" />
                    </div>
                `).show();

                this.isInit = true;
                this.handleEvents();
            }

            handleEvents() {
                $('#checkout-btn-open-camera').on('click', () => this.openCamera());
                $('#checkout-btn-confirm').on('click', () => this.confirmCheckout());
                $('#checkout-btn-back').on('click', () => this.goBack());
                $('#checkout-btn-reset').on('click', () => this.reset());
            }

            openCamera() {
                $('#checkout-scanner-frame').removeClass('scanner-screen__frame--has-image').html(`
                    <div class="scanner-screen__placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        <span>Chưa có ảnh</span>
                    </div>
                `);
                $('#checkout-instruction').text('Chụp ảnh QR trên BIB').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $('#checkout-info-card').hide();

                const handleResult = async (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    const url = URL.createObjectURL(file);
                    $('#checkout-instruction').text('Đang xử lý ảnh...');

                    $('#checkout-scanner-frame')
                        .addClass('scanner-screen__frame--has-image')
                        .html(`<img src="${url}" alt="Captured" width="100%" height="100%" style="object-fit: contain;" />`);

                    const result = await processQRFromImage(file);

                    if (result.ok) {
                        const data = await apiRequest('add3f330-5159-466c-a8a5-d9967322d651', { method: 'POST' });

                        if (data) {
                            try {
                                const compressed = await compressImage(file, 300, 500);
                                downloadBlob(compressed, `VM_CHECKOUT_${result.text}_${Date.now()}.jpg`);
                            } catch (e) { }

                            $('#checkout-instruction').text('Thành công').addClass('scanner-screen__instruction--success').removeClass('scanner-screen__instruction--error');
                            this._showResultInfo(data);
                        } else {
                            this._showManualInput();
                        }
                    } else {
                        this._showManualInput();
                    }
                };

                $('#checkout-file-input').off('change').on('change', handleResult).trigger('click');
            }

            _showResultInfo(data) {
                $('#checkout-info-card').show();
                $('#checkout-info-bib').text(data.bib || '—');
                $('#checkout-info-name').text(data.name || '—');
                $('#checkout-info-phone').text(data.phone || '—');

                const statusText = data.status === STATUS.CHECKOUT_SUCCESS ? 'Check-out thành công' : 'Check-out thất bại';
                const statusClass = data.status === STATUS.CHECKOUT_SUCCESS
                    ? 'scanner-screen__info-status--success'
                    : 'scanner-screen__info-status--error';

                $('#checkout-info-status').html(`<span class="scanner-screen__info-status ${statusClass}">${statusText}</span>`);
            }

            _showManualInput() {
                $('#checkout-scanner-frame').removeClass('scanner-screen__frame--has-image');
                $('#checkout-instruction').text('Không nhận diện được QR. Thử lại hoặc nhập thủ công số Bib').addClass('scanner-screen__instruction--error').removeClass('scanner-screen__instruction--success');
                $('#checkout-manual-bib-input, #checkout-btn-reset, #checkout-btn-confirm').show();
                $('#checkout-btn-open-camera').hide();
            }

            async confirmCheckout() {
                const bib = ($('#checkout-manual-bib-input').val() || '').trim();
                if (!bib) {
                    showToast('Vui lòng nhập số BIB', 'error', 5000);
                    return;
                }

                try {
                    $('#modal').addClass('is-open');
                    const fileInput = $('#checkout-file-input')[0];
                    const file = fileInput?.files?.[0] || null;

                    let fileCompressed = null;
                    if (file) {
                        try {
                            fileCompressed = await compressImage(file, 300, 500);
                            downloadBlob(fileCompressed, `VM_CHECKOUT_${bib}_${Date.now()}.jpg`);
                        } catch (e) { }
                    }

                    const form = new FormData();
                    form.append('bib', bib);
                    if (fileCompressed) form.append('file', fileCompressed);

                    const data = await apiRequest('add3f330-5159-466c-a8a5-d9967322d651', { method: 'POST', body: form });

                    if (data) {
                        $('#checkout-instruction').text('Thành công').addClass('scanner-screen__instruction--success').removeClass('scanner-screen__instruction--error');
                        this._showResultInfo(data);
                    } else {
                        $('#checkout-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                    }

                    $('#checkout-manual-bib-input, #checkout-btn-confirm').hide();
                    $('#checkout-btn-open-camera').removeClass('scanner-screen__btn--secondary').addClass('scanner-screen__btn--primary').text('Mở Camera').show();
                    $('#checkout-manual-bib-input, #checkout-file-input').val('');
                } finally {
                    $('#modal').removeClass('is-open');
                }
            }

            goBack() {
                this.reset();
                $('#checkout-screen-wrapper').hide();
                $('#screen-manager').show();
            }

            reset() {
                $('#checkout-scanner-frame').removeClass('scanner-screen__frame--has-image').html(`
                    <div class="scanner-screen__placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        <span>Chưa có ảnh</span>
                    </div>
                `);
                $('#checkout-instruction').text('Chụp ảnh QR trên BIB').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $('#checkout-info-card, #checkout-manual-bib-input, #checkout-btn-confirm').hide();
            }
        }

        // ========================================
        // MAIN APP
        // ========================================

        class App {
            static async start() {
                // const authScreen = new AuthScreen();
                // await authScreen.init();
                // if (!authScreen.isLoggedIn()) { authScreen.render(); return; }

                $('#screen-manager').html(`
                    <div class="screen-manager">
                        <div class="screen-manager__header">
                            <div class="screen-manager__logo">
                                <img src="https://st-vm.vnecdn.net/v74/images/marathon/graphics/vm_new_logo.svg" alt="VnExpress Marathon">
                            </div>
                            <h1 class="screen-manager__title">QR Scanner</h1>
                            <p class="screen-manager__subtitle">Chọn thao tác để tiếp tục</p>
                        </div>

                        <div class="screen-manager__cards">
                            <div class="screen-manager__card" id="card-checkin">
                                <div class="screen-manager__card-icon screen-manager__card-icon--checkin">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M9 11l3 3L22 4"/>
                                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                                    </svg>
                                </div>
                                <div class="screen-manager__card-content">
                                    <h3 class="screen-manager__card-title">Check In</h3>
                                    <p class="screen-manager__card-desc">Quét QR để vào cổng</p>
                                </div>
                                <div class="screen-manager__card-arrow">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                            </div>

                            <div class="screen-manager__card" id="card-checkout">
                                <div class="screen-manager__card-icon screen-manager__card-icon--checkout">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                                        <polyline points="16 17 21 12 16 7"/>
                                        <line x1="21" y1="12" x2="9" y2="12"/>
                                    </svg>
                                </div>
                                <div class="screen-manager__card-content">
                                    <h3 class="screen-manager__card-title">Check Out</h3>
                                    <p class="screen-manager__card-desc">Chụp ảnh QR để ra cổng</p>
                                </div>
                                <div class="screen-manager__card-arrow">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                            </div>
                        </div>

                        <div class="screen-manager__footer">
                            <p class="screen-manager__footer-text">Powered by vRace</p>
                        </div>
                    </div>
                `).show();

                const checkinModule = new CheckinModule();
                const checkoutModule = new CheckoutModule();

                $('#card-checkin').on('click', () => {
                    $('#screen-manager').hide();
                    if (!checkinModule.isInit) {
                        checkinModule.render();
                    } else {
                        $('#checkin-screen-wrapper').show();
                    }
                });

                $('#card-checkout').on('click', () => {
                    $('#screen-manager').hide();
                    if (!checkoutModule.isInit) {
                        checkoutModule.render();
                    } else {
                        $('#checkout-screen-wrapper').show();
                    }
                });
            }
        }

        $(document).ready(() => App.start());
    </script>
</body>
