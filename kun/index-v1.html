        function setCookie(name, value, days = 1) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(?:^|; )' + encodeURIComponent(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
            return match ? decodeURIComponent(match[1]) : null;
        }

        function showToast(message, type = 'info', duration = 3000) {
            const styles = {
                info: 'linear-gradient(to right, #00b09b, #96c93d)',
                error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                success: 'linear-gradient(to right, #56ab2f, #a8e063)'
            };

            Toastify({
                text: message,
                duration,
                close: true,
                gravity: 'top',
                position: 'center',
                style: {
                    background: styles[type] || styles.info
                }
            }).showToast();
        }

        function formatImageSize(width, height, maxEdge) {
            const longEdge = Math.max(width, height);
            if (longEdge <= maxEdge) return {
                width,
                height
            };
            const scale = maxEdge / longEdge;
            return {
                width: Math.round(width * scale),
                height: Math.round(height * scale)
            };
        }

        function cropCenterImage(sourceCanvas, widthPercent, heightPercent) {
            const sw = sourceCanvas.width,
                sh = sourceCanvas.height;
            const rw = Math.max(1, Math.round(sw * widthPercent));
            const rh = Math.max(1, Math.round(sh * heightPercent));
            const rx = Math.round((sw - rw) / 2);
            const ry = Math.round((sh - rh) / 2);

            const canvas = document.createElement('canvas');
            canvas.width = rw;
            canvas.height = rh;
            canvas.getContext('2d').drawImage(sourceCanvas, rx, ry, rw, rh, 0, 0, rw, rh);
            return canvas;
        }

        function resizeToWidth(sourceCanvas, targetWidth) {
            if (sourceCanvas.width <= targetWidth) return sourceCanvas;
            const scale = targetWidth / sourceCanvas.width;
            const th = Math.max(1, Math.round(sourceCanvas.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = th;
            canvas.getContext('2d').drawImage(sourceCanvas, 0, 0, targetWidth, th);
            return canvas;
        }

        async function downloadBlob(blobOrFile, filename) {
            const url = URL.createObjectURL(blobOrFile);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            if (isIOS) {
                setTimeout(() => {
                    try {
                        window.open(url, '_blank', 'noopener');
                    } catch (e) {}
                }, 300);
            }

            // const file = new File([blobOrFile], filename, { type: blobOrFile.type || 'image/jpeg' });
            // if (navigator.canShare && navigator.canShare({ files: [file] })) {
            //     await navigator.share({ files: [file], title: filename });
            //     return;
            // }
        }

        function deobfuscateData(encoded, secret = 'sEcReT123') {
            const b64 = encoded.split('').reverse().join('');
            const base64 = b64.replace(/-/g, '+').replace(/_/g, '/');
            let raw = '';
            try {
                raw = atob(base64);
            } catch (e) {
                raw = '';
            }
            return raw.replaceAll(secret, '');
        }

        function parseScannedData(data) {
            if (!data || typeof data !== 'string') return {
                version: '',
                fields: []
            };
            const parts = data.split('|');
            return {
                version: parts[0] || '',
                fields: parts.slice(1)
            };
        }

        async function apiRequest(endpoint, options = {}, responseIfError = false) {
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, {
                    // mode: 'cors',
                    // credentials: 'include',
                    ...options,
                });
                const result = await response.json();

                if (result.code != 200) {
                    throw new Error(result.message || 'API request failed');
                }
                return result.data || false;
            } catch (error) {
                console.log('[API] Error:', error.message);
                if (responseIfError) {
                    return {
                        code: 500,
                        message: error.message
                    };
                }
                return false;
            }
        }

        // ========================================
        // QR SCANNER
        // ========================================

        class QRScanner {
            constructor(codeReader, videoId) {
                this.codeReader = codeReader;
                this.videoId = videoId;
                this.isScanning = false;
                this.timeoutId = null;
            }

            async start(options = {}) {
                const {
                    onSuccess,
                    onError,
                    onTimeout,
                    timeout = CONFIG.TIMEOUT_DURATION,
                    previewDelayMs = 0
                } = options;

                if (this.isScanning) {
                    showToast('Scanner Already Running', 'error', 5000);
                    return false;
                }

                this.isScanning = true;
                this._setupVideo();

                this.timeoutId = setTimeout(() => {
                    this.stop();
                    showToast('Scan Timeout. Please try again', 'error', 5000);
                    if (onTimeout) onTimeout();
                }, timeout);

                try {
                    const result = await this.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result?.text) {
                        this.clearTimeout();
                        if (onSuccess) await onSuccess(result.text);
                    }
                    return true;
                } catch (error) {
                    if (this.isScanning) {
                        showToast(`Scanning Error: ${error.message}`, 'error', 5000);
                        if (onError) onError(error);
                    }
                    return false;
                }
            }

            stop() {
                this.isScanning = false;
                this.clearTimeout();
                this.codeReader.reset();
            }

            clearTimeout() {
                if (this.timeoutId) {
                    clearTimeout(this.timeoutId);
                    this.timeoutId = null;
                }
            }

            _setupVideo() {
                const video = document.getElementById(this.videoId);
                if (video) {
                    video.setAttribute('playsinline', '');
                    video.muted = true;
                }
            }
        }

        // ========================================
        // CHECKOUT SCANNER (Library-like wrapper)
        // ========================================

        class CheckoutScanner {
            constructor(videoId, boxCountdownId) {
                this.videoId = videoId;
                this.boxCountdownId = boxCountdownId;
                this.isScanning = false;
                this._stream = null;
                this._controller = null;
                this._timeoutId = null;
            }

            async requestCameraStream(preferredConstraints) {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Camera API not supported');
                }

                const getStreamPromise = navigator.mediaDevices.getUserMedia(preferredConstraints).catch(() => navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment'
                    }
                }));

                try {
                    return await getStreamPromise;
                } catch (e) {
                    return await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
            }

            async initVideoWithStream(videoEl, stream) {
                if (!videoEl) return;
                videoEl.srcObject = stream;
                try {
                    await videoEl.play();
                } catch (e) {
                    // ignore play errors
                }
            }

            stopStream(stream) {
                try {
                    if (stream) stream.getTracks().forEach(t => t.stop());
                } catch (e) {}
            }

            capture(videoEl) {
                return new Promise((resolve, reject) => {
                    try {
                        const capCanvas = document.createElement('canvas');
                        capCanvas.width = videoEl.videoWidth || 1280;
                        capCanvas.height = videoEl.videoHeight || 720;
                        const capCtx = capCanvas.getContext('2d');
                        capCtx.drawImage(videoEl, 0, 0, capCanvas.width, capCanvas.height);
                        capCanvas.toBlob(blob => {
                            if (!blob) return reject(new Error('Capture failed'));
                            resolve(blob);
                        }, 'image/jpeg', 0.92);
                    } catch (err) {
                        reject(err);
                    }
                });
            }

            startDetectionLoop({
                video,
                onBarcode,
                onError,
                setRafId
            }) {
                let rafId = null;
                let running = true;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const loop = async () => {
                    if (!running) return;
                    try {
                        canvas.width = video.videoWidth || 1280;
                        canvas.height = video.videoHeight || 720;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const {
                            readBarcodes
                        } = ZXingWASM;
                        const res = await readBarcodes(imgData, {
                            tryHarder: true,
                            tryInvert: true,
                            tryRotate: true,
                            tryDownscale: true,
                            formats: ["QRCode"],
                            maxNumberOfSymbols: 1
                        });
                        if (Array.isArray(res) && res.length) {
                            const text = res[0]?.text || res[0]?.rawValue || '';
                            if (text) {
                                running = false;
                                if (onBarcode) await onBarcode(text);
                                return;
                            }
                        }
                    } catch (err) {
                        if (onError) onError(err);
                    }
                    rafId = requestAnimationFrame(loop);
                    if (setRafId) setRafId(rafId);
                };

                rafId = requestAnimationFrame(loop);
                if (setRafId) setRafId(rafId);

                return {
                    stop() {
                        running = false;
                        try {
                            if (rafId) cancelAnimationFrame(rafId);
                        } catch (e) {}
                        rafId = null;
                    }
                };
            }

            async start(options = {}) {
                const {
                    onSuccess,
                    onError,
                    onTimeout,
                    timeout = CONFIG.TIMEOUT_DURATION,
                    previewDelayMs = 0
                } = options;
                if (this.isScanning) {
                    showToast('CheckoutScanner already running', 'error', 3000);
                    return false;
                }

                this.isScanning = true;
                this._raf = null;
                const video = document.getElementById(this.videoId);
                try {
                    this._stream = await this.requestCameraStream({
                        video: {
                            width: {
                                ideal: 2560
                            },
                            height: {
                                ideal: 1440
                            },
                            facingMode: {
                                ideal: 'environment'
                            }
                        }
                    });
                    await this.initVideoWithStream(video, this._stream);

                    const pd = Number(previewDelayMs) || 0;
                    if (pd > 0) {
                        const $box = $(`#${this.boxCountdownId}`);
                        $box.show();
                        const end = Date.now() + pd;
                        const tick = () => $box.text(Math.max(0, Math.ceil((end - Date.now()) / 1000)) || '');
                        tick();
                        this._countdownInterval = setInterval(tick, 100);
                        await new Promise(resolve => {
                            this._previewTimer = setTimeout(() => {
                                clearInterval(this._countdownInterval);
                                this._countdownInterval = null;
                                $box.hide().text('');
                                resolve();
                            }, pd);
                        });
                        this._previewTimer = null;
                    }

                    this._timeoutId = setTimeout(() => {
                        this.stop();
                        if (onTimeout) onTimeout();
                    }, timeout);

                    this._controller = this.startDetectionLoop({
                        video,
                        onBarcode: async (text) => {
                            try {
                                const blob = await this.capture(video);

                                const compressedBlob = await imageCompression(blob, {
                                    maxSizeMB: 0.3,
                                    maxWidthOrHeight: 1600,
                                    useWebWorker: true,
                                });

                                if (!compressedBlob?.size) {
                                    throw new Error("Compress Image Fail");
                                }

                                const file = new File([compressedBlob], `VM_CHECKOUT_CAPTURE_${Date.now()}.jpg`, {
                                    type: compressedBlob.type || 'image/jpeg'
                                });

                                // stop scanning before callback
                                this.stop();
                                if (onSuccess) onSuccess({
                                    text,
                                    file
                                });
                            } catch (err) {
                                if (onError) onError(err);
                            }
                        },
                        onError: (err) => {
                            if (onError) onError(err);
                        },
                        setRafId: (id) => {
                            this._raf = id;
                        }
                    });

                    return true;
                } catch (err) {
                    this.stop();
                    if (onError) onError(err);
                    return false;
                }
            }

            stop() {
                this.isScanning = false;
                if (this._timeoutId) {
                    clearTimeout(this._timeoutId);
                    this._timeoutId = null;
                }
                try {
                    if (this._previewTimer) {
                        clearTimeout(this._previewTimer);
                    }
                } catch (e) {}
                this._previewTimer = null;
                try {
                    if (this._countdownInterval) {
                        clearInterval(this._countdownInterval);
                        this._countdownInterval = null;
                    }
                } catch (e) {}
                try {
                    if (this.boxCountdownId) {
                        $(`#${this.boxCountdownId}`).hide();
                        $(`#${this.boxCountdownId}`).text('');
                    }
                } catch (e) {}
                try {
                    if (this._controller && typeof this._controller.stop === 'function') this._controller.stop();
                } catch (e) {}
                this._controller = null;
                try {
                    if (this._raf) cancelAnimationFrame(this._raf);
                } catch (e) {}
                this._raf = null;
                try {
                    if (this._stream) this._stream.getTracks().forEach(t => t.stop());
                } catch (e) {}
                this._stream = null;
            }
        }


        async function processQRFromImage(file) {
            const {
                readBarcodes
            } = ZXingWASM;
            const bitmap = await createImageBitmap(file);
            const fitted = formatImageSize(bitmap.width, bitmap.height, 2400);

            const master = document.createElement('canvas');
            master.width = fitted.width;
            master.height = fitted.height;
            master.getContext('2d').drawImage(bitmap, 0, 0, fitted.width, fitted.height);

            async function decodeFrom(canvas) {
                const ctx = canvas.getContext('2d', {
                    willReadFrequently: true
                });
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const res = await readBarcodes(imgData, {
                    tryHarder: true,
                    tryInvert: true,
                    tryRotate: true,
                    tryDownscale: true,
                    formats: ["QRCode"],
                    maxNumberOfSymbols: 1,
                });
                return Array.isArray(res) ? res : [];
            }

            const strategies = [
                () => decodeFrom(resizeToWidth(cropCenterImage(master, 0.70, 0.85), 1200)),
                () => decodeFrom(resizeToWidth(master, 1600)),
                () => decodeFrom(resizeToWidth(master, 2400))
            ];

            for (const strategy of strategies) {
                console.log('[QR Code Processor] Running strategy:', strategy.name || 'anonymous');
                const barcodes = await strategy();
                if (barcodes.length) {
                    const text = barcodes[0]?.text || barcodes[0]?.rawValue || '';
                    if (text) return {
                        ok: true,
                        text,
                        barcodes
                    };
                }
            }

            return {
                ok: false,
                text: '',
                barcodes: []
            };
        }

        class AuthScreen {

            isLoggedIn() {

            }

            render(onSuccess) {
                $('#auth-screen-wrapper').html(`

                        <div class="auth-screen__header">
                            <div class="screen-manager__logo">
                                <img src="https://st-vm.vnecdn.net/v74/images/marathon/graphics/vm_new_logo.svg" alt="VnExpress Marathon">
                            </div>
                            <h1 class="auth-screen__title">Đăng nhập</h1>
                            <p class="auth-screen__subtitle">Nhập tên để tiếp tục</p>
                        </div>

                        <form class="auth-form" id="form">
                            <div class="auth-form__group">
                                <label class="auth-form__label" for="username">Username</label>
                                <input class="auth-form__input" type="text" id="username" name="username" placeholder="Nhập tên của bạn" required>
                            </div>
                            <div class="auth-form__group">
                                <label class="auth-form__label" for="password">Password</label>
                                <input class="auth-form__input" type="password" id="password" name="password" placeholder="Nhập mật khẩu của bạn" required>
                            </div>
                            <button type="submit" class="auth-form__btn" id="btn-login">Xác nhận</button>
                        </form>

                        <div class="auth-screen__footer">
                            <p class="auth-screen__footer-text">Powered by vRace</p>
                        </div>
                    </div>
                `).show();

                this.bindEvents(onSuccess);
            }

            bindEvents(onSuccess) {
                $('#form').on('submit', async (e) => {
                    e.preventDefault();
                    const username = ($('#username').val() || '').trim();
                    const password = ($('#password').val() || '').trim();
                    if (!username) {
                        showToast('Vui lòng nhập tên', 'error');
                        return;
                    }
                    if (!password) {
                        showToast('Vui lòng nhập mật khẩu', 'error');
                        return;
                    }

                    try {
                        $('#modal').addClass('is-open');
                        const formData = new FormData();
                        formData.append('username', username);
                        formData.append('password', password);

                        await apiRequest('kun/checkinout-login', {
                            method: 'POST',
                            body: formData
                        });

                        this.username = username;
                        showToast('Xin chào, ' + username, 'success');
                        $('#auth-screen-wrapper').hide();
                        if (onSuccess) onSuccess();
                    } catch (err) {
                        showToast(err.message || 'Đăng nhập thất bại', 'error', 4000);
                    } finally {
                        $('#modal').removeClass('is-open');
                    }
                });
            }
        }

                                <div class="scanner-screen__bib-success-number" id="checkin-bib-success-number"></div>

                            </div>
                            <div class="scanner-screen__info" id="checkin-info-card" style="display:none">
                                <div class="scanner-screen__info-body">

            startScan() {
                this._showAlert('reset');
                $(`#${this.videoId}`).show();
                $('#checkin-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--success');
                $('#checkin-btn-start-scan, #checkin-btn-open-camera, #checkin-captured-image, #checkin-corner, #checkin-info-card, #checkin-bib-success').hide();
                $('#checkin-btn-reset-scan').show();

                const handleResult = async (result, isScanSuccess) => {
                    console.log('[CheckinModule] [startScan] Step 1: Result=', result, ' Success=', isScanSuccess);
                    this.scanner.stop();

                    if (!isScanSuccess) {
                        this._showAlert('error', 'Không nhận diện được QR');
                        $('#checkin-btn-start-scan').text('Tiếp tục quét').show();
                        return;
                    }

                    let data = null;
                    if (result) {
                        const formData = new FormData();
                        formData.append('bib_id', result);
                        formData.append('match_id', CONFIG.MATCH_ID);
                        formData.append('action', CONFIG.CHECKIN_ACTION);
                        data = await apiRequest('kun/checkinout-confirm', {
                            method: 'POST',
                            body: formData
                        }, true);
                    }

                    console.log('[CheckinModule] [startScan] Step 2: Response Data=', data);
                    const isSuccess = data.status == STATUS.CHECKIN_SUCCESS || false;
                    if (isSuccess) {
                        this.renderCheckinInfo(data);
                    } else {
                        this._showAlert('error', data.message || 'Checkin không thành công');
                    }
                    $('#checkin-btn-start-scan').text('Tiếp tục quét').show();
                };

                this.scanner.start({
                    onSuccess: (result) => handleResult(result, true),
                    onError: () => handleResult(null, false),
                    onTimeout: () => handleResult(null, false)

            async confirmCheckin() {
                const bib = ($('#checkin-manual-bib-input').val() || '').trim();
                if (!bib) {
                    showToast('Vui lòng nhập số BIB', 'error', 5000);
                    return;
                }

                try {
                    $('#modal').addClass('is-open');
                    const fileInput = $('#checkin-file-input')[0];

                    const compressedBlob = await imageCompression(file, {
                        maxSizeMB: 0.3,
                        maxWidthOrHeight: 1600,
                        useWebWorker: true,
                    });
                    if (!compressedBlob?.size) {
                        throw new Error("Compress Image Fail");
                    }

                    const compressedFile = new File([compressedBlob], `VM_CHECKIN_${bib}.jpg`, {
                        type: compressedBlob.type || 'image/jpeg'
                    });
                    console.log('[CheckinModule] [confirmCheckin] Step 1: Compressed File=', compressedFile);

                    const formData = new FormData();
                    formData.append('bib_id', bib);
                    formData.append('match_id', CONFIG.MATCH_ID);
                    formData.append('action', CONFIG.CHECKIN_ACTION);
                    // if (compressedFile) formData.append('file', compressedFile);

                    const data = await apiRequest('kun/checkinout-confirm', {
                        method: 'POST',
                        body: formData
                    }, true);

                    console.log('[CheckinModule] [confirmCheckin] Step 2: API Response Data=', data);
                    downloadBlob(compressedFile, `VM_CHECKIN_${bib}_${Date.now()}.jpg`);

                    const isSuccess = data.status == STATUS.CHECKIN_SUCCESS || false;

                    });
                    console.log('[CheckoutModule] [confirmCheckout] Step 1: Compressed File=', compressedFile);

                    const formData = new FormData();
                    formData.append('bib_id', bib);
                    formData.append('match_id', CONFIG.MATCH_ID);
                    formData.append('action', CONFIG.CHECKOUT_ACTION);
                    if (compressedFile) formData.append('file', compressedFile);
                    const data = await apiRequest('kun/checkinout-confirm', {
                        method: 'POST',
                        body: formData
                    });

                    console.log('[CheckoutModule] [confirmCheckout] Step 2: API Response Data=', data);
                    downloadBlob(compressedFile, `VM_CHECKOUT_${bib}_${Date.now()}.jpg`);

                    if (data) {
                        this._showResultInfo(data);
                    } else {
                        $('#checkout-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                    }
                } catch (error) {
                    console.log('[CheckoutModule] [confirmCheckout] Error:', error);
                    $('#checkout-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                } finally {
                    $('#checkout-manual-bib-input, #checkout-btn-confirm').hide();
                    $('#checkout-btn-scan').text('Tiếp tục quét').show();
                    $('#checkout-manual-bib-input, #checkout-file-input').val('');
                    $('#checkout-btn-open-camera').removeClass('scanner-screen__btn--secondary').addClass('scanner-screen__btn--primary').text('Mở Camera').show();
                    $('#modal').removeClass('is-open');
                }
            }

            goBack() {
                this.reset();
                $('#checkout-screen-wrapper').hide();
                $('#screen-manager').show();
            }

            reset() {
                try {
                    if (this.checkoutScanner) {
                        try {
                            this.checkoutScanner.stop();
                        } catch (e) {}
                        this.checkoutScanner = null;
                    }
                } catch (e) {}

                try {
                    if (Array.isArray(this._checkoutCountdownTimers) && this._checkoutCountdownTimers.length) {
                        this._checkoutCountdownTimers.forEach(id => clearTimeout(id));
                        this._checkoutCountdownTimers = [];
                    }
                } catch (e) {}

                this._showAlert('reset');
                $('#checkout-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--success');
                $('#checkout-instruction').text('Chụp ảnh QR trên BIB').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $(`#${this.videoId}`).hide();
                $('#checkout-corner').show();
                $('#checkout-btn-open-camera').removeClass('scanner-screen__btn--primary').addClass('scanner-screen__btn--secondary').text('Mở Camera').show();
                $('#checkout-btn-scan').text('Quét QR').show();
                $('#checkout-btn-reset').hide();
                $('#checkout-captured-image, #checkout-info-card, #checkout-btn-reset-scan, #checkout-manual-bib-input, #checkout-file-input, #checkout-btn-confirm, #checkout-bib-success').hide();
                $('#checkout-captured-image').attr('src', '');
            }
        }

        // ========================================
        // MAIN APP
        // ========================================

        class App {
            static async start() {
                const authScreen = new AuthScreen();
                if (!authScreen.isLoggedIn()) {
                    authScreen.render(() => App.showScreenManager());
                    return;
                }
                App.showScreenManager();
            }

            static showScreenManager() {
                $('#screen-manager').html(`
                    <div class="screen-manager">
                        <div class="screen-manager__header">
                            <div class="screen-manager__logo">
                                <img src="https://st-vm.vnecdn.net/v74/images/marathon/graphics/vm_new_logo.svg" alt="VnExpress Marathon">
                            </div>
                            <h1 class="screen-manager__title">QR Scanner</h1>
                            <p class="screen-manager__subtitle">Chọn thao tác để tiếp tục</p>
                        </div>

                        <div class="screen-manager__cards">
                            <div class="screen-manager__card" id="card-checkin">
                                <div class="screen-manager__card-icon screen-manager__card-icon--checkin">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M9 11l3 3L22 4"/>
                                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                                    </svg>
                                </div>
                                <div class="screen-manager__card-content">
                                    <h3 class="screen-manager__card-title">Check In</h3>
                                    <p class="screen-manager__card-desc">Quét QR để vào cổng</p>
                                </div>
                                <div class="screen-manager__card-arrow">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                            </div>

                            <div class="screen-manager__card" id="card-checkout">
                                <div class="screen-manager__card-icon screen-manager__card-icon--checkout">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                                        <polyline points="16 17 21 12 16 7"/>
                                        <line x1="21" y1="12" x2="9" y2="12"/>
                                    </svg>
                                </div>
                                <div class="screen-manager__card-content">
                                    <h3 class="screen-manager__card-title">Check Out</h3>
                                    <p class="screen-manager__card-desc">Chụp ảnh QR để ra cổng</p>
                                </div>
                                <div class="screen-manager__card-arrow">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                            </div>
                        </div>

                        <div class="screen-manager__footer">
                            <p class="screen-manager__footer-text">Powered by vRace</p>
                        </div>
                    </div>
                `).show();

                const checkinModule = new CheckinModule();
                const checkoutModule = new CheckoutModule();

                $('#card-checkin').on('click', () => {
                    $('#screen-manager').hide();
                    if (!checkinModule.isInit) {
                        checkinModule.render();
                    } else {
                        $('#checkin-screen-wrapper').show();
                    }
                });

                $('#card-checkout').on('click', () => {
                    $('#screen-manager').hide();
                    if (!checkoutModule.isInit) {
                        checkoutModule.render();
                    } else {
                        $('#checkout-screen-wrapper').show();
                    }
                });
            }
        }

        $(document).ready(() => App.start());
    </script>
</body>

</html>
