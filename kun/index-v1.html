        // ========================================

        const CONFIG = {

        // ========================================
        // UTILITIES
        // ========================================
        function setCookie(name, value, days = 1) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(?:^|; )' + encodeURIComponent(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
            return match ? decodeURIComponent(match[1]) : null;
        }

        function showToast(message, type = 'info', duration = 3000) {
            const styles = {
                info: 'linear-gradient(to right, #00b09b, #96c93d)',
                error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                success: 'linear-gradient(to right, #56ab2f, #a8e063)'
            };

            Toastify({
                text: message,
                duration,
                close: true,
                gravity: 'top',
                position: 'center',
                style: {
                    background: styles[type] || styles.info
                }
            }).showToast();
        }

        function formatImageSize(width, height, maxEdge) {
            const longEdge = Math.max(width, height);
            if (longEdge <= maxEdge) return {
                width,
                height
            };
            const scale = maxEdge / longEdge;
            return {
                width: Math.round(width * scale),
                height: Math.round(height * scale)
            };
        }

        function cropCenterImage(sourceCanvas, widthPercent, heightPercent) {
            const sw = sourceCanvas.width,
                sh = sourceCanvas.height;
            const rw = Math.max(1, Math.round(sw * widthPercent));
            const rh = Math.max(1, Math.round(sh * heightPercent));
            const rx = Math.round((sw - rw) / 2);
            const ry = Math.round((sh - rh) / 2);

            const canvas = document.createElement('canvas');
            canvas.width = rw;
            canvas.height = rh;
            canvas.getContext('2d').drawImage(sourceCanvas, rx, ry, rw, rh, 0, 0, rw, rh);
            return canvas;
        }

        function resizeToWidth(sourceCanvas, targetWidth) {
            if (sourceCanvas.width <= targetWidth) return sourceCanvas;
            const scale = targetWidth / sourceCanvas.width;
            const th = Math.max(1, Math.round(sourceCanvas.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = th;
            canvas.getContext('2d').drawImage(sourceCanvas, 0, 0, targetWidth, th);
            return canvas;
        }

        async function downloadBlob(blobOrFile, filename) {
            const url = URL.createObjectURL(blobOrFile);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            if (isIOS) {
                setTimeout(() => {
                    try {
                        window.open(url, '_blank', 'noopener');
                    } catch (e) { }
                }, 300);
            }

            // const file = new File([blobOrFile], filename, { type: blobOrFile.type || 'image/jpeg' });
            // if (navigator.canShare && navigator.canShare({ files: [file] })) {
            //     await navigator.share({ files: [file], title: filename });
            //     return;
            // }
        }

        function deobfuscateData(encoded, secret = 'sEcReT123') {
            const b64 = encoded.split('').reverse().join('');
            const base64 = b64.replace(/-/g, '+').replace(/_/g, '/');
            let raw = '';
            try {
                raw = atob(base64);
            } catch (e) {
                raw = '';
            }
            return raw.replaceAll(secret, '');
        }

        function parseScannedData(data) {
            if (!data || typeof data !== 'string') return {
                version: '',
                fields: []
            };
            const parts = data.split('|');
            return {
                version: parts[0] || '',
                fields: parts.slice(1)
            };
        }

        async function apiRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, {
                    mode: 'cors',
                    // credentials: 'include',
                    ...options,
                });
                const result = await response.json();

                if (result.code != 200) {
                    throw new Error(result.message || 'API request failed');
                }
                return result.data || false;
            } catch (error) {
                console.log('[API] Error:', error.message);
                return false;
            }
        }

        // ========================================
        // QR SCANNER
        // ========================================

        class QRScanner {
            constructor(codeReader, videoId) {
                this.codeReader = codeReader;
                this.videoId = videoId;
                this.isScanning = false;
                this.timeoutId = null;
            }

            async start(options = {}) {
                const {
                    onSuccess,
                    onError,
                    onTimeout,
                    timeout = CONFIG.TIMEOUT_DURATION
                } = options;

                if (this.isScanning) {
                    showToast('Scanner Already Running', 'error', 5000);
                    return false;
                }

                this.isScanning = true;
                this._setupVideo();

                this.timeoutId = setTimeout(() => {
                    this.stop();
                    showToast('Scan Timeout. Please try again', 'error', 5000);
                    if (onTimeout) onTimeout();
                }, timeout);

                try {
                    const result = await this.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result?.text) {
                        this.clearTimeout();
                        if (onSuccess) await onSuccess(result.text);
                    }
                    return true;
                } catch (error) {
                    if (this.isScanning) {
                        showToast(`Scanning Error: ${error.message}`, 'error', 5000);
                        if (onError) onError(error);
                    }
                    return false;
                }
            }

            stop() {
                this.isScanning = false;
                this.clearTimeout();
                this.codeReader.reset();
            }

            clearTimeout() {
                if (this.timeoutId) {
                    clearTimeout(this.timeoutId);
                    this.timeoutId = null;
                }
            }

            _setupVideo() {
                const video = document.getElementById(this.videoId);
                if (video) {
                    video.setAttribute('playsinline', '');
                    video.muted = true;
                }
            }
        }

        // ========================================
        // QR CODE PROCESSOR (For Image Processing)
        // ========================================

        async function processQRFromImage(file) {
            const {
                readBarcodes
            } = ZXingWASM;
            const bitmap = await createImageBitmap(file);
            const fitted = formatImageSize(bitmap.width, bitmap.height, 2400);

            const master = document.createElement('canvas');
            master.width = fitted.width;
            master.height = fitted.height;
            master.getContext('2d').drawImage(bitmap, 0, 0, fitted.width, fitted.height);

            async function decodeFrom(canvas) {
                const ctx = canvas.getContext('2d', {
                    willReadFrequently: true
                });
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const res = await readBarcodes(imgData, {
                    tryHarder: true,
                    tryInvert: true,
                    tryRotate: true,
                    tryDownscale: true,
                    formats: ["QRCode"],
                    maxNumberOfSymbols: 1,
                });
                return Array.isArray(res) ? res : [];
            }

            const strategies = [
                () => decodeFrom(resizeToWidth(cropCenterImage(master, 0.70, 0.85), 1200)),
                () => decodeFrom(resizeToWidth(master, 1600)),
                () => decodeFrom(resizeToWidth(master, 2400))
            ];

            for (const strategy of strategies) {
                console.log('[QR Code Processor] Running strategy:', strategy.name || 'anonymous');
                const barcodes = await strategy();
                if (barcodes.length) {
                    const text = barcodes[0]?.text || barcodes[0]?.rawValue || '';
                    if (text) return {
                        ok: true,
                        text,
                        barcodes
                    };
                }
            }

            return {
                ok: false,
                text: '',
                barcodes: []
            };
        }

        class AuthScreen {
            constructor() {
                this.username = getCookie('username');
            }

            isLoggedIn() {
                return !!this.username;
            }

            render(onSuccess) {
                $('#auth-screen-wrapper').html(`

                        <div class="auth-screen__header">
                            <div class="screen-manager__logo">
                                <img src="https://st-vm.vnecdn.net/v74/images/marathon/graphics/vm_new_logo.svg" alt="VnExpress Marathon">

                            <p class="auth-screen__subtitle">Nhập tên để tiếp tục</p>
                        </div>

                        <form class="auth-form" id="form">
                            <div class="auth-form__group">
                                <label class="auth-form__label" for="username">Username</label>
                                <input class="auth-form__input" type="text" id="username" name="username" placeholder="Nhập tên của bạn" required>
                            </div>
                            <div class="auth-form__group">
                                <label class="auth-form__label" for="password">Password</label>
                                <input class="auth-form__input" type="password" id="password" name="password" placeholder="Nhập mật khẩu của bạn" required>
                            </div>
                            <button type="submit" class="auth-form__btn" id="btn-login">Xác nhận</button>
                        </form>

                        <div class="auth-screen__footer">
                            <p class="auth-screen__footer-text">Powered by vRace</p>
                        </div>
                    </div>
                `).show();

                this.bindEvents(onSuccess);
            }

            bindEvents(onSuccess) {
                $('#form').on('submit', async (e) => {
                    e.preventDefault();
                    const username = ($('#username').val() || '').trim();
                    const password = ($('#password').val() || '').trim();
                    if (!username) {
                        showToast('Vui lòng nhập tên', 'error');
                        return;
                    }
                    if (!password) {
                        showToast('Vui lòng nhập mật khẩu', 'error');
                        return;
                    }

                    try {
                        $('#modal').addClass('is-open');
                        const formData = new FormData();
                        formData.append('username', username);
                        formData.append('password', password);

                        await apiRequest('kun/checkinout-login', {
                            method: 'POST',
                            body: formData
                        });

                        this.username = username;
                        showToast('Xin chào, ' + username, 'success');
                        $('#auth-screen-wrapper').hide();
                        if (onSuccess) onSuccess();
                    } catch (err) {
                        showToast(err.message || 'Đăng nhập thất bại', 'error', 4000);
                    } finally {
                        $('#modal').removeClass('is-open');
                    }
                });
            }
        }

        // ========================================
        // CHECKIN MODULE
        // ========================================

        class CheckinModule {
            constructor() {
                this.isInit = false;
                this.videoId = 'checkin-video';
                this.scanner = null;
            }

            renderCheckinInfo(data) {
                $(`#${this.videoId}`).hide();
                $('#checkin-bib-success').show();
                $('#checkin-bib-success-number').text(data.bib || '—');
                $('#checkin-bib-success-label').text(data.name || '—');
                $('#checkin-info-children-info').text(data.info || '—');
                $('#checkin-info-parent-name').text(data.parent_name || '—');
                $('#checkin-info-phone').text(data.parent_phone || '—');
                const isSuccess = data.status === STATUS.CHECKIN_SUCCESS;
                const statusText = isSuccess ? 'Thành công' : 'Thất bại';
                const statusClass = isSuccess ? 'scanner-screen__info-status--success' : 'scanner-screen__info-status--error';
                $('#checkin-scanner-frame').addClass(isSuccess ? 'scanner-screen__frame--success' : 'scanner-screen__frame--active');
                $('#checkin-info-status').html(`<span class="scanner-screen__info-status ${statusClass}">${statusText}</span>`);
                if (data?.history) {
                    const historyText = data.history.map(item => {
                        const time = moment.unix(item).format('HH:mm:ss');
                        return `Check-in: ${time}`;
                    }).join('<br>');
                    $('#checkin-info-history').html(historyText);
                }
                $('#checkin-info-card').show();
            }

            render() {
                $('#checkin-screen-wrapper').html(`
                    <div class="scanner-screen">
                        <div class="scanner-screen__header">
                            <button class="scanner-screen__back" id="checkin-btn-back">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            </button>
                            <h2 class="scanner-screen__title">Check In</h2>
                        </div>

                        <div class="scanner-screen__frame" id="checkin-scanner-frame">
                            <video id="${this.videoId}" width="100%" height="100%"></video>
                            <img id="checkin-captured-image" src="" alt="Captured" width="100%" height="100%" style="object-fit:contain;display:none;" />
                            <div id="checkin-corner">
                                <div class="scanner-screen__corner scanner-screen__corner--tl"></div>
                                <div class="scanner-screen__corner scanner-screen__corner--tr"></div>
                                <div class="scanner-screen__corner scanner-screen__corner--bl"></div>
                                <div class="scanner-screen__corner scanner-screen__corner--br"></div>
                            </div>
                            <div class="scanner-screen__bib-success" id="checkin-bib-success" style="display:none">
                                <div class="scanner-screen__bib-success-number" id="checkin-bib-success-number"></div>
                                <div class="scanner-screen__bib-success-label" id="checkin-bib-success-label"></div>
                            </div>
                            <div class="scanner-screen__info" id="checkin-info-card" style="display:none">
                                <div class="scanner-screen__info-body">                                    
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Trạng thái</span><span class="scanner-screen__info-value" id="checkin-info-status">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Bé</span><span class="scanner-screen__info-value" id="checkin-info-children-info">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Người thân</span><span class="scanner-screen__info-value" id="checkin-info-parent-name">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">SĐT</span><span class="scanner-screen__info-value" id="checkin-info-phone">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Lịch sử</span><span class="scanner-screen__info-value" id="checkin-info-history">—</span></div>                                    
                                </div>
                            </div>
                        </div>
                        <div class="scanner-screen__content">
                            <p class="scanner-screen__instruction" id="checkin-instruction">Đặt mã QR vào khung để quét</p>                            
                            <input class="scanner-screen__bib-input" id="checkin-manual-bib-input" type="number" min="0" max="999999" inputmode="numeric" placeholder="Nhập số BIB" style="display:none" />
                        </div>

                        <div class="scanner-screen__footer">
                            <div class="scanner-screen__actions" id="checkin-actions-group">
                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkin-btn-reset-scan" style="display:none">Reset</button>
                                <button class="scanner-screen__btn scanner-screen__btn--primary" id="checkin-btn-confirm" style="display:none">Xác nhận</button>
                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkin-btn-open-camera">Không có QR ? (Mở Camera)</button>
                                <button class="scanner-screen__btn scanner-screen__btn--primary" id="checkin-btn-start-scan">Quét QR</button>
                            </div>
                        </div>

                        <input type="file" id="checkin-file-input" accept="image/*" capture="environment" style="display:none" />
                    </div>
                `).show();

                this.isInit = true;
                this.scanner = new QRScanner(new ZXing.BrowserQRCodeReader(), this.videoId);
                this.handleEvents();
            }

            handleEvents() {
                $('#checkin-btn-start-scan').on('click', () => this.startScan());
                $('#checkin-btn-open-camera').on('click', () => this.openCamera());
                $('#checkin-btn-confirm').on('click', () => this.confirmCheckin());
                $('#checkin-btn-back').on('click', () => this.goBack());
                $('#checkin-btn-reset-scan').on('click', () => this.reset());
            }

            startScan() {
                $(`#${this.videoId}`).show();
                $('#checkin-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--success');
                $('#checkin-btn-start-scan, #checkin-btn-open-camera, #checkin-captured-image, #checkin-corner, #checkin-info-card, #checkin-bib-success').hide();
                $('#checkin-btn-reset-scan').show();
                $('#checkin-instruction').text('Đang quét...').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');

                const handleResult = async (result, isSuccess) => {
                    console.log('[CheckinModule] [startScan] Step 1: Result=', result, ' Success=', isSuccess);
                    this.scanner.stop();

                    // const result = parseScannedData(deobfuscateData(result));
                    // console.log('[CheckinModule] [startScan] Step 2: Parsed Result=', result);

                    let data = null;
                    if (result) {
                        const formData = new FormData();
                        formData.append('bib_id', result);
                        formData.append('match_id', CONFIG.MATCH_ID);
                        formData.append('action', CONFIG.CHECKIN_ACTION);
                        data = await apiRequest('c7ddfbbd-cdb9-4bf5-b9b4-c907dc433252', {
                            method: 'POST',
                            body: formData
                        });
                    }

                    console.log('[CheckinModule] [startScan] Step 3: Response Data=', data);
                    if (isSuccess && data) {
                        $('#checkin-instruction').hide();
                        this.renderCheckinInfo(data);
                    } else {
                        $('#checkin-instruction').text('Quét thất bại. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                    }

                    $('#checkin-btn-start-scan').text('Tiếp tục quét').show();
                };

                this.scanner.start({
                    onSuccess: (result) => handleResult(result, true),
                    onError: () => handleResult(null, false),
                    onTimeout: () => handleResult(null, false)
                });
            }

            openCamera() {
                $('#checkin-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--success');
                $('#checkin-btn-start-scan, #checkin-btn-open-camera, #checkin-captured-image, #checkin-corner, #checkin-info-card, #checkin-bib-success').hide();
                $('#checkin-btn-reset-scan').show();
                $('#checkin-instruction').text('Chụp ảnh BIB, sau đó nhập số BIB để Xác nhận').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');

                const handleResult = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    const url = URL.createObjectURL(file);
                    $('#checkin-scanner-frame').addClass('scanner-screen__frame--has-image');
                    $('#checkin-captured-image').attr('src', url).show();
                    $('#checkin-instruction').text('Nhập số BIB, sau đó nhấn Xác nhận').addClass('scanner-screen__instruction--success').removeClass('scanner-screen__instruction--error');
                    $('#checkin-manual-bib-input').show().trigger('focus');
                    $('#checkin-btn-confirm').show();
                };

                $('#checkin-file-input').off('change').on('change', handleResult).trigger('click');
            }

            async confirmCheckin() {
                const bib = ($('#checkin-manual-bib-input').val() || '').trim();
                if (!bib) {
                    showToast('Vui lòng nhập số BIB', 'error', 5000);
                    return;
                }

                try {
                    $('#modal').addClass('is-open');
                    const fileInput = $('#checkin-file-input')[0];
                    const file = fileInput?.files?.[0] || null;

                    const compressedBlob = await imageCompression(file, {
                        maxSizeMB: 0.3,
                        maxWidthOrHeight: 1600,
                        useWebWorker: true,
                    });
                    if (!compressedBlob?.size) {
                        throw new Error("Compress Image Fail");
                    }

                    const compressedFile = new File([compressedBlob], `VM_CHECKIN_${bib}.jpg`, {
                        type: compressedBlob.type || 'image/jpeg'
                    });
                    console.log('[CheckinModule] [confirmCheckin] Step 1: Compressed File=', compressedFile);

                    const formData = new FormData();
                    formData.append('bib_id', bib);
                    formData.append('match_id', CONFIG.MATCH_ID);
                    formData.append('action', CONFIG.CHECKIN_ACTION);
                    // if (compressedFile) formData.append('file', compressedFile);

                    const data = await apiRequest('c7ddfbbd-cdb9-4bf5-b9b4-c907dc433252', {
                        method: 'POST',
                        body: formData
                    });

                    console.log('[CheckinModule] [confirmCheckin] Step 2: API Response Data=', data);
                    downloadBlob(compressedFile, `VM_CHECKIN_${bib}_${Date.now()}.jpg`);

                    if (data) {
                        $('#checkin-instruction').hide();
                        this.renderCheckinInfo(data);
                    } else {
                        $('#checkin-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                    }
                } catch (error) {
                    console.log('[CheckinModule] [confirmCheckin] Error:', error);
                    $('#checkin-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                } finally {
                    $('#checkin-manual-bib-input, #checkin-btn-confirm').hide();
                    $('#checkin-btn-open-camera').removeClass('scanner-screen__btn--secondary').addClass('scanner-screen__btn--primary').text('Mở Camera').show();
                    $('#checkin-manual-bib-input, #checkin-file-input').val('');
                    $('#modal').removeClass('is-open');
                }
            }

            reset() {
                this.scanner.stop();
                $('#checkin-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--active scanner-screen__frame--success');
                $('#checkin-instruction').text('Đặt mã QR vào khung để quét').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $('#checkin-btn-open-camera').removeClass('scanner-screen__btn--primary').addClass('scanner-screen__btn--secondary').text('Không có QR ? (Mở Camera)').show();
                $('#checkin-btn-start-scan').text('Quét QR').show();
                $(`#${this.videoId}, #checkin-corner`).show();
                $('#checkin-captured-image, #checkin-info-card, #checkin-btn-reset-scan, #checkin-manual-bib-input, #checkin-file-input, #checkin-btn-confirm, #checkin-bib-success').hide();
                $('#checkin-captured-image').attr('src', '');
            }

            goBack() {
                this.reset();
                $('#checkin-screen-wrapper').hide();
                $('#screen-manager').show();
            }
        }

        // ========================================
        // CHECKOUT MODULE
        // ========================================

        class CheckoutModule {
            constructor() {
                this.isInit = false;
                this.videoId = 'checkout-video';
            }

            render() {
                $('#checkout-screen-wrapper').html(`
                    <div class="scanner-screen">

                                <div class="scanner-screen__bib-success-number" id="checkout-bib-success-number"></div>
                                <div class="scanner-screen__bib-success-label" id="checkout-bib-success-label"></div>
                            </div>
                            <div class="scanner-screen__info" id="checkout-info-card" style="display:none">
                                <div class="scanner-screen__info-body">
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Trạng thái</span><span class="scanner-screen__info-value" id="checkout-info-status">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Bé</span><span class="scanner-screen__info-value" id="checkout-info-children-info">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Người thân</span><span class="scanner-screen__info-value" id="checkout-info-parent-name">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">SĐT</span><span class="scanner-screen__info-value" id="checkout-info-phone">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Lịch sử</span><span class="scanner-screen__info-value" id="checkout-info-history">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Thông báo</span><span class="scanner-screen__info-value" id="checkout-info-message">—</span></div>
                                </div>
                            </div>                            
                        </div>                        
                        <div class="scanner-screen__content"> 
                            <input class="scanner-screen__bib-input" id="checkout-manual-bib-input" type="number" min="0" max="999999" inputmode="numeric" placeholder="Nhập số BIB" style="display:none" />
                            <p class="scanner-screen__instruction" id="checkout-instruction">Nhấn "Mở Camera" để chụp ảnh BIB, sau đó nhập số BIB để Xác nhận</p>                           
                        </div>

                        <div class="scanner-screen__footer">
                            <div class="scanner-screen__actions" id="checkout-actions-group">
                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkout-btn-reset" style="display:none">Reset</button>
                                <button class="scanner-screen__btn scanner-screen__btn--primary" id="checkout-btn-confirm" style="display:none">Xác nhận</button>
                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkout-btn-open-camera">Mở camera</button>
                                <button class="scanner-screen__btn scanner-screen__btn--primary" id="checkout-btn-scan">Quét QR</button>

                        <input type="file" id="checkout-file-input" accept="image/*" capture="environment" style="display:none" />
                    </div>
                `).show();

                this.isInit = true;
                this.handleEvents();
            }

            handleEvents() {
                $('#checkout-btn-scan').on('click', () => this.startCameraScan());
                $('#checkout-btn-open-camera').on('click', () => this.openCamera());
                $('#checkout-btn-confirm').on('click', () => this.confirmCheckout());
                $('#checkout-btn-back').on('click', () => this.goBack());
                $('#checkout-btn-reset').on('click', () => this.reset());
            }

            async startCameraScan() {
                $(`#${this.videoId}`).show();
                $('#checkout-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--success');
                $('#checkout-btn-scan, #checkout-btn-open-camera, #checkout-captured-image, #checkout-corner, #checkout-info-card, #checkout-bib-success').hide();
                $('#checkout-btn-reset').show();
                $('#checkout-instruction').text('Chuẩn bị quét...').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');

                const video = document.getElementById(this.videoId);
                const canvas = document.createElement('canvas');
                let stream = null;

                const stopStream = () => {
                    try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch (e) { }
                    stream = null;
                };

                try {
                    const constraints = { video: { width: { ideal: 2560 }, height: { ideal: 1440 }, facingMode: { ideal: 'environment' } } };
                    const getStreamPromise = navigator.mediaDevices.getUserMedia(constraints).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }));

                    try {
                        stream = await getStreamPromise;
                    } catch (e) {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    }

                    video.srcObject = stream;
                    await video.play();

                    const ctx = canvas.getContext('2d');
                    let rafId = null;

                    const loop = async () => {
                        try {
                            canvas.width = video.videoWidth || 1280;
                            canvas.height = video.videoHeight || 720;
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const { readBarcodes } = ZXingWASM;
                            const res = await readBarcodes(imgData, { tryHarder: true, tryInvert: true, tryRotate: true, tryDownscale: true, formats: ["QRCode"], maxNumberOfSymbols: 1 });
                            if (Array.isArray(res) && res.length) {
                                const text = res[0]?.text || res[0]?.rawValue || '';
                                if (text) {
                                    // capture high-res still from current video frame
                                    const capCanvas = document.createElement('canvas');
                                    capCanvas.width = video.videoWidth || canvas.width;
                                    capCanvas.height = video.videoHeight || canvas.height;
                                    const capCtx = capCanvas.getContext('2d');
                                    capCtx.drawImage(video, 0, 0, capCanvas.width, capCanvas.height);

                                    const blob = await new Promise(resolve => capCanvas.toBlob(resolve, 'image/jpeg', 0.92));
                                    const file = new File([blob], `VM_CHECKOUT_CAPTURE_${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
                                    try {
                                        const fileInputEl = document.getElementById('checkout-file-input');
                                        if (fileInputEl && window.DataTransfer) {
                                            const dt = new DataTransfer();
                                            dt.items.add(file);
                                            fileInputEl.files = dt.files;
                                        }
                                    } catch (e) { }

                                    stopStream();
                                    if (rafId) cancelAnimationFrame(rafId);

                                    // show captured preview
                                    const url = URL.createObjectURL(file);
                                    $('#checkout-scanner-frame').addClass('scanner-screen__frame--has-image');
                                    $('#checkout-captured-image').attr('src', url).show();
                                    $('#checkout-manual-bib-input').val(text).show();
                                    $('#checkout-btn-confirm').show();
                                    const localData = { bib: text, name: '—', parent_name: '—', parent_phone: '—', info: '-', history: [], status: null, message: '-' };
                                    this._showResultInfo(localData);
                                    return;
                                }
                            }
                        } catch (err) {
                            console.log('[CheckoutModule] [startCameraScan] loop error', err);
                        }
                        rafId = requestAnimationFrame(loop);
                    };

                    // visible countdown: 2 -> 1 -> start
                    try {
                        for (let i = 2; i > 0; i--) {
                            $('#checkout-instruction').text(`Bắt đầu quét: ${i}`);
                            // wait 1 second
                            // eslint-disable-next-line no-await-in-loop
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        }
                        $('#checkout-instruction').text('Đang quét...');
                    } catch (e) { }
                    loop();
                } catch (error) {
                    console.log('[CheckoutModule] [startCameraScan] Error:', error);
                    stopStream();
                    $('#checkout-instruction').text('Không thể mở camera. Vui lòng thử lại hoặc nhập thủ công').addClass('scanner-screen__instruction--error');
                    this._showManualInput();
                }
            }

            openCamera() {
                $('#checkout-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--success');
                $('#checkout-btn-scan, #checkout-btn-open-camera, #checkout-captured-image, #checkout-corner, #checkout-info-card, #checkout-bib-success').hide();
                $('#checkout-btn-reset').show();
                $('#checkout-instruction').text('Chụp ảnh BIB chứa QR').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');

                const handleResult = async (event) => {
                    try {
                        $('#modal').addClass('is-open');
                        const file = event.target.files[0];
                        if (!file) return;

                        const url = URL.createObjectURL(file);
                        $('#checkout-instruction').text('Đang xử lý ảnh...');

                        $('#checkout-scanner-frame').addClass('scanner-screen__frame--has-image');
                        $('#checkout-captured-image').attr('src', url).show();

                        const result = await processQRFromImage(file);
                        console.log('[CheckoutModule] [openCamera] Step 1: QR Processing Result=', result);

                        if (result.ok) {
                            // const parsedResult = parseScannedData(deobfuscateData(result.text));
                            // console.log('[CheckinModule] [startScan] Step 2: Parsed Result=', parsedResult);
                            const compressedBlob = await imageCompression(file, {
                                maxSizeMB: 0.3,
                                maxWidthOrHeight: 1600,
                                useWebWorker: true,
                            });
                            if (!compressedBlob?.size) {
                                throw new Error("Compress Image Fail");
                            }

                            const compressedFile = new File([compressedBlob], `VM_CHECKOUT_${result.text}.jpg`, {
                                type: compressedBlob.type || 'image/jpeg'
                            });

                            const formData = new FormData();
                            formData.append('bib_id', result.text);
                            formData.append('match_id', CONFIG.MATCH_ID);
                            formData.append('action', CONFIG.CHECKOUT_ACTION);
                            formData.append('file', compressedFile);
                            const data = await apiRequest('c7ddfbbd-cdb9-4bf5-b9b4-c907dc433252', {
                                method: 'POST',
                                body: formData
                            });
                            downloadBlob(compressedFile, `VM_CHECKOUT_${result.text}_${Date.now()}.jpg`);

                            if (data) {
                                $('#checkout-instruction').hide();
                                this._showResultInfo(data);
                            } else {
                                throw new Error('API response invalid');
                            }
                        } else {
                            throw new Error('QR code not detected');
                        }
                    } catch (error) {
                        console.log('[CheckoutModule] [openCamera] Error:', error);
                        $('#checkout-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                        this._showManualInput();
                    } finally {
                        $('#modal').removeClass('is-open');
                    }
                };

                $('#checkout-file-input').off('change').on('change', handleResult).trigger('click');
            }

            _showResultInfo(data) {
                $(`#${this.videoId}`).hide();
                $('#checkout-bib-success').show();
                $('#checkout-bib-success-number').text(data.bib || '—');
                $('#checkout-bib-success-label').text(data.name || '—');
                $('#checkout-info-children-info').text(data.info || '—');
                $('#checkout-info-parent-name').text(data.parent_name || '—');
                $('#checkout-info-phone').text(data.parent_phone || '—');
                const isSuccess = data.status === STATUS.CHECKOUT_SUCCESS;
                const statusText = isSuccess ? 'Thành công' : 'Thất bại';
                const statusClass = isSuccess ? 'scanner-screen__info-status--success' : 'scanner-screen__info-status--error';
                $('#checkout-scanner-frame').addClass(isSuccess ? 'scanner-screen__frame--success' : 'scanner-screen__frame--active');
                $('#checkout-info-status').html(`<span class="scanner-screen__info-status ${statusClass}">${statusText}</span>`);
                if (data?.history) {
                    const historyText = data.history.map(item => {
                        const time = moment.unix(item).format('HH:mm:ss');
                        return `Check-out: ${time}`;
                    }).join('<br>');
                    $('#checkout-info-history').html(historyText);
                }
                $('#checkout-info-message').text(data.message || '—');
                $('#checkout-info-card').show();
            }

            _showManualInput() {
                $('#checkout-instruction').text('Không nhận diện được QR. Thử lại hoặc nhập thủ công số BIB').addClass('scanner-screen__instruction--error').removeClass('scanner-screen__instruction--success');
                $('#checkout-manual-bib-input, #checkout-btn-reset, #checkout-btn-confirm').show();
                $('#checkout-manual-bib-input').trigger('focus');
                $('#checkout-btn-open-camera').hide();
            }

            async confirmCheckout() {
                const bib = ($('#checkout-manual-bib-input').val() || '').trim();
                if (!bib) {
                    showToast('Vui lòng nhập số BIB', 'error', 5000);
                    return;
                }

                try {
                    $('#modal').addClass('is-open');
                    const fileInput = $('#checkout-file-input')[0];
                    const file = fileInput?.files?.[0] || null;

                    const compressedBlob = await imageCompression(file, {
                        maxSizeMB: 0.3,
                        maxWidthOrHeight: 1600,
                        useWebWorker: true,
                    });
                    if (!compressedBlob?.size) {
                        throw new Error("Compress Image Fail");
                    }

                    const compressedFile = new File([compressedBlob], `VM_CHECKOUT_${bib}.jpg`, {
                        type: compressedBlob.type || 'image/jpeg'
                    });
                    console.log('[CheckoutModule] [confirmCheckout] Step 1: Compressed File=', compressedFile);

                    const formData = new FormData();
                    formData.append('bib_id', bib);
                    formData.append('match_id', CONFIG.MATCH_ID);
                    formData.append('action', CONFIG.CHECKOUT_ACTION);
                    if (compressedFile) formData.append('file', compressedFile);
                    const data = await apiRequest('c7ddfbbd-cdb9-4bf5-b9b4-c907dc433252', {
                        method: 'POST',
                        body: formData
                    });

                    console.log('[CheckoutModule] [confirmCheckout] Step 2: API Response Data=', data);
                    downloadBlob(compressedFile, `VM_CHECKOUT_${bib}_${Date.now()}.jpg`);

                    if (data) {
                        this._showResultInfo(data);
                    } else {
                        $('#checkout-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                    }
                } catch (error) {
                    console.log('[CheckoutModule] [confirmCheckout] Error:', error);
                    $('#checkout-instruction').text('Lỗi. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                } finally {
                    $('#checkout-manual-bib-input, #checkout-btn-confirm').hide();
                    $('#checkout-btn-scan').text('Tiếp tục quét').show();
                    $('#checkout-manual-bib-input, #checkout-file-input').val('');
                    $('#modal').removeClass('is-open');
                }
            }

            goBack() {
                this.reset();
                $('#checkout-screen-wrapper').hide();
                $('#screen-manager').show();
            }

            reset() {
                // ensure any active camera is stopped (best-effort)
                try { const v = document.getElementById('checkout-video'); if (v && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); } } catch (e) { }

                // hide overlay if present
                try { $('#checkout-scan-overlay').addClass('hidden'); $('#checkout-scan-result-bib').text('—'); } catch (e) { }

                $('#checkout-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--active scanner-screen__frame--success');
                $('#checkout-instruction').text('Chụp ảnh QR trên BIB').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $(`#${this.videoId}, #checkout-corner`).show();
                $('#checkout-btn-open-camera').show();
                $('#checkout-btn-scan').show();
                $('#checkout-btn-reset').hide();
                $('#checkout-captured-image, #checkout-info-card, #checkout-btn-reset-scan, #checkout-manual-bib-input, #checkout-file-input, #checkout-btn-confirm, #checkout-bib-success').hide();
                $('#checkout-captured-image').attr('src', '');
            }
        }

                `).show();

                const checkinModule = new CheckinModule();

                $('#card-checkin').on('click', () => {

                        checkinModule.render();
                    } else {
                        $('#checkin-screen-wrapper').show();
                    }
                });

                $('#card-checkout').on('click', () => {
                    $('#screen-manager').hide();
                    if (!checkoutModule.isInit) {
                        checkoutModule.render();
                    } else {
                        $('#checkout-screen-wrapper').show();
                    }
                });

                window.checkinModule = checkinModule;
                window.checkoutModule = checkoutModule;
            }
        }

        $(document).ready(() => App.start());
    </script>
