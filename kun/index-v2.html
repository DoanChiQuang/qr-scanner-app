    <script>
        class Config {
            static API_BASE_URL = '';
        }

        class ApiService {
            static async fetch(endpoint, options = {}) {
                try {
                    const response = await fetch(`${Config.API_BASE_URL}${endpoint}`, {
                        ...options,
                        // credentials: 'include',
                    });
                    const result = await response.json();
                    if (response.code != 200) {
                        throw new Error(result.message || 'API request failed');
                    }

                    return result.data || false;
                } catch (error) {
                    console.log('[ApiService] [fetch] Error: ', error.message || 'Unknown error');
                    return false;
                }
            }
        }

        class QRScannerLibrary {
            constructor(codeReader, videoId) {
                this.videoId = videoId;
                this.codeReader = codeReader;
                this.state = {
                    isScanning: false,
                    timeoutId: null
                };
            }

            async startScan({ onSuccess, onError, onTimeout, timeout = Config.TIMEOUT_DURATION }) {
                if (this.state.isScanning) {
                    ToastService.show('Scanner Already Running', 'error', 5000);
                    return false;
                }

                this.state.isScanning = true;

                const videoElement = document.getElementById(this.videoId);
                if (videoElement) {
                    videoElement.setAttribute('playsinline', '');
                    videoElement.muted = true;
                }

                this.state.timeoutId = setTimeout(() => {
                    this.stopScan();
                    ToastService.show('Scan Timeout. Please try again', 'error', 5000);
                    if (onTimeout) onTimeout();
                }, timeout);

                try {
                    const result = await this.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result?.text) {
                        this.clearTimeout();
                        if (onSuccess) await onSuccess(result.text);
                    }
                    return true;
                } catch (error) {
                    if (this.state.isScanning) {
                        ToastService.show(`Scanning Error: ${error.message}`, 'error', 5000);
                        if (onError) onError(error);
                    }
                    return false;
                }
            }

            stopScan() {
                this.state.isScanning = false;
                this.clearTimeout();
                this.codeReader.reset();
            }

            clearTimeout() {
                if (this.state.timeoutId) {
                    clearTimeout(this.state.timeoutId);
                    this.state.timeoutId = null;
                }
            }

            isScanning() {
                return this.state.isScanning;
            }
        }

        class AuthScreen {
            constructor() {
                this.user = null;
            }

            async init() {
                this.user = await ApiService.fetch('', {
                    method: 'GET'
                });
            }

            isLoggedIn() {
                return !!this.user;
            }

            render() {
                $('#auth-screen-wrapper').html(`

                        <div class="auth-screen__header">
                            <div class="screen-manager__logo">
                                <img src="https://st-vm.vnecdn.net/v74/images/marathon/graphics/vm_new_logo.svg" alt="VnExpress Marathon">

                            <p class="auth-screen__subtitle">Nhập thông tin để tiếp tục</p>
                        </div>

                        <form class="auth-form" id="form" method="POST">
                            <div class="auth-form__group">
                                <label class="auth-form__label" for="email">Email</label>
                                <input class="auth-form__input" type="email" id="email" name="email" placeholder="email@example.com" required>
                            </div>
                            <div class="auth-form__group">
                                <label class="auth-form__label" for="password">Mật khẩu</label>
                                <input class="auth-form__input" type="password" id="password" name="password" placeholder="******" required>
                            </div>
                            <button type="submit" class="auth-form__btn" id="btn-login">Đăng nhập</button>
                        </form>

                        <div class="auth-screen__footer">
                            <p class="auth-screen__footer-text">Powered by vRace</p>
                        </div>
                    </div>
                `).show();
                this.bindEvents();
            }

            bindEvents() {
                $('#form').on('submit', async (e) => {
                    e.preventDefault();
                    const email = $('#email').val();
                    const password = $('#password').val();
                    $('#btn-login').prop('disabled', true).text('Đang đăng nhập...');
                    try {
                        const result = await ApiService.fetch('/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ email, password })
                        });

                        if (result) {
                            Toastify({
                                text: "Đăng nhập thành công",
                                duration: 3000,
                                gravity: "top",
                                position: "right",
                                backgroundColor: "#4CAF50",
                            }).showToast();
                        }
                    } catch (error) {
                        Toastify({
                            text: "Đăng nhập thất bại",
                            duration: 3000,
                            gravity: "top",
                            position: "right",
                            backgroundColor: "#FF0000",
                        }).showToast();
                    } finally {
                        $('#btn-login').prop('disabled', false).text('Đăng nhập');
                    }
                });
            }
        }
