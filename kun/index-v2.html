        class Config {
            static API_BASE_URL = '	https://webhook.site/';
            static TIMEOUT_DURATION = 10000; // 10s
        }

        class ApiService {
            static async fetch(endpoint, options = {}) {
                try {
                    const response = await fetch(`${Config.API_BASE_URL}${endpoint}`, {
                        ...options,
                        // credentials: 'include',
                    });
                    const result = await response.json();
                    if (response.code != 200) {
                        throw new Error(result.message || 'API request failed');
                    }

                    return result.data || false;
                } catch (error) {
                    console.log('[ApiService] [fetch] Error: ', error.message || 'Unknown error');
                    return false;
                }
            }
        }

        class ToastService {
            static show(message, type = 'info', duration = 3000) {
                const backgrounds = {
                    info: 'linear-gradient(to right, #00b09b, #96c93d)',
                    error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                    success: 'linear-gradient(to right, #56ab2f, #a8e063)'
                };

                Toastify({
                    text: message,
                    duration,
                    close: true,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: backgrounds[type] || backgrounds.info
                    }
                }).showToast();
            }
        }

        class QRScannerLibrary {
            constructor(codeReader, videoId) {
                this.codeReader = codeReader;
                this.videoId = videoId;
                this.isScanning = false;
                this.timeoutId = null;
            }

            async startScan({ onSuccess, onError, onTimeout, timeout = Config.TIMEOUT_DURATION }) {
                if (this.isScanning) {
                    ToastService.show('Scanner Already Running', 'error', 5000);
                    return false;
                }

                this.isScanning = true;

                const videoElement = document.getElementById(this.videoId);
                if (videoElement) {
                    videoElement.setAttribute('playsinline', '');
                    videoElement.muted = true;
                }

                this.timeoutId = setTimeout(() => {
                    this.stopScan();
                    ToastService.show('Scan Timeout. Please try again', 'error', 5000);
                    if (onTimeout) onTimeout();
                }, timeout);

                try {
                    const result = await this.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result?.text) {
                        this.clearTimeout();
                        if (onSuccess) await onSuccess(result.text);
                    }
                    return true;
                } catch (error) {
                    if (this.isScanning) {
                        ToastService.show(`Scanning Error: ${error.message}`, 'error', 5000);
                        if (onError) onError(error);
                    }
                    return false;
                }
            }

            stopScan() {
                this.isScanning = false;
                this.clearTimeout();
                this.codeReader.reset();
            }

            clearTimeout() {
                if (this.timeoutId) {
                    clearTimeout(this.timeoutId);
                    this.timeoutId = null;
                }
            }
        }

        class FileService {
            static fitContain(w, h, maxLongEdge) {
                const longEdge = Math.max(w, h);
                if (longEdge <= maxLongEdge) return { w, h };
                const scale = maxLongEdge / longEdge;
                return { w: Math.round(w * scale), h: Math.round(h * scale) };
            }

            static cropCenterROI(sourceCanvas, roiWPercent, roiHPercent) {
                const sw = sourceCanvas.width, sh = sourceCanvas.height;
                const rw = Math.max(1, Math.round(sw * roiWPercent));
                const rh = Math.max(1, Math.round(sh * roiHPercent));
                const rx = Math.round((sw - rw) / 2);
                const ry = Math.round((sh - rh) / 2);

                const c = document.createElement('canvas');
                c.width = rw; c.height = rh;
                c.getContext('2d').drawImage(sourceCanvas, rx, ry, rw, rh, 0, 0, rw, rh);
                return c;
            }

            static resizeToWidth(sourceCanvas, targetW) {
                if (sourceCanvas.width <= targetW) return sourceCanvas;
                const scale = targetW / sourceCanvas.width;
                const th = Math.max(1, Math.round(sourceCanvas.height * scale));

                const c = document.createElement('canvas');
                c.width = targetW; c.height = th;
                c.getContext('2d').drawImage(sourceCanvas, 0, 0, targetW, th);
                return c;
            }

            static downloadFile(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            }

            static compressImage(file, minSize = 300, maxSize) { // size in KB
                return new Promise((resolve, reject) => {
                    if (!file.type.startsWith('image/')) {
                        reject(new Error('File is not an image'));
                        return;
                    }

                    const img = new Image();
                    img.onload = () => {
                        const { w, h } = FileService.fitContain(img.width, img.height, 2000);
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        canvas.toBlob(blob => {
                            if (blob.size / 1024 <= minSize) {
                                resolve(blob);
                            } else if (blob.size / 1024 > minSize && blob.size / 1024 <= maxSize) {
                                resolve(blob);
                            } else {
                                reject(new Error('Compressed image exceeds maximum size'));
                            }
                        }, 'image/jpeg', 0.8);
                    };
                    img.onerror = () => reject(new Error('Failed to load image'));
                    img.src = URL.createObjectURL(file);
                });
            }
        }

                    ? 'scanner-screen__info-status--success'
                    : 'scanner-screen__info-status--error';

                $('#checkin-info-status').html(`<span class="scanner-screen__info-status ${statusClass}">${statusText}</span>`);

                $('#checkin-screen-wrapper').html(`

                            <h2 class="scanner-screen__title">Check In</h2>
                        </div>

                        <div class="scanner-screen__frame" id="checkin-scanner-frame">${this.getVideoFrameMarkup()}</div>

                        <div class="scanner-screen__content">

                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">SĐT</span><span class="scanner-screen__info-value" id="checkin-info-phone">—</span></div>
                                    <div class="scanner-screen__info-row"><span class="scanner-screen__info-label">Trạng thái</span><span class="scanner-screen__info-value" id="checkin-info-status">—</span></div>
                                </div>

                                <input class="scanner-screen__bib-input" id="checkin-manual-bib-input" type="number" inputmode="numeric" placeholder="Nhập số BIB" style="display:none" />
                                <button class="scanner-screen__btn scanner-screen__btn--primary" id="checkin-btn-confirm" style="display:none">Xác nhận</button>
                                <button class="scanner-screen__btn scanner-screen__btn--primary" id="checkin-btn-start-scan">Quét QR</button>
                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkin-btn-open-camera">Không có QR ? (Mở Camera)</button>
                                <button class="scanner-screen__btn scanner-screen__btn--secondary" id="checkin-btn-reset-scan" style="display:none">Reset</button>
                            </div>
                        </div>

                        <input type="file" id="checkin-file-input" accept="image/*" capture="environment" style="display:none" />
                    </div>
                `).show();

                this.isInit = true;
                this.scanner = new QRScannerLibrary(new ZXing.BrowserQRCodeReader(), this.videoId);

                this.handleEvents();
            }

            handleEvents() {
                $('#checkin-btn-start-scan').on('click', () => this.startScan());
                $('#checkin-btn-open-camera').on('click', () => this.openCamera());
                $('#checkin-btn-confirm').on('click', () => this.confirmCheckin());
                $('#checkin-btn-back').on('click', () => this.goBack());
                $('#checkin-btn-reset-scan').on('click', () => this.reset());
            }

            startScan() {
                $('#checkin-btn-start-scan').hide();
                $('#checkin-btn-open-camera').hide();
                $('#checkin-btn-reset-scan').show();
                $('#checkin-scanner-frame').addClass('scanner-screen__frame--active');
                $('#checkin-instruction').text('Đang quét...').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');

                const handleResult = async (result, isSuccess) => {
                    this.scanner.stopScan();
                    const data = await ApiService.fetch('902978df-abd2-4808-9a58-203bc442f7f3', {
                        method: 'POST',
                        // headers: {
                        //     'Content-Type': 'application/json'
                        // },
                        // body: JSON.stringify({ bib: result })
                    });

                    if (isSuccess && data) {
                        this.renderCheckinInfo(data);
                    } else {
                        $('#checkin-instruction').text('Quét thất bại. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                    }

                    $('#checkin-btn-start-scan').text('Tiếp tục quét').show();
                };

                this.scanner.startScan({
                    onSuccess: (result) => handleResult(result, true),
                    onError: (error) => handleResult(null, false),
                    onTimeout: () => handleResult(null, false)
                });
            }

            openCamera() {
                $('#checkin-scanner-frame').removeClass('scanner-screen__frame--has-image');
                this.renderVideoFrame();
                $('#checkin-btn-start-scan').hide();
                $('#checkin-btn-open-camera').hide();
                $('#checkin-btn-reset-scan').show();
                $('#checkin-instruction').text('Chụp ảnh BIB, sau đó nhập số BIB để Xác nhận').removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');

                const handleResult = async (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        const url = URL.createObjectURL(file);
                        $('#checkin-scanner-frame')
                            .addClass('scanner-screen__frame--has-image')
                            .html(`<img src="${url}" alt="Captured Image" width="100%" height="100%" style="object-fit: contain;" />`);

                        $('#checkin-instruction')
                            .text('Nhập số BIB, sau đó nhấn Xác nhận')
                            .removeClass('scanner-screen__instruction--error')
                            .addClass('scanner-screen__instruction--success');

                        $('#checkin-manual-bib-input').show();
                        $('#checkin-btn-confirm').show();
                        $('#checkin-manual-bib-input').trigger('focus');
                    }
                };

                $('#checkin-file-input').on('change', handleResult);
                $('#checkin-file-input').trigger('click');
            }

            async confirmCheckin() {
                const bib = ($('#checkin-manual-bib-input').val() || '').trim();
                if (!bib) {
                    ToastService.show('Vui lòng nhập số BIB', 'error', 5000);
                    return;
                }

                try {
                    $('#modal').toggleClass('is-open', true);
                    const fileInput = $('#checkin-file-input')[0];
                    const file = fileInput?.files?.[0] || null;

                    if (file) {
                        const compressedFile = await FileService.compressImage(file, 300, 500);
                        FileService.downloadFile(compressedFile, `VM_CHECKIN_${bib}_${Date.now()}.jpg`);
                    }

                    const form = new FormData();
                    form.append('bib', bib);
                    if (file) form.append('file', file);

                    const data = await ApiService.fetch('902978df-abd2-4808-9a58-203bc442f7f3', {
                        method: 'POST',
                        body: form
                    });

                    if (data) {
                        this.renderCheckinInfo(data);
                    } else {
                        $('#checkin-instruction')
                            .text('Lỗi. Vui lòng thử lại.')
                            .addClass('scanner-screen__instruction--error');
                    }

                    $('#checkin-manual-bib-input').hide().val('');
                    $('#checkin-file-input').val('');
                    $('#checkin-btn-confirm').hide();
                    $('#checkin-btn-open-camera').removeClass('scanner-screen__btn--secondary').addClass('scanner-screen__btn--primary').text('Mở Camera').show();
                } finally {
                    $('#modal').toggleClass('is-open', false);
                }
            }

            reset() {
                $('#checkin-scanner-frame').removeClass('scanner-screen__frame--has-image scanner-screen__frame--active');
                this.renderVideoFrame();
                $('#checkin-instruction').text(this.defaultInstruction).removeClass('scanner-screen__instruction--error scanner-screen__instruction--success');
                $('#checkin-info-card').hide();
                $('#checkin-btn-start-scan').text('Quét QR').show();
                $('#checkin-btn-open-camera').removeClass('scanner-screen__btn--primary')
                    .addClass('scanner-screen__btn--secondary')
                    .text('Không có QR ? (Mở Camera)')
                    .show();
                $('#checkin-btn-reset-scan').hide();
                $('#checkin-manual-bib-input').hide().val('');
                $('#checkin-file-input').val('');
                $('#checkin-btn-confirm').hide();
            }

            goBack() {
                $('#checkin-screen-wrapper').hide();
                $('#screen-manager').show();
            }
        }

                                $('#checkout-info-name').text(data.name || '—');
                                $('#checkout-info-phone').text(data.phone || '—');

                                const statusText = data.status == 3 ? 'Check-out thành công' : 'Check-out thất bại';
                                const statusClass = data.status == 3
                                    ? 'scanner-screen__info-status--success'
                                    : 'scanner-screen__info-status--error';

                                $('#checkout-info-status').html(`<span class="scanner-screen__info-status ${statusClass}">${statusText}</span>`);
                            } else {
                                $('#checkout-instruction').text('Không nhận diện được QR. Vui lòng thử lại.').addClass('scanner-screen__instruction--error');
                            }
                        } else {
                            // Thêm nhập liệu thủ công nếu không nhận diện được QR
                        }
                    }
                };

                $('#checkout-file-input').on('change', handleResult);
                $('#checkout-file-input').trigger('click');

            async processQRCodeImage(file) {
                const { readBarcodes } = ZXingWASM;
                const bitmap = await createImageBitmap(file);
                const fitted = FileService.fitContain(bitmap.width, bitmap.height, 2200);

                const master = document.createElement('canvas');
                master.width = fitted.w;
                master.height = fitted.h;
                master.getContext('2d', { willReadFrequently: true }).drawImage(bitmap, 0, 0, fitted.w, fitted.h);

                const decodeFromCanvas = async (canvas) => {
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const res = await readBarcodes(imgData);
                    return Array.isArray(res) ? res : [];
                };

                const strategies = [
                    () => decodeFromCanvas(FileService.resizeToWidth(FileService.cropCenterROI(master, 0.70, 0.85), 1200)),
                    () => decodeFromCanvas(FileService.resizeToWidth(master, 1600)),
                    () => decodeFromCanvas(FileService.resizeToWidth(master, 2400)),
                ];

                for (const strategy of strategies) {
                    const barcodes = await strategy();
                    if (barcodes.length) {
                        const text = barcodes[0]?.text || barcodes[0]?.rawValue || '';
                        if (text) return { ok: true, text, barcodes };
                    }
                }

                return { ok: false, text: '', barcodes: [] };
            }
        }
