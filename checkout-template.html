        class Logger {
            static log(module, type, message, data = null) {
                const logMessage = `[${module}] [${type}] ${message}`;
                type === 'error' ? console.error(logMessage) : console.log(logMessage);
                if (data) console.log(data);
            }
        }

        class ToastService {
            static show(message, type = 'info', duration = 3000) {
                const backgrounds = {
                    info: 'linear-gradient(to right, #00b09b, #96c93d)',
                    error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                    success: 'linear-gradient(to right, #56ab2f, #a8e063)'
                };

                Toastify({
                    text: message,
                    duration,
                    close: true,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: backgrounds[type] || backgrounds.info
                    }
                }).showToast();
            }
        }

        class ApiService {
            static async fetch(endpoint, options = {}) {
                try {
                    const response = await fetch(`${Config.API_BASE_URL}${endpoint}`, {
                        ...options,
                        credentials: 'include',
                    });
                    const result = await response.json();
                    Logger.log('ApiService', 'info', `[API][${endpoint}] Response:`, result);
                    if (result.code != 200) throw new Error(result.message || 'API request failed');
                    return result.data ? result.data : true;
                } catch (error) {
                    Logger.log('ApiService', 'error', `[API][${endpoint}]: ${error.message}`);
                    throw error;
                }
            }
        }

        class QRScannerLibrary {
            constructor(codeReader, videoId) {
                this.videoId = videoId;
                this.codeReader = codeReader;
                this.stream = null;
                this.state = {
                    isScanning: false,
                    isCameraGranted: false,
                    timeoutId: null
                };
            }

            async grantCameraPermissions() {
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    });

                    const videoElement = document.getElementById(this.videoId);
                    videoElement.srcObject = this.stream;
                    videoElement.setAttribute('playsinline', '');
                    videoElement.muted = true;
                    await videoElement.play();

                    this.state.isCameraGranted = true;
                    return true;
                } catch {
                    this.state.isCameraGranted = false;
                    return false;
                }
            }

            async startScan({ onSuccess, onError, onTimeout, timeout = Config.TIMEOUT_DURATION }) {
                Logger.log('QRScannerLibrary', 'info', 'Step 1: Starting Scanner...');

                if (this.state.isScanning) {
                    ToastService.show('Scanner Already Running', 'error', 5000);
                    return false;
                }

                this.state.isScanning = true;

                Logger.log('QRScannerLibrary', 'info', 'Step 2: Requesting Camera Permissions...');
                if (!this.state.isCameraGranted && !await this.grantCameraPermissions()) {
                    ToastService.show('Camera Access Denied', 'error', 5000);
                    this.state.isScanning = false;
                    if (onError) onError(new Error('Camera Access Denied'));
                    return false;
                }

                Logger.log('QRScannerLibrary', 'info', 'Step 3: Camera Permissions Granted, Starting Scan...');
                this.state.timeoutId = setTimeout(() => {
                    this.stopScan();
                    ToastService.show('Scan Timeout. Please try again', 'error', 5000);
                    if (onTimeout) onTimeout();
                }, timeout);

                Logger.log('QRScannerLibrary', 'info', 'Step 4: Scanning for QR Code...');
                try {
                    const result = await this.codeReader.decodeOnceFromVideoDevice(undefined, this.videoId);
                    if (result && result.text) {
                        this.clearTimeout();
                        if (onSuccess) await onSuccess(result.text);
                    }
                    return true;
                } catch (error) {
                    if (this.state.isScanning) {
                        ToastService.show(`Scanning Error: ${error.message}`, 'error', 5000);
                        if (onError) onError(error);
                    }
                    return false;
                }
            }

            async stopScan() {
                Logger.log('QRScannerLibrary', 'info', 'Stopping Scanner...');

                if (this.codeReader?.videoElement?.srcObject) {
                    this.codeReader.videoElement.srcObject.getTracks().forEach(track => track.stop());
                    this.codeReader.videoElement.srcObject = null;
                    this.codeReader.stream?.getTracks().forEach(track => track.stop());
                    this.codeReader.stream = null;
                    await this.codeReader.reset();
                }

                this.state.isScanning = false;
                this.clearTimeout();
            }

            clearTimeout() {
                if (this.state.timeoutId) {
                    clearTimeout(this.state.timeoutId);
                    this.state.timeoutId = null;
                }
            }

            async capturePicture({ onSuccess, onError, showPreview = true, previewContainer = null }) {
                Logger.log('QRScannerLibrary', 'info', 'Capturing Picture...');

                const video = document.getElementById(this.videoId);
                if (!video || !video.srcObject) {
                    ToastService.show('Camera not active', 'error', 3000);
                    if (onError) onError(new Error('Camera not active'));
                    return null;
                }

                // Wait for video to be ready
                if (!(video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0)) {
                    try {
                        await new Promise((resolve, reject) => {
                            const timeoutId = setTimeout(() => {
                                cleanup();
                                reject(new Error('Video not ready'));
                            }, 1500);

                            const onReady = () => {
                                cleanup();
                                if (video.videoWidth > 0 && video.videoHeight > 0) resolve(true);
                                else reject(new Error('Video not ready'));
                            };

                            const cleanup = () => {
                                clearTimeout(timeoutId);
                                video.removeEventListener('loadeddata', onReady);
                                video.removeEventListener('canplay', onReady);
                            };

                            video.addEventListener('loadeddata', onReady, { once: true });
                            video.addEventListener('canplay', onReady, { once: true });
                        });
                    } catch (e) {
                        ToastService.show('Camera is warming up, please try again', 'error', 2500);
                        if (onError) onError(e);
                        return null;
                    }
                }

                // Create canvas and capture
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const ctx = canvas.getContext('2d');
                if (!ctx) {
                    ToastService.show('Cannot capture image', 'error', 3000);
                    if (onError) onError(new Error('Cannot capture image'));
                    return null;
                }

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(video, 0, 0);

                const now = moment().format('YYYYMMDD_HHmmss');
                const filename = `VM_${now}.jpg`;

                // Create blob
                let blob = null;
                try {
                    blob = await new Promise((resolve, reject) => {
                        if (canvas.toBlob) {
                            canvas.toBlob((b) => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.85);
                        } else {
                            try {
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                                const parts = dataUrl.split(',');
                                const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
                                const bstr = atob(parts[1] || '');
                                let n = bstr.length;
                                const u8arr = new Uint8Array(n);
                                while (n--) u8arr[n] = bstr.charCodeAt(n);
                                resolve(new Blob([u8arr], { type: mime }));
                            } catch (err) {
                                reject(err);
                            }
                        }
                    });
                } catch (e) {
                    ToastService.show('Capture failed', 'error', 3000);
                    if (onError) onError(e);
                    return null;
                }

                const objectUrl = URL.createObjectURL(blob);

                // Show preview if requested
                if (showPreview && previewContainer) {
                    $(previewContainer).append(`
                        <div class="captured-image">
                            <img src="${objectUrl}" style="max-width:100%; margin-top:10px; border:2px solid #56ab2f;">
                        </div>
                    `);
                }

                // Download image
                try {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = objectUrl;
                    link.rel = 'noopener';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    ToastService.show('Picture saved: ' + filename, 'success', 1500);

                    // iOS fallback
                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                    if (isIOS) {
                        setTimeout(() => {
                            try { window.open(objectUrl, '_blank', 'noopener'); } catch (e) { }
                        }, 300);
                    }
                } catch (e) {
                    ToastService.show('Cannot auto-save image', 'error', 2000);
                    try { window.open(objectUrl, '_blank', 'noopener'); } catch (err) { }
                }

                if (onSuccess) onSuccess({ blob, objectUrl, filename });
                return { blob, objectUrl, filename };
            }

            isScanning() {
                return this.state.isScanning;
            }
        }

            deobfuscateData(encoded, secret = 'sEcReT123') {
                try {
                    const b64 = encoded.split('').reverse().join('')
                        .replace(/-/g, '+')
                        .replace(/_/g, '/');
                    return atob(b64).replaceAll(secret, '');
                } catch {
                    return '';
                }
            }

            parseScannedData(data) {
                if (!data || typeof data !== 'string') {
                    return {
                        version: '',
                        fields: []
                    };
                }
                const parts = data.split('|');
                return {
                    version: parts[0] || '',
                    fields: parts.slice(1)
                };
            }

                    return await ApiService.fetch('', {
                        method: 'POST',
                        body: JSON.stringify({
                            content
                        })
                    });
                } finally {
                    $(_self.selectors.modal).removeClass('active');
                }
            }

            async confirmCheckin(params) {
                let _self = this;
                $(_self.selectors.modal).addClass('active');
                try {
                    return await ApiService.fetch('', {
                        method: 'POST',
                        body: JSON.stringify(params)
                    });
                } finally {
                    $(_self.selectors.modal).removeClass('active');
                }
            }
        }

        class CheckoutModule {
            selectors = {
                main: '#main',
                container: '#scanner-frame-container',
                instruction: '.instruction-text',
                info: '.info-section',
                btnGroup: '.btn-group',
                btnReset: '#btn-reset-scan',
                btnStart: '#btn-start-scan',
                btnCapture: '#btn-capture',
                btnConfirm: '#btn-confirm',
                btnNext: '#btn-next-scan',
                modal: '#modal'
            };

            state = {
                data: null,
                isInitialized: false,
                hasResult: false,
                scanner: null
            };

            constructor() {
                let _self = this;
                _self.videoId = 'qr-video';
            }

            async init(codeReader) {
                let _self = this;
                if (_self.state.isInitialized) {
                    ToastService.show('Checkout Module Already Initialized', 'error', 5000);
                    return _self;
                }

                _self.state.isInitialized = true;
                _self.state.scanner = new QRScannerLibrary(codeReader, _self.videoId);
                _self.render();
                Logger.log('CheckoutModule', 'info', 'Initialized');
                return _self;
            }

            render() {
                let _self = this;
                $(_self.selectors.main).html(`
                    <div class="wrapper">
                        <div class="scanner-frame" id="scanner-frame-container"></div>
                        <div class="instruction-text"></div>
                        <div class="info-section"></div>
                        <div class="btn-group"></div>
                    </div>
                `);
                _self.setupDOM();
                _self.bindEvents();
            }

            setupDOM() {
                let _self = this;
                _self.state.ticketDetail = null;
                $(_self.selectors.container).html(`
                    <div class="scanner-line"></div>
                    <video id="${_self.videoId}" width="100%" height="100%"></video>
                `);
                $(_self.selectors.instruction).html('Đặt mã QR vào khung để quét').removeClass('error');
                $(_self.selectors.info).html('');
                $(_self.selectors.btnGroup).html(`
                    <a href="#" title="Reset" class="btn grey" id="btn-reset-scan">Reset</a>
                    <a href="#" title="Scan QR" class="btn" id="btn-start-scan">Scan QR</a>
                    <a href="#" title="Capture" class="btn" id="btn-capture">Capture</a>
                    <a href="#" title="Confirm" class="btn" id="btn-confirm">Confirm</a>
                    <a href="#" title="Next Scan" class="btn" id="btn-next-scan">Next Scan</a>
                `);
                $(_self.selectors.btnReset).hide();
                $(_self.selectors.btnConfirm).hide();
                $(_self.selectors.btnNext).hide();
                $(_self.selectors.btnCapture).hide();
                $(_self.selectors.btnStart).show();
            }

            updateDOM(statusCode) {
                let _self = this;
                const {
                    USER_READY_CHECKIN,
                    USER_READY_CHECKOUT
                } = Config.STATUS_CODES;
                $(_self.selectors.instruction).html('');
                $(_self.selectors.info).html('');
                $(_self.selectors.btnReset).hide();
                $(_self.selectors.btnStart).hide();
                $(_self.selectors.btnNext).hide();
                $(_self.selectors.btnCapture).hide();
                $(_self.selectors.btnConfirm).hide();

                switch (statusCode) {
                    case USER_READY_CHECKIN:
                        // $(_self.selectors.container).html(`<img src="${Config.ICONS.REMOVE}" alt="">`);
                        $(_self.selectors.info).html(_self.generateInfoRows('error', 'Chưa Check-in'));
                        $(_self.selectors.btnNext).show();
                        break;
                    case USER_READY_CHECKOUT:
                        // $(_self.selectors.container).html(`<img src="${Config.ICONS.CLOCK}" alt="">`);
                        $(_self.selectors.info).html(_self.generateInfoRows('checked', 'Sẵn sàng Check-out'));
                        $(_self.selectors.btnCapture).show();
                        $(_self.selectors.btnReset).show();
                        break;
                    default:
                        // $(_self.selectors.container).html(`<img src="${Config.ICONS.REMOVE}" alt="">`);
                        $(_self.selectors.info).html(_self.generateInfoRows('error', 'Không hợp lệ'));
                        $(_self.selectors.btnReset).show();
                        break;
                }
            }

            generateInfoRows(statusClass, statusText) {
                let _self = this;
                try {
                    return `
                        <div class="info-row"><span>Trạng thái: </span><span class="${statusClass}">${statusText}</span></div>
                        <hr>
                        <div class="info-row"><span>BiB: <strong>123456</strong></span></div>
                        <div class="info-row"><span>Họ tên: <strong>Đoàn Chí Quang</strong></span></div>
                        <div class="info-row"><span>Số điện thoại: <strong>0909000999</strong></span></div>
                        <div class="info-row"><span>Email: <strong>example@gmail.com</strong></span></div>
                    `;
                } catch (error) {
                    Logger.log('CheckinModule', 'error', error.message);
                    return 'Thông tin không hợp lệ';
                }
            }

            bindEvents() {
                let _self = this;
                $(document).on('click', _self.selectors.btnStart, () => _self.startScanner());
                $(document).on('click', _self.selectors.btnReset, () => _self.resetScanner());
                $(document).on('click', _self.selectors.btnNext, () => _self.nextScanner());
                $(document).on('click', _self.selectors.btnConfirm, () => _self.handleConfirmCheckout());
                $(document).on('click', _self.selectors.btnCapture, () => _self.capturePicture());
            }

            async resetScanner() {
                let _self = this;
                if (!_self.state.hasResult && !_self.state.scanner?.isScanning()) {
                    ToastService.show('Preparing Scanner. Please wait...', 'error', 5000);
                    return;
                }
                _self.state.hasResult = false;

                await _self.state.scanner?.stopScan();

                _self.setupDOM();
            }

            nextScanner() {
                let _self = this;
                _self.setupDOM();
                _self.startScanner();
            }

            async startScanner() {
                let _self = this;

                $(_self.selectors.btnStart).hide();
                $(_self.selectors.btnReset).show();

                await _self.state.scanner.startScan({
                    onSuccess: async (qrData) => {
                        _self.state.hasResult = true;
                        await _self.handleScanResult(qrData);
                    },
                    onError: async (error) => {
                        _self.state.hasResult = true;
                        await _self.state.scanner?.stopScan();
                        Logger.log('CheckoutModule', 'error', error.message);
                    },
                    onTimeout: async () => {
                        _self.state.hasResult = true;
                        await _self.state.scanner?.stopScan();
                        _self.resetScanner();
                    }
                });
            }

            async capturePicture() {
                let _self = this;

                $(_self.selectors.btnCapture).hide();
                $(_self.selectors.btnReset).show();
                $(_self.selectors.btnConfirm).show();

                await _self.state.scanner.capturePicture({
                    showPreview: true,
                    previewContainer: _self.selectors.info,
                    onSuccess: async (result) => {
                        _self.state.capturedBlob = result.blob;
                        await _self.state.scanner?.stopScan();
                        Logger.log('CheckoutModule', 'info', 'Picture captured:', result.filename);
                    },
                    onError: async (error) => {
                        await _self.state.scanner?.stopScan();
                        Logger.log('CheckoutModule', 'error', 'Capture failed:', error.message);
                    }
                });
            }

            async handleScanResult(data) {
                let _self = this;
                Logger.log('CheckoutModule', 'info', 'Step 4: Handling Scan Result', data);
                try {
                    console.log('Raw QR Data:', data);
                    // const content = _self.deobfuscateData(data);
                    // const parsed = _self.parseScannedData(content);

                    // Logger.log('CheckoutModule', 'info', 'Step 4.1: Deobfuscated Content:', content);
                    // Logger.log('CheckoutModule', 'info', 'Step 4.2: Parsed Result:', parsed);

                    // if (parsed.version != 1 || parsed.fields.length == 0) {
                    //     throw new Error('Invalid QR Code Data');
                    // }

                    // _self.state.data = await _self.getData(content);
                    // if (!_self.state.data) {
                    //     throw new Error('Ticket Not Found or Invalid');
                    // }

                    _self.updateDOM(2); // For Debug
                } catch (error) {
                    ToastService.show(error.message, 'error', 5000);
                }
            }

            async handleConfirmCheckout() {
                let _self = this;
                Logger.log('CheckoutModule', 'info', 'Step 5: Confirming Check-in', _self.state.ticketDetail);
                try {
                    const {
                        ticketDetail
                    } = _self.state;
                    if (!ticketDetail?.ticket_code) {
                        throw new Error('No Ticket to Confirm');
                    }

                    const params = {
                        ticket_code: ticketDetail.ticket_code,
                        order_gift_id: ticketDetail.gifts?.order_gift_id || null
                    };

                    const isConfirmed = await _self.confirmCheckout(params);
                    if (isConfirmed) {
                        _self.updateDOM(Config.STATUS_CODES.USER_CONFIRMATION_SUCCESS);
                        ToastService.show('Check-in Successful', 'success', 5000);
                    } else {
                        throw new Error('Check-in Failed');
                    }
                } catch (error) {
                    ToastService.show(error.message, 'error', 5000);
                }
            }

            deobfuscateData(encoded, secret = 'sEcReT123') {
                try {
                    const b64 = encoded.split('').reverse().join('')
                        .replace(/-/g, '+')
                        .replace(/_/g, '/');
                    return atob(b64).replaceAll(secret, '');
                } catch {
                    return '';
                }
            }

            parseScannedData(data) {
                if (!data || typeof data !== 'string') {
                    return {
                        version: '',
                        fields: []
                    };
                }
                const parts = data.split('|');
                return {
                    version: parts[0] || '',
                    fields: parts.slice(1)
                };
            }

            async getData(content) {
                let _self = this;
                $(_self.selectors.modal).addClass('active');
                try {
                    return await ApiService.fetch('', {
                        method: 'POST',
                        body: JSON.stringify({
                            content
                        })
                    });
                } finally {
                    $(_self.selectors.modal).removeClass('active');
                }
            }

            async confirmCheckout(params) {
                let _self = this;
                $(_self.selectors.modal).addClass('active');
                try {
                    return await ApiService.fetch('', {
                        method: 'POST',
                        body: JSON.stringify(params)
                    });
                } finally {
                    $(_self.selectors.modal).removeClass('active');
                }
            }
        }

        class App {
            static async start() {
                // const auth = await new AuthModule().init();
                // if (!auth.isLoggedIn()) {
                //     auth.render();
                //     return;
                // }

                new ScreenManager().render();
            }
        }

        $(document).ready(() => App.start());
    </script>
