        :root {

        @supports (height: 100svh) {

        }

        @supports (height: 100dvh) {
            :root { --app-height: 100dvh; }
        }

        html, body {

        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #FAFAFA;

        #main {
            width: 100%;
            max-width: 480px;

            margin: 0 auto;

        }

        .video-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #0C0C0C;
            border-radius: 16px;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            z-index: 10;
        }

        .corner::before, .corner::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 2px;
        }

        .corner--tl { top: 12px; left: 12px; }
        .corner--tl::before { width: 24px; height: 3px; top: 0; left: 0; }
        .corner--tl::after { width: 3px; height: 24px; top: 0; left: 0; }

        .corner--tr { top: 12px; right: 12px; }
        .corner--tr::before { width: 24px; height: 3px; top: 0; right: 0; }
        .corner--tr::after { width: 3px; height: 24px; top: 0; right: 0; }

        .corner--bl { bottom: 12px; left: 12px; }
        .corner--bl::before { width: 24px; height: 3px; bottom: 0; left: 0; }
        .corner--bl::after { width: 3px; height: 24px; bottom: 0; left: 0; }

        .corner--br { bottom: 12px; right: 12px; }
        .corner--br::before { width: 24px; height: 3px; bottom: 0; right: 0; }
        .corner--br::after { width: 3px; height: 24px; bottom: 0; right: 0; }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-loading {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
        }

        .modal-loading.is-open {
            display: flex;
        }

        .result-item {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .captured-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a1a1a;
        }

        .countdown-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            font-size: 72px;
            font-weight: bold;
            color: white;
            z-index: 20;
        }

        .countdown-overlay.is-visible {
            display: flex;
        }
    </style>

    <script>
        // ========================================
        // CONFIGURATION
        // ========================================
        const CONFIG = {
            API_BASE_URL: '',
            TIMEOUT_DURATION: 15000,
            CHECKIN_ACTION: 1,
            CHECKOUT_ACTION: 2,
            MATCH_ID: '<?php echo $this->matchId ?>'
        };

        const STATUS = {
            CHECKIN_SUCCESS: 2,
            CHECKOUT_SUCCESS: 3
        };

        // ========================================
        // UTILITIES
        // ========================================
        function setSessionCookie(name, value) {
            document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) + '; path=/';
        }

        function getSessionCookie(name) {
            const match = document.cookie.match(new RegExp('(?:^|; )' + encodeURIComponent(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
            return match ? decodeURIComponent(match[1]) : null;
        }

        function deleteCookie(name) {
            document.cookie = encodeURIComponent(name) + '=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
        }

        function showToast(message, type = 'info', duration = 3000) {
            const styles = {
                info: 'linear-gradient(to right, #00b09b, #96c93d)',
                error: 'linear-gradient(to right, #ff5f6d, #ffc371)',
                success: 'linear-gradient(to right, #56ab2f, #a8e063)'
            };

            Toastify({
                text: message,
                duration,
                close: true,
                gravity: 'top',
                position: 'center',
                style: {
                    background: styles[type] || styles.info
                }
            }).showToast();
        }

        function parseQRCode(qrText) {
            if (!qrText || typeof qrText !== 'string') return '';
            return qrText.substring(5, qrText.length - 5);
        }

        async function apiRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, {
                    mode: 'cors',
                    credentials: 'include',
                    ...options,
                });
                const result = await response.json();
                if (result.code != 200) {
                    throw new Error(result.message || 'API request failed');
                }
                return result.data || false;
            } catch (error) {
                console.log('[API] Error:', error.message);
                return {
                    code: 500,
                    message: error.message
                };
            }
        }

        function captureImage(videoEl) {
            return new Promise((resolve, reject) => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = videoEl.videoWidth || 1280;
                    canvas.height = videoEl.videoHeight || 720;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(blob => {
                        if (!blob) return reject(new Error('Capture failed'));
                        resolve(blob);
                    }, 'image/jpeg', 0.92);
                } catch (err) {
                    reject(err);
                }
            });
        }

        // ========================================
        // QR SCANNER (Base class using ZXing WASM)
        // ========================================
        class QRScanner {
            constructor(videoId, options = {}) {
                this.videoId = videoId;
                this.isScanning = false;
                this.stream = null;
                this.rafId = null;
                this.timeoutId = null;
                this.shouldCapture = options.shouldCapture || false;
            }

            async requestCameraStream() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Camera API not supported');
                }

                try {
                    return await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { min: 1280, ideal: 2560 },
                            height: { min: 720, ideal: 1440 }
                        }
                    });
                } catch (e) {
                    return await navigator.mediaDevices.getUserMedia({ video: true });
                }
            }

            async initVideo(videoEl, stream) {
                if (!videoEl) return;
                videoEl.srcObject = stream;
                videoEl.setAttribute('playsinline', '');
                videoEl.muted = true;
                await videoEl.play();
            }

            startDetectionLoop({ video, onBarcode, onError }) {
                let running = true;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const loop = async () => {
                    if (!running || !this.isScanning) return;
                    try {
                        canvas.width = video.videoWidth || 1280;
                        canvas.height = video.videoHeight || 720;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                        const { readBarcodes } = ZXingWASM;
                        const res = await readBarcodes(imgData, {
                            tryHarder: true,
                            tryInvert: true,
                            tryRotate: true,
                            tryDownscale: true,
                            formats: ['QRCode'],
                            maxNumberOfSymbols: 1
                        });

                        if (Array.isArray(res) && res.length) {
                            const text = res[0]?.text || res[0]?.rawValue || '';
                            if (text) {
                                running = false;
                                if (onBarcode) await onBarcode(text);
                                return;
                            }
                        }
                    } catch (err) {
                        if (onError) onError(err);
                    }
                    this.rafId = requestAnimationFrame(loop);
                };

                this.rafId = requestAnimationFrame(loop);

                return {
                    stop() {
                        running = false;
                        if (this.rafId) cancelAnimationFrame(this.rafId);
                    }
                };
            }

            async start(options = {}) {
                const { onSuccess, onError, onTimeout, timeout = CONFIG.TIMEOUT_DURATION } = options;

                if (this.isScanning) {
                    showToast('Scanner đang chạy', 'error', 2000);
                    return false;
                }

                this.isScanning = true;
                const video = document.getElementById(this.videoId);

                try {
                    this.stream = await this.requestCameraStream();
                    await this.initVideo(video, this.stream);

                    this.timeoutId = setTimeout(() => {
                        this.stop();
                        if (onTimeout) onTimeout();
                    }, timeout);

                    this.controller = this.startDetectionLoop({
                        video,
                        onBarcode: async (text) => {
                            try {
                                let result = { text };
                                if (this.shouldCapture) {
                                    const blob = await captureImage(video);
                                    const compressedBlob = await imageCompression(blob, {
                                        maxSizeMB: 0.3,
                                        maxWidthOrHeight: 1600,
                                        useWebWorker: true,
                                    });
                                    if (!compressedBlob?.size) {
                                        throw new Error('Compress Image Fail');
                                    }
                                    result.file = new File([compressedBlob], `KID_CHECKOUT_${Date.now()}.jpg`, {
                                        type: compressedBlob.type || 'image/jpeg'
                                    });
                                }
                                this.stop();
                                if (onSuccess) onSuccess(result);
                            } catch (err) {
                                if (onError) onError(err);
                            }
                        },
                        onError: (err) => {
                            if (onError) onError(err);
                        }
                    });

                    return true;
                } catch (err) {
                    this.stop();
                    if (onError) onError(err);
                    return false;
                }
            }

            stop() {
                this.isScanning = false;
                if (this.timeoutId) {
                    clearTimeout(this.timeoutId);
                    this.timeoutId = null;
                }
                if (this.rafId) {
                    cancelAnimationFrame(this.rafId);
                    this.rafId = null;
                }
                if (this.controller) {
                    try { this.controller.stop(); } catch (e) {}
                    this.controller = null;
                }
                if (this.stream) {
                    this.stream.getTracks().forEach(t => t.stop());
                    this.stream = null;
                }
            }
        }

        // ========================================
        // AUTH SCREEN
        // ========================================
        class AuthScreen {
            constructor() {
                this.session = getSessionCookie('kid_session');
            }

            isLoggedIn() {
                return !!this.session;
            }

            render(onSuccess) {
                $('#auth-screen').removeClass('hidden').show();
                $('#screen-manager, #checkin-screen, #checkout-screen').hide();

                $('#login-form').off('submit').on('submit', async (e) => {
                    e.preventDefault();
                    const username = $('#username').val().trim();
                    const password = $('#password').val().trim();

                    if (!username || !password) {
                        showToast('Vui lòng nhập đầy đủ thông tin', 'error');
                        return;
                    }

                    try {
                        $('#modal-loading').addClass('is-open');

                        const formData = new FormData();
                        formData.append('username', username);
                        formData.append('password', password);

                        const data = await apiRequest('kun/checkinout-login', {
                            method: 'POST',
                            body: formData
                        });

                        if (!data) {
                            showToast('Đăng nhập thất bại', 'error');
                            $('#modal-loading').removeClass('is-open');
                            return;
                        }

                        this.session = username;
                        setSessionCookie('kid_session', username);
                        showToast('Xin chào, ' + username, 'success');
                        $('#auth-screen').hide();
                        if (onSuccess) onSuccess();

                    } catch (err) {
                        showToast(err.message || 'Đăng nhập thất bại', 'error');
                    } finally {
                        $('#modal-loading').removeClass('is-open');
                    }
                });
            }

            logout() {
                this.session = null;
                deleteCookie('kid_session');
                this.render(() => App.showScreenManager());
            }
        }

        // ========================================
        // CHECKIN MODULE (Scan liên tục, không chụp)
        // ========================================
        class CheckinModule {
            constructor() {
                this.videoId = 'checkin-video';
                this.scanner = null;
                this.results = [];
                this.isProcessing = false;
            }

            render() {
                $('#checkin-screen').removeClass('hidden').show();
                $('#screen-manager, #auth-screen, #checkout-screen').hide();
                this.resetUI();
                this.bindEvents();
            }

            resetUI() {
                $('#checkin-video').hide();
                $('#checkin-corners').hide();
                $('#checkin-alert').hide().removeClass('bg-successLight text-success bg-errorLight text-error');
                $('#checkin-btn-scan').text('Quét QR').prop('disabled', false);
                this.results = [];
                this.renderResults();
            }

            bindEvents() {
                $('#checkin-btn-back').off('click').on('click', () => this.goBack());
                $('#checkin-btn-scan').off('click').on('click', () => this.startScan());
            }

            renderResults() {
                const $container = $('#checkin-results');
                if (this.results.length === 0) {
                    $container.html('<div class="text-center py-8 text-gray-400 text-sm">Chưa có kết quả nào</div>');
                    return;
                }

                const html = this.results.map((item, index) => `
                    <div class="result-item bg-white rounded-xl p-3 border border-gray-100 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${item.success ? 'bg-successLight' : 'bg-errorLight'}">
                            ${item.success
                                ? '<svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
                                : '<svg class="w-5 h-5 text-error" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>'
                            }
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-gray-900">${item.bib || '—'}</div>
                            <div class="text-xs text-gray-500">${item.name || item.message || '—'}</div>
                        </div>
                        <div class="text-xs text-gray-400">${item.time}</div>
                    </div>
                `).join('');

                $container.html(html);
            }

            async startScan() {
                if (this.isProcessing) return;

                this.isProcessing = true;
                $('#checkin-video').show();
                $('#checkin-corners').show();
                $('#checkin-alert').hide();
                $('#checkin-btn-scan').text('Đang quét...').prop('disabled', true);

                try {
                    this.scanner = new QRScanner(this.videoId, { shouldCapture: false });
                    const started = await this.scanner.start({
                        onSuccess: async ({ text }) => {
                            await this.processQR(text);
                            this.isProcessing = false;
                            $('#checkin-btn-scan').text('Tiếp tục quét').prop('disabled', false);
                            this.startScan();
                        },
                        onError: (err) => {
                            console.error('Scan error:', err);
                            this.showAlert('Không nhận diện được QR', 'error');
                            this.isProcessing = false;
                            $('#checkin-btn-scan').text('Tiếp tục quét').prop('disabled', false);
                        },
                        onTimeout: () => {
                            this.showAlert('Hết thời gian quét', 'error');
                            this.isProcessing = false;
                            $('#checkin-btn-scan').text('Tiếp tục quét').prop('disabled', false);
                        },
                        timeout: CONFIG.TIMEOUT_DURATION
                    });

                    if (!started) {
                        this.showAlert('Không mở được Camera', 'error');
                        this.isProcessing = false;
                        $('#checkin-btn-scan').text('Quét QR').prop('disabled', false);
                    }
                } catch (err) {
                    console.error('Start scan error:', err);
                    this.showAlert('Lỗi: ' + err.message, 'error');
                    this.isProcessing = false;
                    $('#checkin-btn-scan').text('Quét QR').prop('disabled', false);
                }
            }

            async processQR(qrText) {
                const bib = parseQRCode(qrText);
                console.log('[Checkin] QR Text:', qrText, '-> BIB:', bib);

                if (!bib) {
                    this.addResult({ bib: qrText, success: false, message: 'QR không hợp lệ' });
                    this.showAlert('QR không hợp lệ', 'error');
                    return;
                }

                try {
                    const formData = new FormData();
                    formData.append('bib_id', bib);
                    formData.append('match_id', CONFIG.MATCH_ID);
                    formData.append('action', CONFIG.CHECKIN_ACTION);

                    const data = await apiRequest('kun/checkinout-confirm', {
                        method: 'POST',
                        body: formData
                    }, true);

                    const isSuccess = data?.status === STATUS.CHECKIN_SUCCESS;

                    if (isSuccess) {
                        this.addResult({
                            bib: data.bib || bib,
                            name: data.name || '',
                            success: true
                        });
                        this.showAlert('Check-in thành công!', 'success');
                    } else {
                        this.addResult({
                            bib,
                            success: false,
                            message: data?.message || 'Check-in thất bại'
                        });
                        this.showAlert(data?.message || 'Check-in thất bại', 'error');
                    }
                } catch (err) {
                    this.addResult({ bib, success: false, message: err.message });
                    this.showAlert('Lỗi: ' + err.message, 'error');
                }
            }

            addResult(item) {
                item.time = moment().format('HH:mm:ss');
                this.results.unshift(item);
                this.renderResults();
            }

            showAlert(message, type) {
                const $alert = $('#checkin-alert');
                $alert.text(message)
                    .removeClass('hidden bg-successLight text-success bg-errorLight text-error')
                    .addClass(type === 'success' ? 'bg-successLight text-success' : 'bg-errorLight text-error');
            }

            goBack() {
                if (this.scanner) {
                    try { this.scanner.stop(); } catch (e) {}
                    this.scanner = null;
                }
                this.isProcessing = false;
                $('#checkin-screen').hide();
                $('#screen-manager').show();
            }
        }

        // ========================================
        // CHECKOUT MODULE (Scan + Chụp, Queue xử lý)
        // ========================================
        class CheckoutModule {
            constructor() {
                this.videoId = 'checkout-video';
                this.scanner = null;
                this.results = [];
                this.isProcessing = false;
                this.isQueueRunning = false;
            }

            render() {
                $('#checkout-screen').removeClass('hidden').show();
                $('#screen-manager, #auth-screen, #checkin-screen').hide();
                this.resetUI();
                this.bindEvents();
            }

            resetUI() {
                $('#checkout-video').hide();
                $('#checkout-corners').hide();
                $('#checkout-countdown').removeClass('is-visible').text('');
                $('#checkout-alert').hide().removeClass('bg-successLight text-success bg-errorLight text-error');
                $('#checkout-btn-scan').text('Quét QR').prop('disabled', false);
                this.results = [];
                this.renderResults();
            }

            bindEvents() {
                $('#checkout-btn-back').off('click').on('click', () => this.goBack());
                $('#checkout-btn-scan').off('click').on('click', () => this.startScan());
            }

            renderResults() {
                const $container = $('#checkout-results');
                if (this.results.length === 0) {
                    $container.html('<div class="text-center py-8 text-gray-400 text-sm">Chưa có kết quả nào</div>');
                    return;
                }

                const html = this.results.map((item) => `
                    <div class="result-item bg-white rounded-xl p-3 border border-gray-100 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${item.success ? 'bg-successLight' : 'bg-errorLight'}">
                            ${item.success
                                ? '<svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
                                : '<svg class="w-5 h-5 text-error" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>'
                            }
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-gray-900">${item.bib || '—'}</div>
                            <div class="text-xs text-gray-500">${item.name || item.message || '—'}</div>
                        </div>
                        <div class="text-xs text-gray-400">${item.time}</div>
                    </div>
                `).join('');

                $container.html(html);
            }

            async startScan() {
                if (this.isProcessing) return;

                this.isProcessing = true;
                $('#checkout-video').show();
                $('#checkout-corners').show();
                $('#checkout-alert').hide();
                $('#checkout-btn-scan').text('Đang quét...').prop('disabled', true);

                await this.showCountdown(1000);

                try {
                    this.scanner = new QRScanner(this.videoId, { shouldCapture: true });
                    const started = await this.scanner.start({
                        onSuccess: async ({ text, file }) => {
                            $('#checkout-video').hide();
                            $('#checkout-corners').hide();
                            await this.processQR(text, file);
                            this.isProcessing = false;
                            $('#checkout-btn-scan').text('Quét tiếp').prop('disabled', false);
                        },
                        onError: (err) => {
                            console.error('Scan error:', err);
                            this.showAlert('Không nhận diện được QR', 'error');
                            this.isProcessing = false;
                            $('#checkout-video').hide();
                            $('#checkout-corners').hide();
                            $('#checkout-btn-scan').text('Quét tiếp').prop('disabled', false);
                        },
                        onTimeout: () => {
                            this.showAlert('Hết thời gian quét', 'error');
                            this.isProcessing = false;
                            $('#checkout-video').hide();
                            $('#checkout-corners').hide();
                            $('#checkout-btn-scan').text('Quét tiếp').prop('disabled', false);
                        },
                        timeout: CONFIG.TIMEOUT_DURATION
                    });

                    if (!started) {
                        this.showAlert('Không mở được Camera', 'error');
                        this.isProcessing = false;
                        $('#checkout-btn-scan').text('Quét QR').prop('disabled', false);
                    }
                } catch (err) {
                    console.error('Start scan error:', err);
                    this.showAlert('Lỗi: ' + err.message, 'error');
                    this.isProcessing = false;
                    $('#checkout-btn-scan').text('Quét QR').prop('disabled', false);
                }
            }

            async showCountdown(ms) {
                const $countdown = $('#checkout-countdown');
                const end = Date.now() + ms;

                return new Promise(resolve => {
                    $countdown.addClass('is-visible');
                    const tick = () => {
                        const remaining = Math.ceil((end - Date.now()) / 1000);
                        if (remaining > 0) {
                            $countdown.text(remaining);
                            requestAnimationFrame(tick);
                        } else {
                            $countdown.removeClass('is-visible').text('');
                            resolve();
                        }
                    };
                    tick();
                });
            }

            async processQR(qrText, file) {
                const bib = parseQRCode(qrText);
                console.log('[Checkout] QR Text:', qrText, '-> BIB:', bib);

                if (!bib) {
                    this.addResult({ bib: qrText, success: false, message: 'QR không hợp lệ' });
                    this.showAlert('QR không hợp lệ', 'error');
                    return;
                }

                try {
                    const formData = new FormData();
                    formData.append('bib_id', bib);
                    formData.append('match_id', CONFIG.MATCH_ID);
                    formData.append('action', CONFIG.CHECKOUT_ACTION);
                    if (file) formData.append('file', file);

                    const data = await apiRequest('kun/checkinout-confirm', {
                        method: 'POST',
                        body: formData
                    }, true);

                    const isSuccess = data?.status === STATUS.CHECKOUT_SUCCESS;

                    if (isSuccess) {
                        this.addResult({
                            bib: data.bib || bib,
                            name: data.name || '',
                            success: true
                        });
                        this.showAlert('Check-out thành công!', 'success');
                    } else {
                        this.addResult({
                            bib,
                            success: false,
                            message: data?.message || 'Check-out thất bại'
                        });
                        this.showAlert(data?.message || 'Check-out thất bại', 'error');
                    }
                } catch (err) {
                    this.addResult({ bib, success: false, message: err.message });
                    this.showAlert('Lỗi: ' + err.message, 'error');
                }
            }

            addResult(item) {
                item.time = moment().format('HH:mm:ss');
                this.results.unshift(item);
                this.renderResults();
            }

            showAlert(message, type) {
                const $alert = $('#checkout-alert');
                $alert.text(message)
                    .removeClass('hidden bg-successLight text-success bg-errorLight text-error')
                    .addClass(type === 'success' ? 'bg-successLight text-success' : 'bg-errorLight text-error');
            }

            goBack() {
                if (this.scanner) {
                    try { this.scanner.stop(); } catch (e) {}
                    this.scanner = null;
                }
                this.isProcessing = false;
                $('#checkout-screen').hide();
                $('#screen-manager').show();
            }
        }

        // ========================================
        // APP
        // ========================================
        class App {
            static async start() {
                const authScreen = new AuthScreen();
                if (!authScreen.isLoggedIn()) {
                    authScreen.render(() => App.showScreenManager());
                    return;
                }
                App.showScreenManager();
            }

            static showScreenManager() {
                $('#screen-manager').removeClass('hidden').show();
                $('#auth-screen, #checkin-screen, #checkout-screen').hide();

                const checkinModule = new CheckinModule();
                const checkoutModule = new CheckoutModule();

                $('#card-checkin').off('click').on('click', () => {
                    $('#screen-manager').hide();
                    checkinModule.render();
                });

                $('#card-checkout').off('click').on('click', () => {
                    $('#screen-manager').hide();
                    checkoutModule.render();
                });

                $('#btn-logout').off('click').on('click', () => {
                    const authScreen = new AuthScreen();
                    authScreen.logout();
                });
            }
        }

        // ========================================
        // INITIALIZE
        // ========================================
        $(document).ready(() => App.start());
    </script>
</body>
