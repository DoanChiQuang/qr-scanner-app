<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera Capture (Auto Download)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 16px;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        .camera {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #f6f6f6;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .meta {
            margin-top: 10px;
            font-size: 13px;
            color: #333;
            line-height: 1.4;
        }

        .preview img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #eee;
            margin-top: 12px;
            display: none;
        }

        .note {
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid #f2d6a3;
            background: #fff7e6;
            border-radius: 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h2>Mở camera sau + chụp ảnh rõ + tự tải về</h2>

        <div class="camera">
            <video id="video" autoplay playsinline muted></video>
        </div>

        <div class="controls">
            <button id="btnStart">Mở camera sau</button>
            <button id="btnShot" disabled>Chụp & tải</button>
            <button id="btnStop" disabled>Dừng</button>
        </div>

        <div id="meta" class="meta"></div>
        <div class="note">Camera web cần HTTPS (hoặc localhost). iOS Safari thường yêu cầu thao tác bấm nút.</div>

        <img id="preview" alt="preview">

        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        (() => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const preview = document.getElementById('preview');

            const btnStart = document.getElementById('btnStart');
            const btnShot = document.getElementById('btnShot');
            const btnStop = document.getElementById('btnStop');
            const meta = document.getElementById('meta');

            let stream = null;
            let lastObjectUrl = null;

            function stopCamera() {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                video.srcObject = null;
                btnShot.disabled = true;
                btnStop.disabled = true;
                meta.textContent = '';
            }

            async function startCamera() {
                stopCamera();

                const constraints = {
                    audio: false,
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();

                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings ? track.getSettings() : {};
                meta.textContent = `Stream: ${settings.width || '?'}x${settings.height || '?'} | facingMode=${settings.facingMode || 'unknown'}`;

                btnShot.disabled = false;
                btnStop.disabled = false;
            }

            function drawCurrentFrame() {
                const w = video.videoWidth;
                const h = video.videoHeight;
                if (!w || !h) throw new Error('Video chưa sẵn sàng để chụp.');

                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d', { alpha: false }).drawImage(video, 0, 0, w, h);
            }

            function setObjectUrl(blob) {
                if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
                lastObjectUrl = URL.createObjectURL(blob);
                return lastObjectUrl;
            }

            async function canvasToBlob(type, quality) {
                return await new Promise(resolve => canvas.toBlob(resolve, type, quality));
            }

            function downscaleCanvas(scale) {
                const newW = Math.max(1, Math.round(canvas.width * scale));
                const newH = Math.max(1, Math.round(canvas.height * scale));
                const tmp = document.createElement('canvas');
                tmp.width = newW;
                tmp.height = newH;
                tmp.getContext('2d', { alpha: false }).drawImage(canvas, 0, 0, newW, newH);

                canvas.width = newW;
                canvas.height = newH;
                canvas.getContext('2d', { alpha: false }).drawImage(tmp, 0, 0);
            }

            async function compressToTarget({
                targetMinKB = 300,
                targetMaxKB = 500,
                startQuality = 0.92,
                minQuality = 0.65,
                qualityStep = 0.07,
                downscaleStep = 0.85,
                maxIters = 12
            } = {}) {
                let quality = startQuality;

                for (let i = 0; i < maxIters; i++) {
                    const blob = await canvasToBlob('image/jpeg', quality);
                    const sizeKB = blob.size / 1024;

                    if (sizeKB >= targetMinKB && sizeKB <= targetMaxKB) return blob;

                    if (sizeKB > targetMaxKB && quality > minQuality) {
                        quality = Math.max(minQuality, quality - qualityStep);
                        continue;
                    }

                    if (sizeKB > targetMaxKB) {
                        downscaleCanvas(downscaleStep);
                        quality = Math.min(0.90, quality + 0.05);
                        continue;
                    }

                    if (sizeKB < targetMinKB) {
                        quality = Math.min(0.95, quality + 0.03);
                        continue;
                    }

                    return blob;
                }

                return await canvasToBlob('image/jpeg', 0.82);
            }

            // TỰ TẢI VỀ MÁY (tạo <a download> và click)
            function autoDownload(blob, filename) {
                const url = setObjectUrl(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();

                // Không revoke ngay lập tức để tránh Safari chưa kịp tải
                setTimeout(() => {
                    if (lastObjectUrl) {
                        URL.revokeObjectURL(lastObjectUrl);
                        lastObjectUrl = null;
                    }
                }, 15000);
            }

            async function takePhotoAndDownload() {
                drawCurrentFrame();

                const blob = await compressToTarget({ targetMinKB: 300, targetMaxKB: 500 });

                // Preview (tuỳ chọn)
                const previewUrl = setObjectUrl(blob);
                preview.src = previewUrl;
                preview.style.display = 'block';

                // Auto download
                autoDownload(blob, `photo_${Date.now()}.jpg`);
            }

            btnStart.addEventListener('click', () => startCamera().catch(e => alert('Không mở được camera: ' + e.message)));
            btnShot.addEventListener('click', () => takePhotoAndDownload().catch(e => alert('Không chụp được: ' + e.message)));
            btnStop.addEventListener('click', stopCamera);

            window.addEventListener('pagehide', stopCamera);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') stopCamera();
            });
        })();
    </script>
</body>

</html>
